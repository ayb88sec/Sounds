<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="profile.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<title>CVC Words</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="kit.css?v=7">
<style>
body{background:linear-gradient(160deg,#22c7b8,#4f8bff 50%,#a66bff)}
.vowels{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.vowels button{font-family:"Andika";font-size:26px;font-weight:700;border:0;border-radius:16px;width:56px;height:56px;cursor:pointer;background:#f3f0fa;color:var(--ink)}
.vowels button.on{background:#ffe066;box-shadow:0 4px 0 #d9a400}
.bme{display:flex;gap:10px;justify-content:center;margin:10px 0}
.bme div{width:84px;border-radius:18px;background:#f3f0fa;padding:6px 0}
.bme b{display:block;font-family:"Andika";font-size:46px;min-height:62px;line-height:62px}
.bme span{font-family:"Baloo 2";font-size:14px;font-weight:800;color:#7a7090}
.bme div.cur{box-shadow:0 0 0 4px #ffe066;background:#fffbe6}
.bme div.ok b{color:#2a9442}
.pane{display:none}.pane.on{display:block}
.intro{text-align:center;font-family:"Baloo 2";font-size:19px;color:#5b5370;margin:0 0 12px}
</style>
</head>
<body>
<main>
  <h1>CVC Words</h1>
  <div class="tabs" id="tabs"><button data-p="learn" class="on">📖 Words</button><button data-p="blend">🔊 Blend</button><button data-p="bme">🏷️ B · M · E</button><button data-p="write">✏️ Write</button></div>
  <section>
    <div class="pane on" id="learn"><div class="vowels" id="vw"></div><div class="grid" id="grid"></div></div>
    <div class="pane" id="blend"><p class="intro">Listen to the sounds, blend them, and find the picture!</p><div class="bar"><button class="btn pink" id="startBlend">🔊 Start blending</button></div></div>
    <div class="pane" id="bme"><p class="intro">Look at the picture. What is the <b>beginning</b>, <b>middle</b> and <b>end</b> sound?</p><div class="bar"><button class="btn pink" id="startBme">🏷️ Start labelling</button></div></div>
    <div class="pane" id="write"><div class="vowels" id="vw2"></div><div class="grid" id="wgrid"></div></div>
  </section>
</main>

<div class="modal" id="wordM"><div class="card">
  <button class="x" data-close>✕</button>
  <div class="pic" id="wPic"></div>
  <div class="snd" id="wSnd"></div>
  <div class="bar"><button class="btn" id="wBlend">🔊 Sound it out</button><button class="btn teal" id="wWrite">✏️ Write it</button></div>
</div></div>

<div class="modal" id="blendM"><div class="card">
  <button class="x" data-close>✕</button>
  <div class="q">Listen and blend…</div>
  <div class="snd" id="bSnd"></div>
  <div class="bar" style="margin:4px 0"><button class="btn ghost" id="bAgain">🔊 Again</button></div>
  <div class="opts" id="bOpts"></div><div class="score" id="bScore"></div>
</div></div>

<div class="modal" id="bmeM"><div class="card">
  <button class="x" data-close>✕</button>
  <div class="pic" id="mPic"></div>
  <div class="bar" style="margin:0"><button class="btn ghost" id="mHear">🔊 Hear the word</button></div>
  <div class="q" id="mQ" style="margin-top:10px"></div>
  <div class="bme" id="mSlots"><div><b></b><span>BEGINNING</span></div><div><b></b><span>MIDDLE</span></div><div><b></b><span>END</span></div></div>
  <div class="opts" id="mOpts"></div><div class="score" id="mScore"></div>
</div></div>

<script src="writepad.js"></script>
<script src="kit.js?v=7"></script>
<script>
const {COLORS,rnd,shuffle,pop,fanfare,buzz,burstAt,rain,say,sound,blend,talk,PRAISE}=KIT;
KIT.mascot("Tap a word and sound it out with me!");
const W={a:[["cat","🐱"],["bat","🦇"],["hat","🎩"],["map","🗺️"],["van","🚐"],["fan","🪭"],["can","🥫"],["rat","🐀"],["bag","👜"],["cap","🧢"],["pan","🍳"],["man","👨"]],
 e:[["bed","🛏️"],["hen","🐔"],["net","🥅"],["pen","🖊️"],["web","🕸️"],["jet","✈️"],["leg","🦵"],["ten","🔟"],["red","🔴"],["wet","💦"]],
 i:[["pig","🐷"],["pin","📌"],["bin","🗑️"],["lip","👄"],["zip","🤐"],["six","6️⃣"],["kid","🧒"],["fin","🦈"],["dig","⛏️"],["wig","💇"]],
 o:[["dog","🐶"],["log","🪵"],["box","📦"],["fox","🦊"],["pot","🍲"],["mop","🧹"],["hot","🔥"],["top","🔝"],["cot","🛌"],["hop","🐸"]],
 u:[["sun","☀️"],["bus","🚌"],["cup","☕"],["bug","🐛"],["nut","🥜"],["hut","🛖"],["mud","🟫"],["rug","🧶"],["gum","🍬"],["pup","🐶"]]};
const AV=NAJMA.lv("cvc").map(i=>"aeiou"[i]);
const ALL=AV.flatMap(v=>W[v]).filter(([w])=>!["cot","mud","rug","gum","top","wig","wet","kid","dig","hop","man","fin"].includes(w));
const prog=KIT.store("cvcDone");const mark=w=>{prog.d[w]=1;prog.save();document.querySelectorAll(`.tile[data-w="${w}"]`).forEach(t=>t.classList.add("done"))};
let vw=AV[0]||"a";
/* tabs */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{pop();document.querySelectorAll("#tabs button,.pane").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(b.dataset.p).classList.add("on")});
function vowels(id,draw){const box=document.getElementById(id);box.innerHTML="";AV.forEach(v=>{const b=document.createElement("button");b.textContent=v;if(v===vw)b.className="on";
  b.onclick=()=>{vw=v;pop();sound(v);vowels("vw",drawLearn);vowels("vw2",drawWrite);drawLearn();drawWrite()};box.appendChild(b)})}
function tile(w,e,i,on){const b=document.createElement("button");b.className="tile"+(prog.d[w]?" done":"");b.dataset.w=w;b.style.background=COLORS[i%6];b.style.animationDelay=(i*.03)+"s";
  b.innerHTML=`<span class="e">${e}</span>${w}`;b.onclick=()=>on(b);return b}
function drawLearn(){const g=document.getElementById("grid");g.innerHTML="";W[vw].forEach(([w,e],i)=>g.appendChild(tile(w,e,i,b=>openWord(w,e,b))))}
function drawWrite(){const g=document.getElementById("wgrid");g.innerHTML="";W[vw].forEach(([w,e],i)=>g.appendChild(tile(w,e,i,()=>writeW(W[vw].map(x=>x[0]),i))))}
vowels("vw",drawLearn);vowels("vw2",drawWrite);drawLearn();drawWrite();

/* word card: tap each sound, then blend */
function sndRow(id,word,hidden){const box=document.getElementById(id);box.innerHTML="";
  [...word].forEach((c,i)=>{const b=document.createElement("button");b.textContent=hidden?"?":c;b.style.background=COLORS[(i*2+1)%6];b.onclick=()=>{sound(c);lit(id,i)};box.appendChild(b)})}
function lit(id,i){const bs=[...document.getElementById(id).children];bs.forEach((b,k)=>b.classList.toggle("lit",k===i||i===-1));if(i===-1)setTimeout(()=>bs.forEach(b=>b.classList.remove("lit")),800)}
function openWord(w,e,el){pop();if(el)burstAt(el);document.getElementById("wPic").textContent=e;document.getElementById("wPic").onclick=()=>say(w);
  sndRow("wSnd",w);document.getElementById("wBlend").onclick=()=>blend(w,i=>lit("wSnd",i));
  document.getElementById("wWrite").onclick=()=>writeW([w],0);
  document.getElementById("wordM").classList.add("show");setTimeout(()=>blend(w,i=>lit("wSnd",i)),300);mark(w);talk(`${w}! ${rnd(PRAISE)}`)}
function writeW(items,i){WritePad.open({items,index:i,lang:"en",font:'"Andika"',aspect:2,yShift:.45,onSay:w=>blend(w),onStar:(w,s,res)=>{if(s>=2){fanfare();burstAt(res);mark(w)}else buzz()}})}

/* oral blending: hear sounds only, pick the picture */
let bAns,bRight=0,bLock=false;
function bRound(){bLock=false;const pick=shuffle(ALL).slice(0,3);bAns=pick[0];sndRow("bSnd",bAns[0],true);
  const box=document.getElementById("bOpts");box.innerHTML="";box.style.gridTemplateColumns="1fr 1fr 1fr";
  shuffle(pick).forEach(([w,e],k)=>{const b=document.createElement("button");b.className="big";b.textContent=e;b.style.background=COLORS[k+1];
    b.onclick=()=>{if(bLock)return;if(w===bAns[0]){bLock=true;bRight++;b.classList.add("right");sndRow("bSnd",w);say(w);fanfare();burstAt(b);talk(`${w}! ${rnd(PRAISE)}`);mark(w);
        document.getElementById("bScore").textContent=`⭐ ${bRight}`;setTimeout(bRound,1900)}
      else{b.classList.add("wrong");buzz();talk("Listen again 👂");setTimeout(playB,400)}};box.appendChild(b)});
  setTimeout(playB,400)}
function playB(){[...bAns[0]].forEach((c,i)=>setTimeout(()=>{sound(c);lit("bSnd",i)},i*900))}
document.getElementById("startBlend").onclick=()=>{bRight=0;document.getElementById("bScore").textContent="";document.getElementById("blendM").classList.add("show");bRound()};
document.getElementById("bAgain").onclick=playB;

/* BME: label beginning, middle, end sounds */
let mW,mStep,mMiss,mRight=0;const NAMES=["beginning","middle","end"];
function mRound(){[mW]=[rnd(ALL)];mStep=0;mMiss=0;const pic=document.getElementById("mPic");pic.textContent=mW[1];pic.onclick=()=>say(mW[0]);
  document.querySelectorAll("#mSlots div").forEach(d=>{d.classList.remove("ok","cur");d.querySelector("b").textContent=""});setTimeout(()=>say(mW[0]),300);ask()}
function ask(){const slots=document.querySelectorAll("#mSlots div");slots.forEach((d,k)=>d.classList.toggle("cur",k===mStep));
  document.getElementById("mQ").textContent=`What is the ${NAMES[mStep]} sound?`;
  const right=mW[0][mStep],pool=mStep===1?"aeiou":"bcdfghjklmnprstvwxz";
  const opts=shuffle([right,...shuffle([...pool].filter(c=>c!==right)).slice(0,3)]);
  const box=document.getElementById("mOpts");box.innerHTML="";box.style.gridTemplateColumns="1fr 1fr 1fr 1fr";
  opts.forEach((c,k)=>{const b=document.createElement("button");b.textContent=c;b.style.background=COLORS[k+1];
    b.onclick=()=>{sound(c);if(c===right){pop();slots[mStep].querySelector("b").textContent=c;slots[mStep].classList.add("ok");burstAt(slots[mStep]);mStep++;
        if(mStep===3){slots.forEach(d=>d.classList.remove("cur"));mRight++;fanfare();setTimeout(()=>blend(mW[0]),300);mark(mW[0]);talk(`${mW[0]}! ${rnd(PRAISE)}`);
          document.getElementById("mScore").textContent=`⭐ ${mRight}`;document.getElementById("mQ").textContent="🎉 "+mW[0];box.innerHTML="";setTimeout(mRound,3600)}
        else setTimeout(ask,350)}
      else{b.classList.add("wrong");buzz();mMiss++;talk("Try again 💪")}};box.appendChild(b)})}
document.getElementById("startBme").onclick=()=>{mRight=0;document.getElementById("mScore").textContent="";document.getElementById("bmeM").classList.add("show");mRound()};
document.getElementById("mHear").onclick=()=>say(mW[0]);
</script>
<script>
window.NAJMA_PROGRESS=()=>{const ws=AV.flatMap(v=>W[v]).map(x=>x[0]);return{done:ws.filter(w=>prog.d[w]).length,total:ws.length}};
window.NAJMA_RESET=()=>localStorage.removeItem("cvcDone");
</script>
<script src="extras.js?v=8"></script>
</body>
</html>
