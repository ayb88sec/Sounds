<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<script src="supa.js"></script>
<script src="profile.js"></script><script src="landscape.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#2f9cfc">
<link rel="apple-touch-icon" href="icon-n.png"><link rel="icon" href="icon-n.png">
<title>Activity Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Patrick+Hand&family=Baloo+Bhaijaan+2:wght@600;800&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}html,body{margin:0}
body{font-family:"Fredoka","Baloo Bhaijaan 2",system-ui,sans-serif;color:#1d1d2b;background:#f6cf8c;min-height:100vh}
main{max-width:860px;margin:0 auto;padding:16px 12px 150px}
h1{text-align:center}
/* ---------- the paper ---------- */
.paper{position:relative;background:#fffdf7;border-radius:18px;padding:18px 16px 22px;margin:18px 4px 10px;
  box-shadow:0 2px 0 #e9e2cf,0 4px 0 #fffdf7,0 6px 0 #e9e2cf,0 14px 24px rgba(90,60,20,.28);transform:rotate(-.4deg);
  border:4px solid #fff}
.paper::before,.paper::after{content:"";position:absolute;top:-12px;width:90px;height:26px;background:rgba(255,226,120,.75);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.paper::before{left:18px;transform:rotate(-6deg)}.paper::after{right:18px;transform:rotate(5deg)}
.nd{display:flex;justify-content:space-between;gap:10px;font-family:"Patrick Hand",cursive;font-size:clamp(16px,3.6vw,22px);color:#555;padding:0 6px}
.nd b{font-family:"Patrick Hand",cursive;color:#2f6bd8;font-weight:400;border-bottom:2px solid #999;padding:0 10px;font-size:1.15em}
.st{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(30px,7.5vw,54px);text-align:center;margin:6px 0 2px;letter-spacing:.5px;line-height:1.05}
.st span{display:inline-block;will-change:transform;animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.ins{margin:8px auto 14px;max-width:560px;border:0;box-shadow:0 4px 10px rgba(0,0,0,.08);border-radius:16px;padding:6px 12px;text-align:center;font-family:"Patrick Hand",cursive;font-size:clamp(17px,3.8vw,22px);background:#fff}
.sec{border:2.5px solid #1d1d2b;border-radius:18px;padding:10px;margin:12px 0;background:#fff}
.sec h3{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:clamp(17px,3.8vw,22px)}
.sec h3 i{font-style:normal;background:#1d1d2b;color:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;flex:none}
/* answer boxes in crayon */
.box{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:54px;border:2.5px solid #1d1d2b;border-radius:12px;background:#fff;font-family:"Patrick Hand",cursive;font-size:34px;cursor:pointer;vertical-align:middle;transition:transform .15s}
.box:active{transform:scale(.92)}.box.ok{border-color:#2fae4e;background:#eaffef;animation:pop .4s}
.crayon{color:var(--c,#e8590c)}
@keyframes pop{50%{transform:scale(1.18) rotate(-4deg)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.shake{animation:shake .35s}
/* hub */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px;margin-top:8px}
.sh{position:relative;background:#fffdf7;border-radius:14px;padding:14px 12px 12px;cursor:pointer;border:0;font-family:inherit;text-align:center;color:#1d1d2b;
  box-shadow:0 3px 0 #e9e2cf,0 10px 18px rgba(90,60,20,.25);transition:transform .15s;animation:in .5s backwards}
.sh:nth-child(odd){transform:rotate(-1.5deg)}.sh:nth-child(even){transform:rotate(1.5deg)}.sh:active{transform:scale(.95)}
.sh::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(160,220,255,.8);transform:rotate(-3deg)}
.sh .pv{font-size:44px;line-height:1.2;letter-spacing:4px}.sh b{display:block;font-size:22px;margin-top:4px}.sh small{display:block;font-family:"Patrick Hand",cursive;font-size:17px;color:#666}
.sh .done{position:absolute;top:6px;right:8px;font-size:28px;transform:rotate(12deg)}
@keyframes in{from{transform:scale(.4) rotate(-10deg);opacity:0}}
/* finish letters */
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,180px),1fr));gap:0;border:2.5px solid #1d1d2b;border-radius:14px;overflow:hidden;background:#fff}
.fc{border:1.5px solid #1d1d2b;padding:8px 4px 10px;text-align:center;position:relative}
.fc .n{position:absolute;top:4px;left:8px;font-weight:700;font-size:16px}
.fc .pic{font-size:56px;line-height:1.15;cursor:pointer}
.fc .wd{font-family:"Patrick Hand",cursive;font-size:30px;margin:2px 0 6px;display:flex;align-items:center;justify-content:center;gap:2px}
.fc .wd .blank{display:inline-block;min-width:34px;border-bottom:3px solid #1d1d2b;text-align:center;line-height:1}
.ch{display:flex;gap:6px;justify-content:center}
.ch button{width:44px;height:44px;border-radius:50%;border:2.5px solid #1d1d2b;background:#fff;font-family:"Patrick Hand",cursive;font-size:26px;cursor:pointer;padding:0}
.ch button.no{background:#ffe0e0;animation:shake .35s}
.fc.won .ch{visibility:hidden}
html[dir=rtl] .fc .wd,html[dir=rtl] .ch button{font-family:"Baloo Bhaijaan 2",sans-serif}
/* find & count */
.scene{position:relative;border:2.5px solid #1d1d2b;border-radius:18px;background:#fff;height:min(78vw,520px);overflow:hidden}
.scene span{position:absolute;font-size:clamp(30px,7vw,48px);cursor:pointer;transition:transform .2s;line-height:1}
.scene span.got{transform:scale(.85)}.scene span.got::after{content:"";position:absolute;inset:-6px;border:3px solid var(--c);border-radius:50%}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border:2.5px solid #1d1d2b;border-radius:14px;overflow:hidden;margin-top:12px;background:#fff}
.tally div{display:flex;align-items:center;justify-content:space-around;padding:8px;border:1.5px solid #1d1d2b;font-size:42px}
/* matching with lines */
.mt{position:relative;display:flex;justify-content:space-between;padding:4px 6px}
.mt .col{display:flex;flex-direction:column;gap:10px;z-index:2}
.mt .it{display:flex;align-items:center;gap:10px}
.mt .k{min-width:58px;height:58px;border:2.5px solid #1d1d2b;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:"Fredoka",sans-serif;font-size:32px;cursor:pointer;padding:0 6px}
.mt .k.sel{background:#fff3b0;transform:scale(1.08)}.mt .k.done{background:#eaffef;border-color:#2fae4e}
.mt .dot{width:14px;height:14px;border-radius:50%;background:#1d1d2b}
.mt svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.mt path{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* shapes */
.srow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:2px solid #e6dcc4}.srow:last-child{border-bottom:0}
.srow .shp{width:78px;text-align:center;flex:none;font-family:"Patrick Hand",cursive;font-size:18px}.srow .shp svg{width:56px;height:56px;display:block;margin:0 auto}
.srow .opt{flex:1;display:flex;justify-content:space-around}
.srow .opt button{border:0;background:none;font-size:clamp(34px,8vw,48px);cursor:pointer;border-radius:50%;width:1.5em;height:1.5em;padding:0}
.srow .opt button.ok{outline:4px solid #2fae4e;background:#eaffef}.srow .opt button.no{animation:shake .35s;opacity:.4}
/* math sheet */
.grp{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px solid #1d1d2b;flex-wrap:wrap}.grp:last-child{border:0}
.grp .em{flex:1;font-size:clamp(26px,6.5vw,38px);letter-spacing:2px}
.seq{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seq .c{min-width:54px;height:54px;border:2.5px solid #1d1d2b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:"Fredoka",sans-serif;font-size:28px;background:#fff}
.nx3{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-family:"Patrick Hand",cursive;font-size:28px}
.nx3 .ops{display:flex;gap:6px}.nx3 .ops button{width:50px;height:50px;border:2.5px solid #1d1d2b;border-radius:10px;background:#fff;font-family:"Fredoka",sans-serif;font-size:24px;cursor:pointer}
.nx3 .ops button.ok{border-radius:50%;outline:4px solid #e8590c;outline-offset:2px}.nx3 .ops button.no{animation:shake .35s;opacity:.4}
.addr{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.addr div{border:2px solid #e6dcc4;border-radius:14px;padding:8px;text-align:center;font-size:26px}
.bs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bs div{display:flex;justify-content:space-around;border:2.5px solid #1d1d2b;border-radius:14px;padding:8px}
.bs button{width:56px;height:56px;border-radius:50%;border:2.5px solid #e6dcc4;background:#fff;font-family:"Fredoka",sans-serif;font-size:26px;cursor:pointer}
.bs button.ok{border-style:solid;outline:4px solid #e8590c}.bs button.no{animation:shake .35s;opacity:.4}
/* keypad */
.kp{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:#fff;border-radius:26px;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:none;grid-template-columns:repeat(5,1fr);gap:8px;width:min(94vw,420px)}
.kp.show{display:grid;animation:in .25s}.kp button{height:58px;border-radius:16px;border:0;font-family:"Fredoka",sans-serif;font-size:28px;font-weight:700;cursor:pointer;color:#fff}
.kp .x{grid-column:span 5;height:40px;background:#eee!important;color:#555;font-size:18px}
.kpd{position:fixed;inset:0;z-index:79;display:none}.kpd.show{display:block}
/* finish */
.stamp{position:fixed;left:50%;top:40%;z-index:90;transform:translate(-50%,-50%) rotate(-12deg);font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(40px,11vw,80px);color:#e8590c;border:8px solid #e8590c;border-radius:24px;padding:6px 26px;background:rgba(255,253,247,.95);animation:stp .6s cubic-bezier(.3,1.7,.5,1);pointer-events:none;text-align:center}
.stamp small{display:block;font-size:.35em;color:#1d1d2b}
@keyframes stp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0}}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.fb{border:2.5px solid #1d1d2b;border-radius:999px;padding:10px 22px;background:#fff3b0;font-family:inherit;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 #1d1d2b}
.fb:active{transform:translateY(4px);box-shadow:0 1px 0 #1d1d2b}
.cheer{text-align:center;font-family:"Patrick Hand",cursive;font-size:22px;margin-top:10px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:95}
.akg{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px}
.akc{border:2.5px solid #1d1d2b;border-radius:16px;background:#fff;padding:6px;text-align:center;font-family:"Baloo Bhaijaan 2",sans-serif}.akc .ph{aspect-ratio:1;cursor:pointer}.akc b{display:block;font-size:17px;min-height:2.6em;line-height:1.3;margin:4px 0}
.akc .yn{display:flex;gap:6px;justify-content:center}.akc .yn button{width:50px;height:50px;border-radius:50%;border:2.5px solid #1d1d2b;background:#fff;font-size:24px;cursor:pointer}.akc .yn button.no{animation:shake .35s}
.akc.good{background:#eaffef;border-color:#2fae4e}.akc.bad{background:#ffeaea;border-color:#e03131}.akc.good .yn,.akc.bad .yn{visibility:hidden}
.tree{position:relative;height:min(120vw,620px);max-width:560px;margin:0 auto}
.trunk{position:absolute;left:44%;width:12%;top:40%;bottom:0;background:linear-gradient(90deg,#8a5a2b,#b07a40,#8a5a2b);border-radius:20px 20px 6px 6px}
.crown{position:absolute;left:2%;right:2%;top:0;height:62%;background:radial-gradient(circle at 30% 40%,#8be07a,#3fae4e 70%);border-radius:50% 50% 45% 45%;box-shadow:inset 0 -14px 0 rgba(0,0,0,.08)}
.leaf{position:absolute;transform:translate(-50%,0);width:clamp(84px,22vw,118px);border:4px solid #fff;border-radius:50% 50% 50% 8%;background:#fff8e1;padding:6px 6px 2px;cursor:pointer;font-family:"Baloo Bhaijaan 2",sans-serif;box-shadow:0 6px 12px rgba(0,0,0,.18);will-change:transform;animation:sway 3s var(--d) ease-in-out infinite}
.leaf .ph{display:block;aspect-ratio:1}.leaf small{display:block;font-weight:800;font-size:13px;line-height:1.2}.leaf.lit{background:#fff3b0;box-shadow:0 0 0 4px #ffd23f,0 6px 16px rgba(255,180,0,.5)}
@keyframes sway{0%,100%{transform:translate(-50%,0) rotate(-3deg)}50%{transform:translate(-50%,0) rotate(3deg)}}
.hrt{position:absolute;left:50%;bottom:4%;transform:translateX(-50%) scale(.4);opacity:.3;background:#ffd6e3;border:4px solid #fff;border-radius:24px;padding:6px 14px;text-align:center;font-family:"Baloo Bhaijaan 2",sans-serif;font-weight:800;font-size:18px;transition:.5s}.hrt.on{transform:translateX(-50%) scale(1);opacity:1}
.snp{display:inline-block;width:40px;height:40px;vertical-align:middle}
.mt .k:has(.snp){font-family:"Baloo Bhaijaan 2",sans-serif;font-size:18px;gap:6px}
.seab{position:relative;border-radius:18px;overflow:hidden;border:2.5px solid #1d1d2b}.seab img{width:100%;display:block}
.hs{position:absolute;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer}.hs.on{box-shadow:0 0 0 4px #fff,0 0 0 8px #2fae4e;background:rgba(255,255,255,.25)}
.frow{display:flex;align-items:center;gap:8px;border:3px solid var(--c);border-radius:18px;padding:6px;margin-bottom:8px;background:#fff}
.frow .tg{flex:none;width:64px;text-align:center;font-size:40px;background:color-mix(in srgb,var(--c) 18%,#fff);border-radius:12px;line-height:1.1;padding:4px 0}
.frow .ck{display:block;width:30px;height:30px;margin:2px auto 0;border:2.5px solid #1d1d2b;border-radius:8px;background:#fff;font-size:22px;color:#2fae4e;font-weight:700;line-height:26px}
.frow .its{flex:1;display:grid;grid-template-columns:repeat(9,1fr);gap:2px}.frow .its button{border:0;background:none;font-size:clamp(22px,5.4vw,36px);padding:2px 0;cursor:pointer;border-radius:50%}
.frow .its button.hit{background:color-mix(in srgb,var(--c) 30%,#fff);outline:3px solid var(--c)}.frow .its button.no{animation:shake .35s}.frow.won{background:#f2fff4}
.mzw{display:flex;align-items:stretch;gap:6px;direction:ltr}.mzw .mzs:first-child{align-self:flex-start}.mzw .mzs:last-child{align-self:flex-end}.mzs{font-size:30px;text-align:center;font-family:"Baloo Bhaijaan 2",sans-serif;font-weight:800;font-size:15px;line-height:1.2}.mzs br+*{}
.mz{flex:1;max-width:520px;background:#fff;border:2.5px solid #1d1d2b;border-radius:14px}
.bwl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.bw{width:clamp(96px,28vw,130px);border:0;background:none;cursor:pointer;font-family:"Baloo Bhaijaan 2",sans-serif}
.bw .fl2{display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;width:100%;aspect-ratio:1;border:4px solid var(--c);border-radius:46% 46% 40% 40%;background:color-mix(in srgb,var(--c) 22%,#fff);padding:10px;font-size:28px}
.bw .fl2 i{font-style:normal;text-shadow:0 0 0 var(--c);color:transparent;animation:pop .4s}.bw small{display:block;font-weight:800;font-size:16px}.bw.shake{animation:shake .35s}
.fsh{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}.fsh button{width:62px;height:62px;border-radius:50%;border:3px solid #e6dcc4;background:#fff;font-size:34px;cursor:pointer;color:transparent;text-shadow:0 0 0 var(--c)}
.fsh button.sel{border-style:solid;transform:scale(1.15);background:#fff3b0}.fsh button.in{visibility:hidden}
/* creativity: scene, guide, movement */
.paper{overflow:hidden;background:transparent!important;box-shadow:0 14px 28px rgba(90,60,20,.25)!important;transform:none!important;border-radius:28px!important}
.paper>*:not(.scn){position:relative;z-index:1}
.scn{position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:24px}.scn i{position:absolute;font-style:normal;opacity:.75;pointer-events:none;will-change:transform;backface-visibility:hidden}.scn{contain:strict}
.m-up{animation:mup 9s linear infinite}@keyframes mup{from{transform:translateY(110%)}to{transform:translateY(-700%)}}
.m-fly{animation:mfly 7s ease-in-out infinite}@keyframes mfly{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(30px,-24px) rotate(8deg)}}
.m-drift{animation:mdr 12s ease-in-out infinite}@keyframes mdr{0%,100%{transform:translateX(0)}50%{transform:translateX(40px)}}
.m-twinkle{animation:mtw 2.4s ease-in-out infinite}@keyframes mtw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
#body{background:rgba(255,255,255,.88);border-radius:22px;padding:10px;box-shadow:0 6px 14px rgba(0,0,0,.08)}
.nd,.st,.ins,.cheer{background:rgba(255,255,255,.85);border-radius:16px}.st{display:table;margin:6px auto 4px!important;padding:2px 18px}.nd{padding:4px 10px}
.gd{position:fixed;z-index:85;bottom:calc(118px + env(safe-area-inset-bottom));inset-inline-end:2px;width:clamp(64px,15vw,104px);pointer-events:none;transition:transform .3s}
.gd img{width:100%;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.gd.go.cheer{animation:gj .7s cubic-bezier(.3,1.6,.5,1)}@keyframes gj{0%{transform:translateY(0)}35%{transform:translateY(-60px) rotate(-10deg) scale(1.15)}70%{transform:translateY(0) rotate(6deg)}100%{transform:none}}
.gd.go.think{animation:gw .6s ease-in-out}@keyframes gw{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.gd.go.wave{animation:gi .8s cubic-bezier(.3,1.6,.5,1)}@keyframes gi{from{transform:translateX(160%) rotate(20deg)}}
.akc.good,.akc.bad{animation:flip .6s}@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(1.08)}100%{transform:rotateY(0)}}
.leaf.lit{background:linear-gradient(160deg,#fff6c4,#ffd23f)!important;box-shadow:0 0 0 4px #ffd23f,0 0 22px 6px rgba(255,210,63,.7)}@keyframes glw{50%{box-shadow:0 0 0 4px #ffd23f,0 0 26px 8px rgba(255,210,63,.8)}}
.bw .fl2 i{display:inline-block;animation:pop .4s,swim 2.4s .4s ease-in-out infinite}@keyframes swim{0%,100%{transform:translateX(-6px) scaleX(1)}49%{transform:translateX(6px) scaleX(1)}50%{transform:translateX(6px) scaleX(-1)}99%{transform:translateX(-6px) scaleX(-1)}}
.frow.won{animation:pop .5s}.fc.won .pic{animation:pop .5s,wob 2s .5s ease-in-out infinite}
.box.ok{animation:pop .4s,glw2 1.2s}.mt .k.done{animation:pop .4s}
#fsh{transition:x .15s,y .15s}
.st span{margin:0 .14em}
/* ✅/❌ pictures stay inside their buttons (user 2026-11-18: the big ✓ covered the ✗) */
.yn{gap:10px!important}.yn button{width:58px!important;height:58px!important;padding:6px!important;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.yn button img,.yn button .bi{width:100%!important;height:100%!important;max-width:none!important;margin:0!important;object-fit:contain}

/* ===== approved worksheet look (ChatGPT worksheet visuals, approved by the user 2026-11-19): one calm cream sheet with a teal border and gold clip, no scenery ===== */
.scn,.st{display:none!important}
.paper{background:linear-gradient(#fffdf6,#fff5df)!important;border:5px solid #12988d!important;border-radius:28px!important;box-shadow:0 0 0 3px #f3dca8 inset,0 10px 0 #d9b77a,0 18px 28px rgba(90,60,20,.22)!important;transform:none!important;padding:26px 18px 18px!important}
.paper::before{content:""!important;left:50%!important;top:-16px!important;transform:translateX(-50%);width:84px!important;height:26px!important;border-radius:9px!important;background:linear-gradient(#ffe7a6,#f1c25c)!important;box-shadow:0 2px 0 #c99a3a!important;rotate:none!important}
.paper::after{content:""!important;left:50%!important;top:-6px!important;transform:translateX(-50%);width:34px!important;height:6px!important;border-radius:4px!important;background:#12988d!important;box-shadow:none!important;rotate:none!important}
.ins{background:#fffaf0!important;border:2px solid #f1d9ae!important;color:#13275a;font-family:"Baloo Bhaijaan 2",system-ui,sans-serif!important;font-weight:700;margin:0 auto 12px!important}
/* finger line-drawing matching: pictures and answers big and close, dots on the inner edges, lines drawn with the finger */

 .foot{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom));inset-inline-start:8px;margin:0!important;z-index:40}.foot .fb{font-size:15px;padding:5px 12px}.wmr{position:absolute;top:4px;inset-inline-end:14px;margin:0!important;font-size:13px}.akc .ph{aspect-ratio:auto!important;height:calc(100dvh - 250px)}.akc b{min-height:0!important;font-size:15px!important}}

<body>
<canvas id="fx"></canvas>
<main><h1 id="ttl">📒 Activity Book</h1><div id="app"></div></main>
<div class="kpd" id="kpd"></div><div class="kp" id="kp"></div>
<script>
const $=id=>document.getElementById(id),R=n=>Math.floor(Math.random()*n),shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]),pick=(a,n)=>shuf(a).slice(0,n);
const CR=["#e8590c","#2f6bd8","#2fae4e","#c2185b","#7b3fe4","#d49a00"];
const ME=NAJMA.me||{},NAME=(ME.preview?"":(ME.nameEn||ME.name||""))||"Star";
const G=ME.grade||"KG2",BIG=/^G[2-6]$/.test(G);
/* sounds */
let ac;function tone(f,d=.12,w=0,t="triangle",v=.14){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+w+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d+.02)}catch(e){}}
const yay=()=>{tone(660);tone(990,.15,.08);guide("cheer")},buzz=()=>{tone(330,.12,0,"sine",.07);tone(247,.18,.1,"sine",.07);guide("think")},fan=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,i*.1));
const sayEn=t=>{try{if(window.NAJMA&&NAJMA.aiSay)NAJMA.aiSay(t,"en",.85)}catch(e){}},sayAr=t=>{try{NAJMA.aiSay(t,"ar",.9)}catch(e){}};
/* confetti */
const cv=$("fx"),cx=cv.getContext("2d");let P=[],run=false;function sz(){cv.width=innerWidth;cv.height=innerHeight}sz();addEventListener("resize",sz);
function burst(x,y,n=24){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=2+Math.random()*6;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,c:CR[i%6],r:4+Math.random()*5,l:70})}go()}
function rain(){for(let i=0;i<120;i++)P.push({x:Math.random()*innerWidth,y:-Math.random()*300,vx:Math.random()*2-1,vy:2+Math.random()*3,c:CR[i%6],r:5+Math.random()*6,l:240});go()}
function go(){if(run)return;run=true;(function f(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);P.forEach(p=>{p.vy+=.15;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*.6)});if(P.length)requestAnimationFrame(f);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}})()}
const at=el=>{const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2)};
/* progress */
let done={};try{done=JSON.parse(localStorage.getItem("sheetsDone")||"{}")}catch(e){}

/* number keypad */
let kpCb=null;/* the keypad writes in the sheet's language (Arabic digits on Arabic sheets) */
const curAr=()=>!!((typeof SHEETS!=="undefined"&&SHEETS.find(x=>x.k===cur))||{}).ar,dgA=v=>String(v).replace(/\d/g,c=>"٠١٢٣٤٥٦٧٨٩"[c]),dgx=v=>curAr()?dgA(v):String(v);
function keypad(cb){kpCb=cb;$("kp").querySelectorAll("button[data-n]").forEach(b=>b.textContent=dgx(b.dataset.n));$("kp").querySelector(".x").textContent=curAr()?"✖ إغلاق":"✖ close";$("kp").classList.add("show");$("kpd").classList.add("show")}
function kpClose(){$("kp").classList.remove("show");$("kpd").classList.remove("show");kpCb=null}
$("kp").innerHTML=[...Array(BIG?21:11).keys()].map(n=>`<button data-n="${n}" style="background:${CR[n%6]}">${n}</button>`).join("")+'<button class="x">✖ close</button>';
$("kp").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.classList.contains("x"))return kpClose();const cb=kpCb;kpClose();cb&&cb(+b.dataset.n)});$("kpd").onclick=kpClose;
function askBox(box,ans,onOk){box.onclick=()=>{if(box.classList.contains("ok"))return;keypad(n=>{if(n===ans){box.textContent=dgx(n);box.classList.add("ok","crayon");box.style.setProperty("--c",CR[R(6)]);yay();at(box);onOk&&onOk()}else{box.textContent=dgx(n);box.classList.add("shake");buzz();setTimeout(()=>{box.classList.remove("shake");box.textContent=""},500)}})}}

/* ---------- the sheet frame ---------- */
const today=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"});
let left=0;
/* the falcon guide: reacts to every answer */
let gT=0;function guide(m){const g=document.getElementById("gd");if(!g)return;const src={cheer:"saqoor_cheer",think:"saqoor_think",wave:"saqoor_wave",point:"saqoor_point"}[m];
  g.querySelector("img").src="img/approved/mascot-falcon.webp";g.className="gd "+m;void g.offsetWidth;g.classList.add("go");clearTimeout(gT);gT=setTimeout(()=>{g.className="gd";0},1400)}
/* a scene behind each sheet */
const SCN={sea:{bg:"linear-gradient(180deg,#bfe9ff,#7cc8f5 60%,#f6d79a 92%)",fx:["🫧","🫧","🫧","🐟","🫧"],mv:"up"},garden:{bg:"linear-gradient(180deg,#c9f0ff,#e8fbd9 55%,#9fdc7a)",fx:["🦋","🌼","🦋","🌸","🐝"],mv:"fly"},
  sky:{bg:"linear-gradient(180deg,#a8dcff,#e3f4ff 70%,#fff)",fx:["☁️","⭐","☁️","✨","🎈"],mv:"drift"},desert:{bg:"linear-gradient(180deg,#bfe6ff,#fde9be 55%,#f2c77e)",fx:["☀️","🌴","🐪","✨","🌵"],mv:"drift"},
  night:{bg:"linear-gradient(180deg,#2b2d6e,#5b4fb0 60%,#a98be0)",fx:["⭐","✨","🌙","⭐","✨"],mv:"twinkle"}};
function scene(k){const d=SHEETS.find(s=>s.k===k)||{},S=SCN[d.scene||"sky"];return `<div class="scn" style="background:${S.bg}">${[...Array(6)].map((_,i)=>`<i class="m-${S.mv}" style="left:${(i*41+5)%92}%;top:${(i*29+8)%86}%;animation-delay:${-i*1.9}s;font-size:${18+(i*7)%22}px">${S.fx[i%S.fx.length]}</i>`).join("")}</div>`}
function sheet(def,body){window.scrollTo(0,0);document.documentElement.dir=def.ar?"rtl":"ltr";$("ttl").textContent=def.title;document.title=def.title;
  $("app").innerHTML=`<div class="paper">${scene(def.k)}
   <div class="st">${def.title.split(" ").map((w,i)=>`<span style="animation-delay:${i*.3}s;color:${i%2?"#1d1d2b":CR[(i+def.c)%6]}">${w}</span>`).join(" ")}</div>
   <div class="ins">${def.ins}</div><div id="body"></div><div class="cheer" id="ch"></div></div>
   <div class="foot"><button class="fb" id="nw">🔄 ${def.ar?"ورقة جديدة":"New sheet"}</button></div><div class="gd" id="gd"><img src="img/approved/mascot-falcon.webp" alt=""></div>`;setTimeout(()=>guide("wave"),300);
  $("nw").onclick=()=>open(def.k);body($("body"))}
function point(n=1){left-=n;const msgs=["Great job!","Super!","Keep going!","Wow!","Brilliant!"];if(left>0){const dd=SHEETS.find(x=>x.k===cur)||{};$("ch").textContent=dd.ar?"✏️ بقي "+String(left).replace(/\d/g,c=>"٠١٢٣٤٥٦٧٨٩"[c]):"✏️ "+left+" more to go";return}
  const d=SHEETS.find(s=>s.k===cur);done[cur]=1;try{localStorage.setItem("sheetsDone",JSON.stringify(done))}catch(e){}
  $("ch").textContent="";fan();rain();guide("cheer");setTimeout(()=>guide("cheer"),1500);const s=document.createElement("div");s.className="stamp";s.innerHTML=(d.ar?"أحسنت!":"Great Job!")+"<small>⭐⭐⭐ "+NAME+"</small>";document.body.appendChild(s);
  (d.ar?sayAr:sayEn)(d.ar?(BOYK?"أَحْسَنْتَ يَا بَطَلُ!":"أَحْسَنْتِ يَا بَطَلَةُ!"):"Great job, "+NAME+"!");setTimeout(()=>s.remove(),2600)}

/* ---------- 1. finish the letters ---------- */
const EN=[["apple","apple"],["ball","ball"],["cat","cat"],["dog","dog"],["egg","egg"],["fish","fish"],["goat","goat"],["hat","hat"],["igloo","igloo"],["jam","jam"],["kite","kite"],["lion","lion"],["moon","moon"],["nest","nest"],["orange","orange"],["pen","pen"],["queen","queen"],["rabbit","rabbit"],["sun","sun"],["tiger","tiger"],["umbrella","umbrella"],["van","van"],["watch","watch"],["box","box"],["yo-yo","yoyo"],["zebra","zebra"]];/* English words with an approved picture each (img/approved/ws/en-*) */
const AR=[["أرنب","🐰"],["بطة","🦆"],["تفاحة","🍎"],["ثعلب","🦊"],["جمل","🐪"],["حصان","🐴"],["خروف","🐑"],["دب","🐻"],["ذرة","🌽"],["زرافة","🦒"],["سمكة","🐟"],["شمس","☀️"],["صقر","🦅"],["ضفدع","🐸"],["طائرة","✈️"],["ظرف","✉️"],["عنب","🍇"],["غيمة","☁️"],["فراشة","🦋"],["قمر","🌙"],["كتاب","📖"],["ليمون","🍋"],["موز","🍌"],["نجمة","⭐"],["هدية","🎁"],["وردة","🌹"],["يد","✋"],["رمان","🍎"]].filter(x=>x[0]!=="رمان");
const NOJOIN="اأإآدذرزوؤة";
/* finish the word: a big approved picture, the word with its first letter missing, three letters to pick; short rounds so it fits */
function finish(ar){return box=>{const L=pick(ar?AR:EN,8),abc=ar?"ابتثجحخدذرزسشصضطظعغفقكلمنهوي":"abcdefghijklmnopqrstuvwxyz";left=L.length;const short=innerHeight<520;
  inRounds(box,L,short?3:4,(L,doneR)=>{let need=L.length;const room=Math.max(150,innerHeight-box.getBoundingClientRect().top-(short?14:175)),s=Math.max(64,Math.min(210,room-(short?104:130),Math.floor(box.offsetWidth/L.length)-60));
  box.innerHTML=`<div class="fw" style="--s:${s}px">${L.map(([w,e],i)=>{const f=w[0],rest=w.slice(1),joins=ar&&!NOJOIN.includes(f.replace(/[أإآ]/,"ا"));const base=ar?f.replace(/[أإآ]/,"ا"):f;
    const opts=shuf([base,...pick([...abc].filter(c=>c!==base),2)]);
    return `<div class="fc" data-i="${i}"><div class="pic">${ar?arImg(w,e):IMG("en-"+e,w)}</div><div class="wd"><span class="blank">&nbsp;</span><span>${joins?"ـ":""}${rest}</span></div><div class="ch">${opts.map(o=>`<button data-o="${o}">${o}</button>`).join("")}</div></div>`}).join("")}</div>`;
  box.querySelectorAll(".fc").forEach(c=>{const [w,e]=L[+c.dataset.i],base=ar?w[0].replace(/[أإآ]/,"ا"):w[0];
    c.querySelector(".pic").onclick=()=>(ar?sayAr:sayEn)(w);
    c.querySelectorAll(".ch button").forEach(b=>b.onclick=()=>{if(c.classList.contains("won"))return;if(b.dataset.o===base){const bl=c.querySelector(".blank");bl.textContent=w[0];bl.className="blank crayon";bl.style.setProperty("--c",CR[R(6)]);bl.style.borderColor="transparent";c.classList.add("won");yay();at(bl);(ar?sayAr:sayEn)(w);point();if(--need===0)doneR()}else{b.classList.add("no");buzz();setTimeout(()=>b.classList.remove("no"),400)}})})})}}

/* ---------- 2. find and count ---------- */
const KINDS=[["🐶","dogs"],["🐱","cats"],["🐰","bunnies"],["🐤","chicks"],["🦋","butterflies"],["🌸","flowers"],["🌳","trees"],["🐞","ladybugs"],["🐢","turtles"],["🍄","mushrooms"]];
const CNT=[["cat","cats","قطط"],["chick","chicks","كتاكيت"],["rabbit","rabbits","أرانب"],["tortoise","tortoises","سلاحف"]];
/* find and count: animals on the approved courtyard; tap to mark, then write how many (Arabic digits on the Arabic sheet) */
function count(box){const ar=curAr(),short=innerHeight<520,K=pick(CNT,short?3:4),N=K.map(()=>1+R(BIG?7:5));left=K.length;const items=[];K.forEach((k,i)=>{for(let j=0;j<N[i];j++)items.push(i)});
  const room=Math.max(160,innerHeight-box.getBoundingClientRect().top-(short?14:175)),th=short?58:84,sh=Math.max(110,room-th-10),sw=Math.min(box.offsetWidth,Math.round(sh*1.6));
  const cols=7,rows=4,cells=shuf([...Array(cols*rows).keys()]).slice(0,items.length);
  box.innerHTML=`<div class="scn2" style="width:${sw}px;height:${Math.round(sw/1.6)}px">${IMG("cnt-plate")}${items.map((ki,j)=>{const c=cells[j],x=(c%cols)*(100/cols)+7+R(5),y=38+Math.floor(c/cols)*(56/rows)+R(5);return `<span data-k="${ki}" style="left:${x}%;top:${y}%">${IMG("cnt-"+K[ki][0])}</span>`}).join("")}</div>
   <div class="tally2" style="--t:${short?40:58}px">${K.map((k,i)=>`<div>${IMG("cnt-"+k[0])}<span class="box" data-i="${i}"></span></div>`).join("")}</div>`;
  box.querySelectorAll(".scn2 span").forEach(s=>s.onclick=()=>{s.classList.toggle("got");tone(500+R(400),.08)});

<script>
/* every worksheet fits the screen (user 2026-11-16: sheets did not fit in the box): the paper shrinks to the space under the title,
   never below 60% so targets stay big; drawing/tapping keep working because zoom changes the real layout */
(function(){const MIN=.6;let busy=false;
  function fit(){const p=document.querySelector(".paper");if(!p||busy)return;busy=true;p.style.zoom="";p.style.width="";p.style.marginInline="";
    const r=p.getBoundingClientRect(),m=document.querySelector("main"),st=(m&&m.scrollTop)||0,top=r.top+st,after=(innerHeight<520&&innerWidth>innerHeight)?8:90,w0=p.offsetWidth,h0=p.offsetHeight;
    const z=Math.max(MIN,Math.min(1,(innerHeight-Math.max(top,60)-after-6)/h0));
    /* keep its normal width while zoomed, so it shrinks as a whole instead of reflowing wider */
    if(z<.995){p.style.width=w0+"px";p.style.zoom=z.toFixed(3);p.style.marginInline="auto"}busy=false}
  let t;const later=()=>{clearTimeout(t);t=setTimeout(fit,120)};
  let down=false;addEventListener("pointerdown",()=>down=true,true);addEventListener("pointerup",()=>{down=false},true);addEventListener("pointercancel",()=>{down=false},true);
  const safe=()=>{if(down)return later();fit()};const later2=()=>{clearTimeout(t);t=setTimeout(safe,150)};
  addEventListener("resize",later2);addEventListener("load",later2);
  /* only when a new sheet is drawn (direct children of the sheet body/app change), not while lines are drawn inside it */
  const watch=()=>["app","body"].forEach(id=>{const el=document.getElementById(id);if(el&&!el._fitObs){el._fitObs=1;new MutationObserver(later2).observe(el,{childList:true})}});
  watch();setTimeout(watch,500);later2()})();
</script>
