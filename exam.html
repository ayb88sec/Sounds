    if(--left===0){$("mn").innerHTML=`<div class="card" style="background:linear-gradient(160deg,#ffe6d6,#ffbe9c);margin-top:12px"><h2>المعنى الصحيح</h2><div class="big">${s.meaning}</div></div>`;speak("المعنى: "+s.meaning);rain(40);nxBtn(box,next)}})},
 sort(s,box,next){const items=shuf(s.items.slice());let cur=0;
  const draw=()=>{if(cur>=items.length){rain(50);speak("ممتاز!");return nxBtn(box,next)}const it=items[cur];
   box.querySelector("#q").innerHTML=`<div class="big">${it[0]}</div><button class="say" id="sq">🔊</button>`;$("sq").onclick=()=>speak(it[0]);speak(it[0])};
  box.innerHTML=`<h2>${s.title}</h2><div class="card" id="q" style="background:#fff8e1"></div><div class="two">${s.bins.map((b,i)=>`<div class="bin" data-b="${i}" style="background:${/❌|☹️/.test(b)?"#ffe8e8":"#e3f8e9"}">${b}</div>`).join("")}</div>`;
  box.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{if(cur>=items.length)return;const it=items[cur];if(+b.dataset.b===it[1]){yay();const d=document.createElement("span");d.className="it";d.textContent=it[0];b.appendChild(d);cur++;draw()}else{buzz();b.animate([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"none"}],300)}});draw()},
 match(s,box,next){let i=0;const P=s.pairs;
  const draw=()=>{if(i>=P.length){rain(50);speak("أحسنت!");return nxBtn(box,next)}const [q,a]=P[i];
   box.innerHTML=`<h2>${s.title}</h2><div class="card" style="background:linear-gradient(160deg,#dff1ff,#a8d8ff)"><div class="big">${q}</div></div><div style="font-size:30px">⬇️</div><div class="opts">${shuf(P.map(p=>p[1])).map(o=>`<button class="op">${o}</button>`).join("")}</div>`;speak(q);
   box.querySelectorAll(".op").forEach(b=>b.onclick=()=>{if(b.textContent===a){b.classList.add("ok");yay();speak(a);i++;setTimeout(draw,900)}else{b.classList.add("no");buzz();setTimeout(()=>b.classList.remove("no"),500)}})};draw()},
 learn(s,box,next){let seen=new Set();
  box.innerHTML=`<h2>${s.title}</h2>${s.text?`<div class="big" style="background:linear-gradient(160deg,#dff1ff,#a8d8ff);border-radius:22px;padding:10px;margin-bottom:10px">${s.text}</div>`:""}<p style="font-weight:800">اضغطي على كل بطاقة 👆</p><div class="grid">${s.cards.map((c,i)=>`<button class="lc" data-i="${i}" style="background:${["linear-gradient(160deg,#dff1ff,#a8d8ff)","linear-gradient(160deg,#ffe6d6,#ffbe9c)","linear-gradient(160deg,#dcf8e8,#9fe3c0)"][i%3]};animation-delay:${i*.1}s"><span class="e">${c[0]}</span><b style="font-size:20px">${c[1]}</b></button>`).join("")}</div>`;
  if(s.text)speak(s.text);
  box.querySelectorAll(".lc").forEach(b=>b.onclick=()=>{const c=s.cards[+b.dataset.i];speak(c[1]);b.style.outline="5px solid #3fc35a";seen.add(b.dataset.i);if(seen.size===s.cards.length&&!box.querySelector(".nx")){yay();nxBtn(box,next)}})},
 flips(s,box,next){let seen=new Set();
  box.innerHTML=`<h2>${s.title}</h2><div class="grid">${s.cards.map((c,i)=>`<div class="flip" data-i="${i}"><div class="in"><div class="f" style="background:linear-gradient(160deg,#efe6ff,#c9b5ff)"><span class="e">${c[0]}</span>${c[1]}</div><div class="b">✅ ${c[2]}</div></div></div>`).join("")}</div>`;
  box.querySelectorAll(".flip").forEach(f=>f.onclick=()=>{const c=s.cards[+f.dataset.i];f.classList.toggle("on");if(f.classList.contains("on")){speak(c[1]+" "+c[2]);seen.add(f.dataset.i);if(seen.size===s.cards.length&&!box.querySelector(".nx")){yay();setTimeout(()=>nxBtn(box,next),700)}}else speak(c[1])})},
 order(s,box,next){let k=0;const right=s.items;
  box.innerHTML=`<h2>${s.title}</h2>${s.note?`<div class="big" style="font-size:18px;background:#fff8e1;border-radius:18px;padding:6px 10px">💡 ${s.note}</div>`:""}<p style="font-weight:800">اضغطي بالترتيب الصحيح 👆</p><div class="chain">${right.map((_,i)=>`<div class="slot" id="sl${i}">${i+1}</div>`).join("")}</div><div class="opts">${shuf(right.map((x,i)=>[x,i])).map(([x,i])=>`<button class="op" data-i="${i}">${x}</button>`).join("")}</div>`;
  if(s.note)speak(s.note);
  box.querySelectorAll(".op").forEach(b=>b.onclick=()=>{if(b.disabled)return;if(+b.dataset.i===k){const sl=$("sl"+k);sl.textContent=right[k];sl.classList.add("full");b.disabled=true;b.classList.add("dim");speak(right[k].replace(/^\S+\s/,""));tone(500+k*80);k++;if(k===right.length){yay();rain(50);nxBtn(box,next)}}else{b.classList.add("no");buzz();setTimeout(()=>b.classList.remove("no"),500)}})},
 quiz(s,box,next){let i=0;const Q=s.qs;
  const draw=()=>{if(i>=Q.length){rain(40);return nxBtn(box,next)}const [q,o]=Q[i];
   box.innerHTML=`<h2>${s.title}</h2><div class="big">${q}</div><button class="say" id="sq">🔊</button><div class="opts">${shuf(o.map((x,j)=>[x,j])).map(([x,j])=>`<button class="op" data-j="${j}">${x}</button>`).join("")}</div>`;
   $("sq").onclick=()=>speak(q);speak(q);
   box.querySelectorAll(".op").forEach(b=>b.onclick=()=>{if(b.dataset.j==="0"){b.classList.add("ok");yay();speak(b.textContent);i++;setTimeout(draw,1100)}else{b.classList.add("no");buzz();setTimeout(()=>b.classList.remove("no"),500)}})};draw()},
 yesno(s,box,next){let i=0;const Q=s.qs;
  const draw=()=>{if(i>=Q.length){rain();return nxBtn(box,next)}const [q,a]=Q[i];
   box.innerHTML=`<h2>${s.title}</h2><div class="big">${q}</div><button class="say" id="sq">🔊</button><div class="two" style="margin-top:12px"><button class="op" data-a="1" style="background:#b9f3c9">👍 نعم</button><button class="op" data-a="0" style="background:#ffd6d6">👎 لا</button></div>`;
   $("sq").onclick=()=>speak(q);speak(q);
   box.querySelectorAll(".op").forEach(b=>b.onclick=()=>{if(+b.dataset.a===a){b.classList.add("ok");yay();speak(a?"نعم":"لا");i++;setTimeout(draw,1000)}else{b.classList.add("no");buzz();setTimeout(()=>b.classList.remove("no"),500)}})};draw()}};

/* final test: 12 questions from all lessons, score at the end */
function final(){$("ttl").textContent="🏆 الاختبار الشامل";const pool=[];
  L.forEach(l=>l.steps.forEach(s=>{if(s.type==="quiz")s.qs.forEach(q=>pool.push(["q",q]));if(s.type==="yesno")s.qs.forEach(q=>pool.push(["yn",q]));if(s.type==="sort")s.items.forEach(it=>pool.push(["q",["«"+it[0].replace(/^\S+\s/,m=>/[\u0600-\u06FF]/.test(m)?m:"")+"»\nمن أي مجموعة؟",[s.bins[it[1]],s.bins[1-it[1]]]]]));if(s.type==="match")s.pairs.forEach(p=>pool.push(["q",[p[0]+" … ماذا أفعل؟",[p[1]].concat(s.pairs.filter(x=>x!==p).map(x=>x[1]))]]))}));
  const Q=shuf(pool).slice(0,12);let i=0,score=0,first=true;
  const draw=()=>{window.scrollTo(0,0);if(i>=Q.length){const st=score>=11?3:score>=8?2:1;if(st>=2)mark("final");rain(st*50);yay();
     $("app").innerHTML=`<div class="card"><div class="score">${"⭐".repeat(st)}</div><h2>${score} / ${Q.length}</h2><div class="big">${st===3?"ممتاز! أنتِ جاهزة للامتحان 🏆":st===2?"أحسنتِ! راجعي قليلاً 💪":"بداية جميلة! جربي مرة ثانية 🌟"}</div><button class="nx" id="ag">🔄 مرة ثانية</button> <button class="nx" id="hb">🏠 الدروس</button></div>`;$("ag").onclick=final;$("hb").onclick=hub;speak(score+" من "+Q.length);return}
   const [t,q]=Q[i];first=true;
   $("app").innerHTML=`<div class="dots">${Q.map((_,j)=>`<i class="${j<i?"on":""}"></i>`).join("")}</div><div class="card" id="st"></div>`;const box=$("st");
   if(t==="yn"){box.innerHTML=`<div class="big">${q[0]}</div><div class="two" style="margin-top:12px"><button class="op" data-a="1" style="background:#b9f3c9">👍 نعم</button><button class="op" data-a="0" style="background:#ffd6d6">👎 لا</button></div>`;speak(q[0]);
     box.querySelectorAll(".op").forEach(b=>b.onclick=()=>{if(+b.dataset.a===q[1]){b.classList.add("ok");yay();if(first)score++;i++;setTimeout(draw,900)}else{first=false;b.classList.add("no");buzz()}})}
   else{box.innerHTML=`<div class="big" style="white-space:pre-line">${q[0]}</div><div class="opts">${shuf(q[1].map((x,j)=>[x,j])).map(([x,j])=>`<button class="op" data-j="${j}">${x}</button>`).join("")}</div>`;speak(q[0]);
     box.querySelectorAll(".op").forEach(b=>b.onclick=()=>{if(b.dataset.j==="0"){b.classList.add("ok");yay();if(first)score++;i++;setTimeout(draw,900)}else{first=false;b.classList.add("no");buzz()}})}};draw()}
if(BOY){const fix=n=>{const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let x;while(x=w.nextNode()){const v=G(x.nodeValue);if(v!==x.nodeValue)x.nodeValue=v}};
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===3){const v=G(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}else if(n.nodeType===1)fix(n)}))).observe(document.body,{subtree:true,childList:true});fix(document.body)}
/* one lesson on its own (from ديني): ?l=akh | tah | rusl */
const ONE=L.findIndex(l=>l.k===new URLSearchParams(location.search).get("l"));
if(ONE>=0){const l=L[ONE];hub=function(){$("ttl").textContent=l.e+" "+l.t;window.scrollTo(0,0);const n=l.steps.filter((_,j)=>done[l.k+j]).length;
  $("app").innerHTML=`<div class="grid"><button class="lc" id="st1" style="background:${l.bg}"><span class="e">📖</span><b>أذاكر مع المعلمة</b><small>شرح الدرس خطوة بخطوة</small></button><button class="lc" id="pl1" style="background:linear-gradient(160deg,#efe6ff,#c9b5ff)"><span class="e">🎮</span><b>أتمرن وألعب</b><small>${n} / ${l.steps.length} ⭐</small></button></div>`;
  $("st1").onclick=()=>study(ONE,0);$("pl1").onclick=()=>lesson(ONE,0)};hub()}else hub();
</script>
