<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<script src="supa.js"></script>
<script src="profile.js"></script><script src="data/kidq.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نجمة">

<title>نجمة ⭐ Najma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=swap">
<style>
:root{--ink:#1d2547;--mute:#5a5670;--card:#fffdf7;--gold:#f5b700;--ac:#177a52;--ease:cubic-bezier(.23,1,.32,1);--bounce:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#f3c27c;font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;color:var(--ink);overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
/* the stage is always landscape; held upright, it turns itself sideways */
#app{position:fixed;top:0;left:0;width:100vw;height:100dvh;overflow:hidden;container-type:size;background:#f6d9a4}
body.rot #app{left:100vw;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
.scr{position:absolute;inset:0;display:none;overflow:hidden}
.scr.on{display:block;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0}}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.top{position:absolute;top:2.5cqh;left:2.5cqh;right:2.5cqh;display:flex;align-items:center;justify-content:space-between;gap:2cqh;z-index:6}
.pill{display:flex;align-items:center;gap:1.2cqh;height:11cqh;padding:0 3.4cqh;background:var(--card);border:.5cqh solid #fff;border-radius:999px;box-shadow:0 1.2cqh 2.6cqh rgba(110,70,15,.2);font-weight:800;font-size:4.6cqh;white-space:nowrap}
.pill img{width:7cqh;height:7cqh;object-fit:contain}
.pill.ic{width:11cqh;padding:0;justify-content:center}.pill.ic svg{width:5.5cqh;height:5.5cqh}
.title{min-width:34cqh;text-align:center;font-weight:800;font-size:5.2cqh;color:#fff;background:var(--ac);border:.5cqh solid #fff;border-radius:999px;height:11cqh;line-height:9.6cqh;box-shadow:0 1.2cqh 0 rgba(0,0,0,.15);padding:0 5cqh}
.card{background:var(--card);border:.5cqh solid #fff;border-radius:5cqh;box-shadow:0 1.6cqh 3.6cqh rgba(110,70,15,.2)}
.btn{display:flex;align-items:center;justify-content:center;height:12cqh;padding:0 5.5cqh;border-radius:999px;background:var(--ac);color:#fff;font-weight:800;font-size:4.8cqh;border:.5cqh solid #fff;box-shadow:0 1.3cqh 0 rgba(0,0,0,.18);transition:transform .12s var(--ease),box-shadow .12s;white-space:nowrap}
.btn:active{transform:translateY(.9cqh);box-shadow:0 .4cqh 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--card);color:var(--ac);border-color:var(--ac)}
.falcon{position:absolute}
.falcon img{width:100%;height:100%;object-fit:contain;display:block}
.falcon.hop{animation:hop .6s var(--bounce)}
@keyframes hop{40%{transform:translateY(-5cqh) scale(1.05)}}
.wood{background:linear-gradient(#d99a52,#b9722f);border:.5cqh solid #7d4a1c;box-shadow:0 .9cqh 0 rgba(90,50,10,.35),inset 0 .4cqh 0 rgba(255,255,255,.25);color:#fffdf7;font-weight:800;text-shadow:0 .4cqh 0 #7d4a1c;white-space:nowrap}
/* home: one world, all on one screen */
#map{background:linear-gradient(#4fa9f2 0,#8ccbf8 26%,#d8effc 43%,#f7d193 43%,#f3c27c 100%)}
#map::before,#map::after{content:"";position:absolute;left:0;right:0;pointer-events:none}
#map::before{top:33%;height:11%;background:radial-gradient(ellipse 50% 100% at 50% 100%,#eebf7e 99%,transparent 100%) 0 0/70cqh 100% repeat-x}
#map::after{top:37%;height:8%;background:radial-gradient(ellipse 50% 100% at 50% 100%,#f7d193 99%,transparent 100%) 24cqh 0/104cqh 100% repeat-x}
#map>*{position:absolute;z-index:1}
#map svg.path{inset:0;width:100%;height:100%}
.cloud{top:var(--t);left:var(--x);width:var(--s);animation:drift 9s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes drift{to{transform:translateX(-5cqh)}}
.decor{left:var(--x);bottom:var(--b);width:var(--s);pointer-events:none;transform-origin:50% 100%;margin-left:calc(var(--s) / -2)}
.decor.sway{animation:sway 4s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
#heroK{left:50%;bottom:4cqh;height:43cqh;aspect-ratio:632/559;margin-left:-24.3cqh;z-index:3;background:url(img/v2/kids_sign.webp) center/contain no-repeat;animation:breathe 3.6s ease-in-out infinite alternate;transform-origin:50% 100%;pointer-events:none}
@keyframes breathe{to{transform:scale(1.02)}}
#heroK b{position:absolute;left:16%;right:14%;top:59%;height:31%;display:flex;align-items:center;justify-content:center;font-size:6cqh;color:#fffdf7;text-shadow:0 .5cqh 0 #8a4b12,0 0 2cqh rgba(90,45,5,.45);white-space:nowrap}
.bld{z-index:2;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%}
.bld img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 1.2cqh .8cqh rgba(120,70,10,.25))}
.bld:active{transform:scale(.95)}
.bld.hit{animation:bhit .6s var(--bounce)}
@keyframes bhit{35%{transform:scale(1.1,.92)}70%{transform:scale(.97,1.05)}}
.post{z-index:4;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;padding:0 3cqh .7cqh;border-radius:2.6cqh;font-size:4cqh;line-height:1.3}
.post i{display:flex;gap:.3cqh;margin-top:-.3cqh}.post i img{width:2.4cqh;height:2.4cqh}.post i img.off{filter:grayscale(1) brightness(.75);opacity:.55}
#wf{width:19cqh;height:19cqh;z-index:6;transition:left 1s var(--ease),bottom 1s var(--ease)}
#whw{z-index:5;left:calc(50% + 25.5cqh);bottom:2cqh;width:17cqh;display:flex;flex-direction:column;align-items:center;animation:hwb 2.2s ease-in-out infinite}
#whw img{width:11cqh;height:11cqh;object-fit:contain;margin-bottom:-1cqh;position:relative}
#whw span{padding:0 1.6cqh .5cqh;border-radius:2.2cqh;font-size:3.3cqh;line-height:1.4}
@keyframes hwb{50%{transform:translateY(-1.2cqh) rotate(-1.5deg)}}
#whw:active{animation:none;transform:scale(.94)}
#map .pill{top:2.5cqh;z-index:5}
#wstars{left:2.5cqh}#wstk{right:2.5cqh}
/* road */
#roadarea{position:absolute;inset:0}
#roadarea svg{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translate(-50%,-50%);width:16cqh;height:16cqh;border-radius:50%;background:var(--card);border:.7cqh solid #fff;box-shadow:0 1.2cqh 0 rgba(110,70,15,.25);display:flex;align-items:center;justify-content:center}
.stop img{width:68%;height:68%;object-fit:contain}
.stop.cur{border-color:var(--gold);box-shadow:0 0 0 .9cqh #fff,0 0 4cqh 1.5cqh rgba(245,183,0,.85),0 1.2cqh 0 rgba(110,70,15,.25);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 1.3cqh))}}
.stop i{position:absolute;top:-1.4cqh;inset-inline-end:-1.4cqh;width:6cqh;height:6cqh;border-radius:50%;background:#1f9d5c;border:.5cqh solid #fff;display:flex;align-items:center;justify-content:center}
.stop i svg{width:3.4cqh;height:3.4cqh}
.stop small{position:absolute;top:100%;margin-top:1.2cqh;white-space:nowrap;font-weight:800;font-size:3.4cqh;background:rgba(255,253,247,.92);border-radius:999px;padding:0 2cqh;line-height:1.5}
.stop.chest{background:none;border:0;box-shadow:none;width:20cqh;height:20cqh;animation:none}
.stop.chest img{width:100%;height:100%}
.stop.chest.shut{filter:grayscale(.6);opacity:.8}
#roadfalcon{width:20cqh;height:20cqh;transition:left .6s var(--ease),top .6s var(--ease);pointer-events:none;z-index:3;margin:-10cqh 0 0 -10cqh}
.nextcard{position:absolute;left:50%;bottom:2cqh;transform:translateX(-50%);display:flex;align-items:center;gap:2.4cqh;padding:1.4cqh 2cqh;z-index:4}
.nextcard img{width:9cqh;height:9cqh;object-fit:contain}
.nextcard span{line-height:1.25;white-space:nowrap;padding-inline-end:2cqh}.nextcard span b{display:block;font-size:4.2cqh}.nextcard span small{font-size:3.1cqh;color:var(--mute);font-weight:600}
.nextcard .btn{height:10cqh;font-size:4.2cqh}

/* road with every lesson of the place as a stop */
.stop{text-decoration:none;color:var(--ink)}
.stop.sm{width:12.5cqh;height:12.5cqh}
.stop small{max-width:25cqh;white-space:normal!important;text-align:center;line-height:1.2!important;border-radius:2.4cqh!important;padding:.3cqh 1.6cqh!important;width:max-content}
.stop.sm small{font-size:2.9cqh;margin-top:.8cqh;max-width:18cqh}
.stop svg.ring{position:absolute;inset:-1.3cqh;width:calc(100% + 2.6cqh);height:calc(100% + 2.6cqh);transform:rotate(-90deg);pointer-events:none}
.stop.go{animation:bhit .5s var(--bounce)}
#empty{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);padding:3cqh 5cqh;font-weight:800;font-size:4.6cqh;white-space:nowrap}
#roadfalcon{margin:0;transform:translate(-50%,-100%)}
/* child button and chooser */
#wkid{right:2.5cqh;padding-inline:1cqh 3cqh;gap:1.6cqh}
#wkid span.av{width:8.6cqh;height:8.6cqh;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:5cqh;background:#ffd23f}
#hwn{position:absolute;top:-1cqh;inset-inline-end:0;min-width:5.4cqh;height:5.4cqh;border-radius:999px;background:#e5484d;color:#fff;border:.5cqh solid #fff;font-weight:800;font-size:3cqh;line-height:4.4cqh;text-align:center;z-index:2}
#kidsOv{position:absolute;inset:0;z-index:20;background:rgba(29,37,71,.45);display:none;align-items:center;justify-content:center}
#kidsOv.on{display:flex}
#kidsBox{max-width:86%;padding:4cqh;display:flex;flex-wrap:wrap;gap:3cqh;justify-content:center}
#kidsBox button{display:flex;flex-direction:column;align-items:center;gap:1cqh;font-weight:800;font-size:3.8cqh;width:22cqh}
#kidsBox .av{width:15cqh;height:15cqh;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:8cqh;border:.7cqh solid #fff;box-shadow:0 1cqh 2cqh rgba(110,70,15,.25)}
#kidsBox button.on .av{border-color:var(--gold)}

/* big stops on one winding road */
svg.road{position:absolute;inset:0;width:100%;height:100%}
.gstop{position:absolute;width:21cqh;height:19cqh;transform:translate(-50%,-62%);display:flex;align-items:flex-end;justify-content:center;z-index:2}
.gstop .pad{position:absolute;left:2%;right:2%;bottom:-2.6cqh;height:7.5cqh;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#fff4dc 0,#f3cf92 62%,#d9a35c 100%);box-shadow:0 1.2cqh 0 rgba(150,95,30,.35)}
.gstop>img{position:relative;width:86%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 1cqh .8cqh rgba(110,60,10,.28))}
.gstop.chest>img{width:96%}
.gstop b{position:absolute;top:calc(100% + 2.6cqh);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;padding:0 2.4cqh .6cqh;border-radius:2.4cqh;font-size:3.3cqh;line-height:1.3;z-index:2}
.gstop b u{display:flex;gap:.4cqh;margin-top:.1cqh}.gstop b u img{width:2.8cqh;height:2.8cqh}.gstop b u img.off{filter:grayscale(1) brightness(.75);opacity:.55}
.gstop i{position:absolute;top:0;right:1cqh;width:7cqh;height:7cqh;border-radius:50%;background:#1f9d5c;border:.6cqh solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 .6cqh 0 rgba(0,0,0,.15)}
.gstop i svg{width:4cqh;height:4cqh}
.gstop.cur .pad{background:radial-gradient(ellipse at 50% 40%,#fffbe6 0,#ffe48a 55%,#f0b400 100%);box-shadow:0 0 4cqh 1.6cqh rgba(255,206,60,.75),0 1.2cqh 0 rgba(150,95,30,.35)}
.gstop.cur>img{animation:gb 1.8s ease-in-out infinite}
@keyframes gb{50%{transform:translateY(-1.8cqh)}}
.gstop:active>img{transform:scale(.94)}
.gstop.go>img{animation:bhit .5s var(--bounce)}
#roadfalcon{width:18cqh;height:18cqh;transform:translate(-50%,-100%);margin:0;pointer-events:none;z-index:3}
#gov{position:absolute;inset:0;z-index:15;background:rgba(29,37,71,.45);display:none;align-items:center;justify-content:center}
#gov.on{display:flex;animation:fade .25s}
#gcard{position:relative;padding:9cqh 5cqh 5cqh;max-width:92%;animation:popin .45s var(--bounce)}
#ghead{position:absolute;top:-4.5cqh;left:50%;transform:translateX(-50%);padding:.6cqh 6cqh 1.2cqh;border-radius:3.4cqh;font-size:5.4cqh}
#gx{position:absolute;top:-4cqh;left:-4cqh}
#glist{display:grid;grid-template-columns:repeat(var(--n),25cqh);gap:3cqh 4cqh;justify-content:center}
.glesson{display:flex;flex-direction:column;align-items:center;gap:1.4cqh;text-decoration:none;color:var(--ink);transition:transform .12s var(--ease)}
.glesson:active{transform:scale(.94)}
.glesson span{position:relative;width:22cqh;height:22cqh;border-radius:50%;background:color-mix(in srgb,var(--ac) 14%,#fff);border:.7cqh solid #fff;box-shadow:0 1.2cqh 0 color-mix(in srgb,var(--ac) 45%,#c9a46a);display:flex;align-items:center;justify-content:center}
.glesson span img{width:70%;height:70%;object-fit:contain}
.glesson span i{position:absolute;top:-.6cqh;right:-.6cqh;width:6.4cqh;height:6.4cqh;border-radius:50%;background:#1f9d5c;border:.5cqh solid #fff;display:flex;align-items:center;justify-content:center}
.glesson span i svg{width:3.6cqh;height:3.6cqh}
.glesson b{font-size:3.8cqh;line-height:1.2;text-align:center}
.glesson.go span{animation:bhit .45s var(--bounce)}
@keyframes popin{from{transform:scale(.6);opacity:0}}

/* the room fills the screen, cropping the plain left side or the ceiling first */
#room{position:absolute;right:0;bottom:0;width:max(100cqw,177.7cqh);aspect-ratio:1672/941;container-type:size}
#room .rbg{position:absolute;inset:0;width:100%;height:100%}
.obj{position:absolute;aspect-ratio:1;transform:translate(-50%,-100%);display:flex;align-items:flex-end;justify-content:center;z-index:2}
.obj>img{width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 .9cqh .7cqh rgba(90,50,10,.35))}
.obj.chest{aspect-ratio:1.2}
.obj b{position:absolute;top:calc(100% + .6cqh);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;padding:0 1.8cqh .4cqh;border-radius:1.8cqh;font-size:2.7cqh;line-height:1.3;border-width:.35cqh;z-index:3}
.obj b u{display:flex;gap:.3cqh}.obj b u img{width:2.1cqh;height:2.1cqh}.obj b u img.off{filter:grayscale(1) brightness(.75);opacity:.55}
.obj i{position:absolute;top:-1cqh;right:-1cqh;width:5cqh;height:5cqh;border-radius:50%;background:#1f9d5c;border:.45cqh solid #fff;display:flex;align-items:center;justify-content:center}
.obj i svg{width:3cqh;height:3cqh}
.obj.cur>img{animation:gb 1.8s ease-in-out infinite;filter:drop-shadow(0 0 2.2cqh rgba(255,214,70,.95)) drop-shadow(0 .9cqh .7cqh rgba(90,50,10,.35))}
.obj:active>img{transform:scale(.93)}
.obj.go>img{animation:bhit .5s var(--bounce)}
#road #roadfalcon{left:3cqh;bottom:1cqh;top:auto;width:27cqh;height:27cqh;transform:none;z-index:4}
#flat{position:absolute;left:30cqh;right:4cqh;top:16cqh;bottom:4cqh;display:grid;grid-template-columns:repeat(var(--n),25cqh);gap:4cqh 5cqh;justify-content:center;align-content:center}

#road .gstop{width:18cqh;height:16cqh}
#road .gstop b{font-size:3.2cqh}

/* inside a place: each lesson stands on a woven palm mat on the sand */
#road .gstop{width:30cqh;height:21cqh;transform:translate(-50%,-78%)}
#road .gstop .pad{left:-2cqh;right:-2cqh;bottom:-5.5cqh;height:13cqh;border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,#e9a868 0 18%,#d98c4c 19% 22%,#eeb57a 23% 34%,#d48748 35% 38%,#efb879 39% 52%,#cf8343 53% 56%,#eab173 57% 70%,#c57a3d 71% 74%,#e2a466 75% 86%,#b86e34 87% 100%);
  box-shadow:inset 0 -.7cqh 0 rgba(120,60,15,.35),0 1.2cqh 1.4cqh rgba(150,95,30,.3);border:.5cqh solid #c98a4c}
#road .gstop>img{width:100%;height:100%;filter:drop-shadow(0 1.2cqh 1cqh rgba(110,60,10,.3))}
#road .gstop.cur .pad{box-shadow:inset 0 -.7cqh 0 rgba(120,60,15,.35),0 0 4cqh 1.4cqh rgba(255,214,70,.8)}
#road .gstop i{top:-1cqh;right:1cqh}
#road #roadfalcon{width:22cqh;height:22cqh;left:1cqh;bottom:1cqh}

/* objects come on their own woven mats */
#road .gstop{width:auto;height:30cqh;aspect-ratio:1.3;transform:translate(-50%,-100%)}
#road .gstop .pad{display:none}
#road .gstop>img{width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 1cqh 1cqh rgba(120,70,15,.25))}
#road .gstop.cur>img{filter:drop-shadow(0 0 2.6cqh rgba(255,220,90,.95)) drop-shadow(0 1cqh 1cqh rgba(120,70,15,.25))}
#road .gstop i{top:1cqh;right:3cqh}
#road #roadfalcon{width:20cqh;height:20cqh;left:1cqh;bottom:1cqh}
</style>
</head>
<body>
<div id="app">
<section class="scr on" id="map"></section>
<section class="scr" id="road">
  <img class="bg" id="roadbg" alt="">
  <div id="roadarea"></div>
  <div class="top"><button class="pill ic" id="rback" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="#1d2547" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><div class="title" id="roadtitle"></div><span class="pill"><img src="img/v2/r_star.webp" alt=""><span class="starcount"></span></span></div>
</section>
<div id="gov"></div>
<div id="kidsOv"><div class="card" id="kidsBox"></div></div>
</div>
<script>
const ROWS=[
 {t:"🔤 العربية",apps:[
  {id:"arabic",href:"arabic.html",glyph:"أ ب",name:"حروفي",sub:"الحروف العربية",bg:"linear-gradient(150deg,#22c7b8,#2f8cff)",key:"arDone",total:38},
  {id:"spell",href:"spell.html",glyph:"بـا",name:"كلماتي الأولى",sub:"المقاطع والكلمات",bg:"linear-gradient(150deg,#3fc35a,#22c7b8)",key:"spellDone",total:60},
  {id:"numAr",href:"numbers-ar.html",glyph:"١٢٣",name:"الأرقام",sub:"من ١ إلى ٢٠",bg:"linear-gradient(150deg,#ffb020,#ff5d9e)",key:"numDoneAr",total:20},
  {id:"uae",href:"uae.html",glyph:"🇦🇪",name:"بلادي الإمارات",sub:"زايد · الإمارات السبع",bg:"linear-gradient(150deg,#c8102e,#00843d)",key:"uaeDone",total:15},

function pool(){const seen=new Set(),P=[];Object.keys(CATS).forEach(k=>vis(k).forEach(a=>{if(seen.has(a.id))return;seen.add(a.id);P.push(a)}));
  const m=P.find(a=>a.id==="math");if(m){const ML=NAJMA.lv("math"),p=ML.includes(0),q=ML.includes(1);
    P.push(Object.assign({},m,{id:"mathPlus",name:"Adding",href:p?"math.html?l=0":"math.html"}));if(q||p)P.push(Object.assign({},m,{id:"mathMinus",name:"Taking away",href:q?"math.html?l=1":"math.html?l=2"}))}
  return P}
function groupsOf(k){const L=vis(k);if(k==="hw"||!GROUPS[k])return L.map(a=>({name:a.name,ic:lpic(a),L:[a]}));
  const P=pool(),G=[],used=new Set();Object.values(GROUPS).flat().forEach(g=>g[2].forEach(x=>used.add(x)));used.add("math");
  GROUPS[k].forEach(([n,ic,ids])=>{const m=P.filter(a=>!a.id.startsWith("ws")&&ids.some(x=>x==="s:"?a.id.startsWith("s:")&&L.includes(a):a.id===x));if(m.length)G.push({name:n,ic,L:m})});
  const rest=L.filter(a=>!a.id.startsWith("ws")&&!a.id.startsWith("s:")&&!used.has(a.id));if(rest.length)G.push({name:k==="ar"||k==="deen"?"المزيد":"More",ic:"l_cards",L:rest});
  const ws=L.filter(a=>a.id.startsWith("ws"));if(ws.length)G.push({name:CHEST[k][0],ic:CHEST[k][1],L:ws,chest:1});
  return G}
const gfrac=g=>{let n=0,t=0;g.L.forEach(a=>{if(a.total){t+=a.total;n+=Math.min(count(a.key),a.total)}});return t?n/t:0};

 ar:{img:"room_fort",slots:[[55,41.3,13.5],[67.6,41.3,13.5],[80,41.3,13.5],[57,72.3,15],[79,72.3,15]],chest:[91,95,14]},
 deen:{img:"room_mosque",slots:[[44.8,53.4,13.5],[66.9,74,16],[88.8,53.4,13.5],[88,91,14]],chest:[50,93,14]},

  $$(".starcount").forEach(e=>e.textContent=String(stars));closeG();

    if(!G.length){A.innerHTML=`<div class="card" id="empty">${k==="hw"?"لا يوجد واجب اليوم":"لا يوجد شيء هنا بعد"}</div><div class="falcon" id="roadfalcon" style="left:50%;top:48%"><img alt=""></div>`;falcon($("#roadfalcon"),"thumb");return}
    A.innerHTML=`<div id="flat"></div><div class="falcon" id="roadfalcon" style="left:14cqh;top:96%"><img alt=""></div>`;falcon($("#roadfalcon"),"point");
    const F=$("#flat");G.forEach(g=>g.L.forEach(a=>F.appendChild(lessonEl(k,a))));F.style.setProperty("--n",Math.min(4,F.children.length));return}
  /* the building on the sand: big lesson pictures standing in neat rows, no road */
  $("#roadbg").src=`${V}pl_${k}.webp`;$("#roadbg").style.objectPosition="center 12%";$("#roadbg").style.display="";
  const n=G.length,two=n>3,top=two?Math.ceil(n/2):n,P=G.map((g,i)=>{const r=two&&i>=top?1:0,m=r?n-top:top,c=r?i-top:i,span=m>1?Math.min(26,52/(m-1)):0;return [55+((m-1)/2-c)*span,two?(r?95:61):80]});
  let cur=G.findIndex(g=>!g.chest&&gfrac(g)<1);if(cur<0)cur=G.findIndex(g=>gfrac(g)<1);

function lessonEl(k,a){const t=a.total?Math.min(count(a.key),a.total):0,dn=a.total&&t>=a.total,el=document.createElement("a");el.className="glesson";el.href=a.href;
  el.innerHTML=`<span>${pic(lpic(a))}${dn?`<i>${TK}</i>`:""}</span><b dir="auto">${a.name}</b>`;el.onclick=e=>{e.preventDefault();sPop();el.classList.add("go");setTimeout(()=>open1(k,a.href),300)};return el}

  const GL=$("#glist");g.L.forEach(a=>GL.appendChild(lessonEl(k,a)));
