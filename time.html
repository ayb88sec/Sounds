<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<script src="supa.js"></script>
<script src="profile.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<title>Days & Time</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Andika:wght@700&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:"Andika","Baloo Bhaijaan 2",system-ui,sans-serif;color:#2b2340;min-height:100vh;background:linear-gradient(170deg,#7ad7ff,#a78bfa 50%,#ff9ec7);background-attachment:fixed}
body.ar{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif}
main{max-width:780px;margin:0 auto;padding:16px 12px 70px}
h1{color:#fff;text-align:center;font-size:clamp(36px,9vw,54px);margin:8px 0 2px;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.sub{text-align:center;color:#fff;font-weight:700;font-size:18px;margin:0 0 12px}
.today{background:#fff;border-radius:26px;padding:12px 16px;text-align:center;font-size:22px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.12);margin-bottom:14px}
.today b{color:#7c4dff}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.menu button{border:0;border-radius:26px;padding:18px 14px;font-family:inherit;font-size:22px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.18);text-align:start;position:relative}
.menu button small{display:block;font-size:15px;opacity:.92;margin-top:4px}.menu button .st{position:absolute;top:10px;inset-inline-end:14px;font-size:15px}
.menu button:active{transform:translateY(5px)}
.grp{color:#fff;font-weight:800;font-size:20px;margin:16px 4px 8px}
.card{background:#fff;border-radius:34px;padding:18px 14px;box-shadow:0 8px 0 rgba(0,0,0,.12);text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:700;font-size:20px;margin-bottom:10px}
.top button{border:0;background:#fff;color:#7c4dff;border-radius:999px;padding:8px 16px;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer}
.train{display:flex;gap:8px;overflow-x:auto;padding:30px 4px 14px;scrollbar-width:none}.train::-webkit-scrollbar{display:none}
.car{flex:none;width:118px;border:0;border-radius:20px 20px 12px 12px;padding:10px 6px 26px;color:#fff;font-family:inherit;font-weight:700;font-size:19px;cursor:pointer;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.18);animation:bob 2.4s ease-in-out infinite}
.car .e{font-size:40px;display:block}.car::after{content:"⚫ ⚫";position:absolute;bottom:-12px;left:0;right:0;font-size:18px;letter-spacing:22px}
.car.now{outline:6px solid #ffd23f}
@keyframes bob{50%{transform:translateY(-4px)}}
.q{font-size:clamp(28px,7vw,40px);font-weight:700;margin:10px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.opts button{border:0;border-radius:22px;padding:16px 6px;font-family:inherit;font-size:clamp(20px,5vw,28px);font-weight:700;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.opts button.wrong{animation:shake .4s;opacity:.35}.opts button.right{outline:7px solid #ffd23f}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.clock{width:min(78vw,330px);height:min(78vw,330px);display:block;margin:6px auto}
.clock .hand{transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-origin:150px 150px}
.dig{font-size:44px;font-weight:700;color:#7c4dff;margin:4px 0}
.words{font-size:26px;font-weight:700;margin-bottom:8px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.ctl button{border:0;border-radius:999px;padding:12px 18px;font-family:inherit;font-size:20px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 8px}.dots i{width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.12)}.dots i.ok{background:#3fc35a}.dots i.no{background:#ff5d73}
.done{font-size:34px;font-weight:700;margin:16px 0}
.lang{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:15;border:0;border-radius:18px;background:#fff;height:52px;padding:0 14px;font-family:inherit;font-size:18px;font-weight:700;color:#7c4dff;box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>
</head>
<body>
<a href="home.html" aria-label="Home" style="position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:15;width:52px;height:52px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 5px 0 rgba(0,0,0,.18)">🏠</a>
<button class="lang" id="lang"></button>
<canvas id="fx"></canvas>
<main><h1 id="ttl"></h1><p class="sub" id="sub"></p><div id="app"></div></main>
<script>
const $=id=>document.getElementById(id);
let AR=new URLSearchParams(location.search).get("l")==="ar";
function setLang(){document.documentElement.lang=AR?"ar":"en";document.documentElement.dir=AR?"rtl":"ltr";document.body.classList.toggle("ar",AR);$("lang").textContent=AR?"English":"عربي";
  $("ttl").textContent=AR?"📅 الأيام والساعة ⏰":"📅 Days & Time ⏰";$("sub").textContent=AR?"تعلّم أيام الأسبوع وقراءة الساعة":"Learn the days of the week and tell the time"}
$("lang").onclick=()=>{AR=!AR;setLang();menu()};
/* the week, Monday first; a friendly animal for each day */
const DAYS=[["Monday","الاثنين","🐻","#ff7eb6"],["Tuesday","الثلاثاء","🐯","#ffb020"],["Wednesday","الأربعاء","🐸","#3fc35a"],["Thursday","الخميس","🐳","#22c7b8"],["Friday","الجمعة","🦄","#4f8bff"],["Saturday","السبت","🐼","#a66bff"],["Sunday","الأحد","🦁","#ff5d73"]];
const dn=d=>AR?DAYS[d][1]:DAYS[d][0];
const HR_AR=["الثانية عشرة","الواحدة","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة","الثامنة","التاسعة","العاشرة","الحادية عشرة","الثانية عشرة"];
const NUM_EN=["twelve","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
/* time in words, the way a teacher says it */
function words(h,m){const nh=h%12+1;
  if(AR){const M={0:"",5:" وخمس دقائق",10:" وعشر دقائق",15:" والربع",20:" والثلث",25:" والنصف إلا خمس دقائق",30:" والنصف",35:" والنصف وخمس دقائق"};
    if(m in M)return "الساعة "+HR_AR[h]+M[m];return "الساعة "+HR_AR[nh]+({40:" إلا ثلثًا",45:" إلا ربعًا",50:" إلا عشر دقائق",55:" إلا خمس دقائق"}[m])}
  const n=x=>({5:"five",10:"ten",15:"quarter",20:"twenty",25:"twenty-five",30:"half"}[x]);
  if(m===0)return NUM_EN[h]+" o'clock";if(m<=30)return n(m)+" past "+NUM_EN[h];return n(60-m)+" to "+NUM_EN[nh]}
const dig=(h,m)=>h+":"+String(m).padStart(2,"0");
/* levels the parent can switch on; default follows the child's grade */
const LV=[
 {k:"days",g:"days",en:"Days of the week",ar:"أيام الأسبوع",s:"🚂",c:"#ff7eb6"},
 {k:"yt",g:"days",en:"Yesterday & tomorrow",ar:"أمس وغدًا",s:"⬅️ 📅 ➡️",c:"#ffb020"},
 {k:"oc",g:"time",en:"O'clock",ar:"الساعة تمامًا",s:"3:00",c:"#4f8bff",step:60},
 {k:"half",g:"time",en:"Half past",ar:"والنصف",s:"3:30",c:"#22c7b8",step:30},
 {k:"qtr",g:"time",en:"Quarter past & to",ar:"الربع وإلا ربع",s:"3:15 · 3:45",c:"#a66bff",step:15},
 {k:"five",g:"time",en:"Every 5 minutes",ar:"كل ٥ دقائق",s:"3:25 · 3:50",c:"#ff5d73",step:5}];
let ON=NAJMA.lv("time");const me=NAJMA.me||{};
if(!(me.levels&&Array.isArray(me.levels.time)&&me.levels.time.length)&&me.grade){if(/^KG/.test(me.grade))ON=[0,1,2,3];else if(me.grade==="G1")ON=[0,1,2,3,4];}
let done={};try{done=JSON.parse(localStorage.getItem("timeDone")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("timeDone",JSON.stringify(done))}catch(e){}};
const rnd=n=>Math.floor(Math.random()*n),shuf=a=>[...a].sort(()=>Math.random()-.5);
/* voice: English uses the iPad voice; Arabic the AI voice (or nothing, as the parent chooses) */
let voice=null;function pv(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}if("speechSynthesis" in window){pv();speechSynthesis.onvoiceschanged=pv}
const VM=NAJMA.vmode("time","ai");
function speak(t){if(VM==="none")return;if(AR){NAJMA.aiSay(t);return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
/* sounds + confetti */
let ac;function tone(f,d,w=0,ty="triangle",v=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,ac.currentTime+w);g.gain.setValueAtTime(v,ac.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+w+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d+.02)}catch(e){}}
const yay=()=>{tone(660,.12);tone(990,.15,.08)},fan=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,i*.12)),buzz=()=>tone(160,.25,0,"sawtooth",.08),tick=()=>tone(1200,.04,0,"square",.05),choo=()=>{tone(300,.3,0,"sawtooth",.06);tone(380,.3,.3,"sawtooth",.06)};
const COL=["#ff5d73","#ffb020","#22c7b8","#4f8bff","#a66bff","#3fc35a"];
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],run=false;function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}size();addEventListener("resize",size);
function burst(x,y,n=36){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=3+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:4+Math.random()*7,c:COL[i%6],rot:0,vr:(Math.random()-.5)*.4,life:90})}if(!run){run=true;requestAnimationFrame(loop)}}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life-->0);for(const p of parts){p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/30);cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}if(parts.length)requestAnimationFrame(loop);else run=false}
const at=el=>{const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,26)};

/* a friendly clock face */
function clockSVG(h,m){let t="";for(let i=1;i<=12;i++){const a=i*Math.PI/6;t+=`<text x="${150+Math.sin(a)*112}" y="${150-Math.cos(a)*112+11}" text-anchor="middle" font-size="30" font-weight="800" fill="${COL[i%6]}" font-family="Andika,sans-serif">${i}</text>`}
  for(let i=0;i<60;i++){const a=i*Math.PI/30,r1=i%5?136:130;t+=`<line x1="${150+Math.sin(a)*r1}" y1="${150-Math.cos(a)*r1}" x2="${150+Math.sin(a)*142}" y2="${150-Math.cos(a)*142}" stroke="#c9c0e0" stroke-width="${i%5?2:4}"/>`}
  return `<svg class="clock" viewBox="0 0 300 300"><circle cx="150" cy="150" r="146" fill="#fff" stroke="#7c4dff" stroke-width="8"/>${t}
    <g class="hand" id="hH" style="transform:rotate(${(h%12)*30+m/2}deg)"><line x1="150" y1="150" x2="150" y2="82" stroke="#2b2340" stroke-width="12" stroke-linecap="round"/></g>
    <g class="hand" id="hM" style="transform:rotate(${m*6}deg)"><line x1="150" y1="150" x2="150" y2="40" stroke="#ff5d73" stroke-width="8" stroke-linecap="round"/></g>
    <circle cx="150" cy="150" r="11" fill="#ffd23f" stroke="#2b2340" stroke-width="3"/></svg>`}
function setHands(h,m,turns){const H=$("hH"),M=$("hM");if(!H)return;H.style.transform=`rotate(${(h%12)*30+m/2+(turns||0)*360}deg)`;M.style.transform=`rotate(${m*6+(turns||0)*360}deg)`}

function menu(){const A=$("app");const d=(new Date().getDay()+6)%7,h=new Date().getHours()%12||12,m=new Date().getMinutes();
  A.innerHTML=`<div class="today">${AR?"اليوم":"Today is"} <b>${DAYS[d][2]} ${dn(d)}</b> · ${AR?"الساعة الآن":"the time is"} <b>${dig(h,m)}</b></div>`;let g="";
  ON.forEach(i=>{const L=LV[i];if(L.g!==g){g=L.g;A.insertAdjacentHTML("beforeend",`<div class="grp">${g==="days"?(AR?"📅 الأيام":"📅 Days"):(AR?"⏰ الساعة":"⏰ Time")}</div><div class="menu" id="m_${g}"></div>`)}
    const b=document.createElement("button");b.style.background=L.c;const st=Object.keys(done).filter(k=>k.startsWith(L.k+"r")).length;
    b.innerHTML=`<span class="st">${"⭐".repeat(Math.min(st,3))}</span>${AR?L.ar:L.en}<small>${L.s}</small>`;b.onclick=()=>L.g==="days"?(L.k==="days"?trainView(i):quiz(i)):clockView(i);$("m_"+g).appendChild(b)})}
const head=t=>`<div class="top"><button id="back">${AR?"⬅ رجوع":"⬅ Back"}</button><span>${t||""}</span></div>`;

/* days: the train, then games */
function trainView(i){$("app").innerHTML=head()+`<div class="card"><div class="q">${AR?"قطار الأيام":"The days train"} 🚂</div><div class="train" id="tr"></div>
  <div class="ctl"><button style="background:#ff7eb6" id="sing">🎵 ${AR?"قل كل الأيام":"Say all the days"}</button><button style="background:#7c4dff" id="go">🎮 ${AR?"العب":"Play"}</button></div></div>`;
  $("back").onclick=menu;const today=(new Date().getDay()+6)%7;
  DAYS.forEach((d,k)=>{const b=document.createElement("button");b.className="car"+(k===today?" now":"");b.style.background=d[3];b.style.animationDelay=(k*.2)+"s";b.innerHTML=`<span class="e">${d[2]}</span>${dn(k)}`;b.onclick=()=>{speak(dn(k));at(b);tick()};$("tr").appendChild(b)});
  $("sing").onclick=async()=>{choo();const cars=[...$("tr").children];for(let k=0;k<7;k++){cars[k].scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});cars[k].style.transform="scale(1.12)";speak(dn(k));await new Promise(r=>setTimeout(r,AR?1500:1000));cars[k].style.transform=""}};
  $("go").onclick=()=>quiz(i)}
/* question makers for each level */
function qDays(k){const d=rnd(7);if(k==="days"){const t=rnd(2);return t?{q:AR?`ما اليوم الذي بعد ${dn(d)}؟`:`What day comes after ${dn(d)}?`,a:(d+1)%7}:{q:AR?`ما اليوم الذي قبل ${dn(d)}؟`:`What day comes before ${dn(d)}?`,a:(d+6)%7}}
  const t=rnd(2);return t?{q:AR?`إذا كان اليوم ${dn(d)}، فغدًا هو…`:`If today is ${dn(d)}, tomorrow is…`,a:(d+1)%7}:{q:AR?`إذا كان اليوم ${dn(d)}، فأمس كان…`:`If today is ${dn(d)}, yesterday was…`,a:(d+6)%7}}
function quiz(i){const L=LV[i],N=8;let k=0,score=0;const res=[],used=new Set();
  function next(){if(k>=N)return finish(i,score,N);let Q;for(let t=0;t<30;t++){Q=qDays(L.k);if(!used.has(Q.q))break}used.add(Q.q);
    const O=shuf([Q.a,...shuf([0,1,2,3,4,5,6].filter(x=>x!==Q.a)).slice(0,3)]);
    $("app").innerHTML=head(`${k+1} / ${N}`)+`<div class="card"><div class="dots">${Array.from({length:N},(_,j)=>`<i class="${res[j]===1?"ok":res[j]===0?"no":""}"></i>`).join("")}</div><div class="q">${Q.q}</div>
      <div class="opts">${O.map(o=>`<button style="background:${DAYS[o][3]}" data-v="${o}">${DAYS[o][2]} ${dn(o)}</button>`).join("")}</div></div>`;
    $("back").onclick=menu;speak(Q.q);let first=true;
    document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{if(+b.dataset.v===Q.a){b.classList.add("right");yay();at(b);speak(dn(Q.a));if(first)score++;res[k]=first?1:0;k++;setTimeout(next,1100)}else{first=false;b.classList.add("wrong");buzz()}})}
  next()}

/* time: play with the clock, then "what time is it?" and "set the clock" */
function clockView(i){const L=LV[i];let h=3,m=0;
  $("app").innerHTML=head()+`<div class="card"><div id="ck">${clockSVG(h,m)}</div><div class="dig" id="dg"></div><div class="words" id="wd"></div>
    <div class="ctl"><button style="background:#4f8bff" id="ph">⏩ ${AR?"ساعة":"1 hour"}</button><button style="background:#22c7b8" id="pm">⏩ ${L.step===60?(AR?"ساعة":"1 hour"):L.step===30?(AR?"نصف ساعة":"half an hour"):L.step===15?(AR?"ربع ساعة":"quarter of an hour"):(AR?"٥ دقائق":"5 minutes")}</button>
      <button style="background:#ff7eb6" id="say">🔊</button></div>
    <div class="ctl"><button style="background:#7c4dff" id="g1">🎮 ${AR?"كم الساعة؟":"What time is it?"}</button><button style="background:#ffb020" id="g2">🕹️ ${AR?"اضبط الساعة":"Set the clock"}</button></div></div>`;
  $("back").onclick=menu;let turns=0;
  const show=()=>{setHands(h,m,turns);$("dg").textContent=dig(h||12,m);$("wd").textContent=words(h||12,m)};show();
  $("ph").onclick=()=>{h=h%12+1;tick();show();speak(words(h,m))};
  $("pm").onclick=()=>{m+=L.step;if(m>=60){m-=60;h=h%12+1;turns++}tick();show();speak(words(h||12,m))};
  $("say").onclick=()=>speak(words(h||12,m));$("g1").onclick=()=>readQuiz(i);$("g2").onclick=()=>setGame(i)}
const randTime=L=>{const steps=60/L.step;return [1+rnd(12),rnd(steps)*L.step]};
function readQuiz(i){const L=LV[i],N=8;let k=0,score=0;const res=[],used=new Set();
  function next(){if(k>=N)return finish(i,score,N);let h,m;for(let t=0;t<30;t++){[h,m]=randTime(L);if(!used.has(h+":"+m))break}used.add(h+":"+m);
    const alts=new Set([h+":"+m]);while(alts.size<4){const [a,b]=rnd(2)?randTime(L):[(h+rnd(3)+10)%12+1,m];alts.add(a+":"+b)}
    const O=shuf([...alts]).map(s=>s.split(":").map(Number));
    $("app").innerHTML=head(`${k+1} / ${N}`)+`<div class="card"><div class="dots">${Array.from({length:N},(_,j)=>`<i class="${res[j]===1?"ok":res[j]===0?"no":""}"></i>`).join("")}</div>
      <div class="q" style="font-size:28px">${AR?"كم الساعة؟":"What time is it?"}</div>${clockSVG(h,m)}<div class="opts">${O.map(([a,b],j)=>`<button style="background:${COL[j%6]}" data-v="${a}:${b}">${dig(a,b)}<br><small style="font-size:16px">${words(a,b)}</small></button>`).join("")}</div></div>`;
    $("back").onclick=()=>clockView(i);speak(AR?"كم الساعة؟":"What time is it?");let first=true;
    document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{if(b.dataset.v===h+":"+m){b.classList.add("right");yay();at(b);speak(words(h,m));if(first)score++;res[k]=first?1:0;k++;setTimeout(next,1500)}else{first=false;b.classList.add("wrong");buzz()}})}
  next()}
function setGame(i){const L=LV[i],N=5;let k=0,score=0;const res=[],used=new Set();
  function next(){if(k>=N)return finish(i,score,N);let th,tm;for(let t=0;t<30;t++){[th,tm]=randTime(L);if(!used.has(th+":"+tm)&&!(th===12&&tm===0))break}used.add(th+":"+tm);let h=12,m=0,turns=0,tries=0;
    $("app").innerHTML=head(`${k+1} / ${N}`)+`<div class="card"><div class="q" style="font-size:26px">${AR?"اضبط الساعة على":"Set the clock to"}<br><span style="color:#7c4dff">${words(th,tm)}</span></div>${clockSVG(h,m)}
      <div class="ctl"><button style="background:#4f8bff" id="ph">${AR?"⏩ عقرب الساعات":"⏩ hour hand"}</button>${L.step<60?`<button style="background:#22c7b8" id="pm">${AR?"⏩ عقرب الدقائق":"⏩ minute hand"}</button>`:""}</div>
      <div class="ctl"><button style="background:#3fc35a;font-size:24px" id="ok">✅ ${AR?"تم":"Done"}</button></div></div>`;
    $("back").onclick=()=>clockView(i);speak((AR?"اضبط الساعة على ":"Set the clock to ")+words(th,tm));
    $("ph").onclick=()=>{h=h%12+1;tick();setHands(h,m,turns)};if($("pm"))$("pm").onclick=()=>{m+=L.step;if(m>=60){m=0;turns++}tick();setHands(h,m,turns)};
    $("ok").onclick=e=>{if(h===th&&m===tm){yay();at(e.target);speak(words(th,tm));if(!tries)score++;res[k]=tries?0:1;k++;setTimeout(next,1300)}else{tries++;buzz();e.target.animate([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"none"}],{duration:300})}}}
  next()}
function finish(i,score,N){const L=LV[i],stars=score>=N-1?3:score>=N*.7?2:score>=N/2?1:0;
  if(stars){const n=Object.keys(done).filter(x=>x.startsWith(L.k+"r")).length;if(n<3){done[L.k+"r"+(n+1)]=stars;save()}}
  fan();for(let j=0;j<6;j++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight/3),j*150);
  $("app").innerHTML=`<div class="card"><div class="done">${stars?(AR?"🎉 أحسنت!":"🎉 Well done!"):(AR?"💪 محاولة حلوة!":"💪 Good try!")}</div><div style="font-size:60px">${stars?"⭐".repeat(stars):"🙂"}</div><div style="font-size:24px;margin:10px 0">${score} / ${N}</div>
    <div class="opts"><button style="background:#3fc35a" id="again">🔁 ${AR?"مرة ثانية":"Again"}</button><button style="background:#7c4dff" id="lv">📚 ${AR?"القائمة":"Menu"}</button></div></div>`;
  $("again").onclick=()=>L.g==="days"?quiz(i):clockView(i);$("lv").onclick=menu}
setLang();const P=new URLSearchParams(location.search).get("v");if(P!=null&&LV[+P])(LV[+P].g==="days"?(LV[+P].k==="days"?trainView:quiz):clockView)(+P);else menu();
</script>
