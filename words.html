<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="profile.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Words</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Baloo+Bhaijaan+2:wght@600;800&display=swap">
<style>
:root{--ink:#2b2340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Andika","Baloo Bhaijaan 2",system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(160deg,#ffcf3c,#ff9a3c 45%,#ff6f91);background-attachment:fixed}
body.ar{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-80px;border-radius:50%;background:rgba(255,255,255,.18);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh)}}
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px 12px 50px}
h1{font-family:"Baloo 2","Baloo Bhaijaan 2";font-weight:800;font-size:clamp(40px,10vw,60px);margin:0;line-height:1.15;color:#fff;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.mascotWrap{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:6px 0 0}
#pip{width:80px;height:80px;cursor:pointer;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15));flex:none}
#pip.jump{animation:jump .7s ease}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes jump{0%{transform:none}30%{transform:translateY(-30px) scale(1.1)}60%{transform:translateY(0)}100%{transform:none}}
.bubble{background:#fff;border-radius:22px;padding:10px 16px;font-family:"Baloo 2","Baloo Bhaijaan 2";font-weight:700;font-size:20px;max-width:260px;box-shadow:0 5px 0 rgba(0,0,0,.12);margin-bottom:28px}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
section{background:rgba(255,255,255,.93);border-radius:30px;padding:14px 14px 20px;margin-top:16px;box-shadow:0 10px 0 rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{position:relative;border:0;border-radius:22px;min-height:84px;padding:10px 8px;color:#fff;font-family:inherit;font-weight:700;font-size:28px;cursor:pointer;
  box-shadow:0 7px 0 rgba(0,0,0,.2);animation:enter .45s backwards;text-shadow:0 3px 0 rgba(0,0,0,.15);word-break:break-word}
.tile:active{transform:translateY(5px) scale(.96)}
.tile .st{position:absolute;top:2px;inset-inline-end:6px;font-size:14px}
@keyframes enter{from{transform:scale(0);opacity:0}}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.btn{font-family:"Baloo 2","Baloo Bhaijaan 2";font-size:20px;font-weight:800;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;color:var(--ink);background:#ffe066;box-shadow:0 6px 0 #d9a400}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #d9a400}
.btn.pink{background:#a66bff;box-shadow:0 6px 0 #7a46d0;color:#fff}
.btn.teal{background:#22c7b8;box-shadow:0 6px 0 #149488;color:#fff}
.btn.ghost{background:#fff;box-shadow:0 6px 0 #f0dcc8;font-size:17px}
.modal{position:fixed;inset:0;background:rgba(70,25,20,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal.show{display:flex}
.card{background:#fff;border-radius:34px;padding:18px 14px;text-align:center;max-width:560px;width:100%;max-height:96vh;overflow:auto;animation:zoom .45s cubic-bezier(.3,1.6,.5,1);position:relative}
@keyframes zoom{from{transform:scale(.3);opacity:0}}
.x{position:absolute;top:10px;inset-inline-end:12px;border:0;background:#f0edf7;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.big{font-size:clamp(44px,13vw,84px);font-weight:700;line-height:1.3;border-radius:26px;color:#fff;margin:26px 0 10px;padding:4px 10px;cursor:pointer;text-shadow:0 4px 0 rgba(0,0,0,.15);word-break:break-word}
.big b{color:#ffe066}
.spell{display:flex;gap:5px;justify-content:center;margin:6px 0 4px;flex-wrap:wrap}
.spell button{font-family:inherit;font-size:28px;font-weight:700;border:0;border-radius:12px;min-width:44px;height:54px;background:#f3f0fa;cursor:pointer;color:var(--ink)}
.spell button.lit{background:#ffe066;transform:translateY(-4px)}
.lbl{font-size:16px;color:#7a7090;margin:12px 0 6px}
.prow{display:flex;gap:10px;justify-content:center}
.pbtn{font-family:inherit;font-size:19px;font-weight:800;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;color:#fff;background:#ff5d73;box-shadow:0 5px 0 #c93a50}
.pbtn.me{background:#22c7b8;box-shadow:0 5px 0 #149488}
.pbtn:disabled{opacity:.4}
.pbtn.on{animation:pop 1s infinite;background:#a66bff}
.navrow{display:flex;justify-content:space-between;margin-top:14px}
/* spelling game */
.q{font-family:"Baloo 2","Baloo Bhaijaan 2";font-size:24px;font-weight:800;margin:28px 0 6px}
.show{font-size:clamp(40px,12vw,72px);font-weight:700;min-height:1.4em;line-height:1.3;color:#4f8bff;transition:opacity .3s}
.slots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slots span{min-width:42px;height:56px;border-bottom:5px solid #d6cfe6;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center}
.slots span.f{border-color:#3fc35a;color:#2a9442;animation:pop .3s}
.pool{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.pool button{font-family:inherit;font-size:32px;font-weight:700;border:0;border-radius:16px;width:58px;height:62px;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pool button.used{visibility:hidden}
.pool button.wrong{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.score{font-family:"Baloo 2","Baloo Bhaijaan 2";font-size:19px;font-weight:700;color:#7a7090}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>
</head>
<body>
<a href="home.html" id="homeBtn" aria-label="Home" style="position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:15;width:52px;height:52px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 5px 0 rgba(0,0,0,.18)">🏠</a>
<div class="bubbles" id="bubbles"></div>
<canvas id="fx"></canvas>
<main>
  <h1 id="title"></h1>
  <div class="mascotWrap">
    <svg id="pip" viewBox="0 0 100 100">
      <path d="M50 6 L62 36 L94 38 L69 58 L77 90 L50 72 L23 90 L31 58 L6 38 L38 36 Z" fill="#ffe066" stroke="#e0a800" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="41" cy="48" r="5" fill="#2b2340"/><circle cx="59" cy="48" r="5" fill="#2b2340"/>
      <circle cx="43" cy="46" r="1.8" fill="#fff"/><circle cx="61" cy="46" r="1.8" fill="#fff"/>
      <circle cx="34" cy="58" r="4" fill="#ff8fab" opacity=".7"/><circle cx="66" cy="58" r="4" fill="#ff8fab" opacity=".7"/>
      <path d="M42 59 Q50 67 58 59" fill="none" stroke="#2b2340" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <div class="bubble" id="say"></div>
  </div>
  <section>
    <div class="grid" id="grid"></div>
    <div class="bar">
      <button class="btn pink" id="spellBtn"></button>
      <button class="btn teal" id="writeBtn"></button>
    </div>
  </section>
</main>

<div class="modal" id="wordModal"><div class="card">
  <button class="x" data-close>✕</button>
  <div class="big" id="wBig"></div>
  <div class="bar" style="margin-top:0" id="wSayBar"><button class="btn" id="wSay">🔊</button></div>
  <div class="lbl" id="lSpell"></div>
  <div class="spell" id="spell"></div>
  <div class="bar"><button class="btn teal" id="wWrite"></button></div>
  <div id="practice"></div>
  <div class="navrow"><button class="btn ghost" id="wPrev"></button><button class="btn ghost" id="wNext"></button></div>
</div></div>

<div class="modal" id="spellModal"><div class="card">
  <button class="x" data-close>✕</button>
  <div class="q" id="sQ"></div>
  <div class="show" id="sShow"></div>
  <div class="bar" style="margin:4px 0"><button class="btn ghost" id="sHear">🔊</button><button class="btn ghost" id="sPeek"></button></div>
  <div class="slots" id="slots"></div>
  <div class="pool" id="pool"></div>
  <div class="score" id="sScore"></div>
</div></div>

<script src="writepad.js"></script>
<script>
const SID=new URLSearchParams(location.search).get("s")||"spell1";
const SEC=NAJMA.sections.find(s=>s.id===SID)||NAJMA.sections[0];
const AR=SEC.lang==="ar",WORDS=SEC.words.filter(Boolean);
document.documentElement.lang=AR?"ar":"en";document.documentElement.dir=AR?"rtl":"ltr";if(AR)document.body.classList.add("ar");
document.title=SEC.title;
const T=AR?{hi:"اضغط على كلمة واقرأها معي!",spell:"🐝 تهجَّ الكلمات",write:"✏️ اكتب الكلمات",look:"انظر جيدًا… 👀",build:"رتّب الحروف!",peek:"👀 نظرة",tapL:"اضغط على الحروف لتتهجّاها",w:"✏️ اكتبها",prev:"➡️ السابق",next:"التالي ⬅️",done:"أنهيت كل الكلمات! 🏆",praise:["أحسنت!","رائع!","ممتاز!","شاطر!"],again:"حاول مرة ثانية 💪",me:"▶️ صوتي",rec:"🎤 سجّل",turn:"🎤 دورك! قُلها"}
          :{hi:"Tap a word and read it with me!",spell:"🐝 Spelling test",write:"✏️ Write the words",look:"Look carefully… 👀",build:"Now spell it!",peek:"👀 Peek",tapL:"Tap the letters to spell it",w:"✏️ Write it",prev:"⬅️ Back",next:"Next ➡️",done:"All words done! 🏆",praise:["Amazing!","Well done!","Super speller!","Brilliant!","You got it!"],again:"Try again 💪",me:"▶️ My voice",rec:"🎤 Record",turn:"🎤 Your turn! Say it"};
const COLORS=["#ff5d73","#ffb020","#22c7b8","#4f8bff","#a66bff","#3fc35a"];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const KEY="sec_"+SEC.id;let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
document.getElementById("title").textContent=`${SEC.icon||""} ${SEC.title}`;
const bb=document.getElementById("bubbles");
for(let i=0;i<14;i++){const s=document.createElement("span"),z=20+Math.random()*70;
  s.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${10+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;bb.appendChild(s)}

/* voice: English words use the iPad voice. Arabic lists have no robot voice (it mispronounces). */
let voice=null;
function pv(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if(!AR&&"speechSynthesis" in window){pv();speechSynthesis.onvoiceschanged=pv}
function sayW(w){if(AR)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.75;speechSynthesis.speak(u)}catch(e){}}
if(AR){document.getElementById("wSayBar").style.display="none";document.getElementById("sHear").style.display="none"}

let ac;
function tone(f,d,type="sine",w=0,vol=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,ac.currentTime+w);g.gain.setValueAtTime(vol,ac.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+w+d);
  o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d+.02)}catch(e){}}
const popSnd=()=>{tone(520,.12,"triangle");tone(880,.14,"triangle",.07)};
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",i*.12));
const buzz=()=>tone(160,.25,"sawtooth",0,.08);
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],running=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
size();addEventListener("resize",size);
function burst(x,y,n=36){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*7;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:4+Math.random()*6,c:COLORS[i%6],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:90+Math.random()*40})}
  if(!running){running=true;requestAnimationFrame(loop)}}
function rain(){for(let i=0;i<120;i++)setTimeout(()=>burst(Math.random()*innerWidth,-10,1),i*12)}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+40);
  for(const p of parts){p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/30);cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}
  if(parts.length)requestAnimationFrame(loop);else{running=false;cx.clearRect(0,0,innerWidth,innerHeight)}}
const burstAt=el=>{const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2)};
const pip=document.getElementById("pip"),say=document.getElementById("say");let sayT;say.textContent=T.hi;
function talk(t){say.textContent=t;say.classList.remove("pop");void say.offsetWidth;say.classList.add("pop");
  pip.classList.remove("jump");void pip.offsetWidth;pip.classList.add("jump");clearTimeout(sayT);sayT=setTimeout(()=>say.textContent=T.hi,6000)}
pip.onclick=()=>{popSnd();talk(rnd(T.praise));burstAt(pip)};
document.getElementById("spellBtn").textContent=T.spell;document.getElementById("writeBtn").textContent=T.write;
document.getElementById("sPeek").textContent=T.peek;document.getElementById("lSpell").textContent=T.tapL;document.getElementById("wWrite").textContent=T.w;

/* highlight a common start like "anti" in bold, as on the class sheet */
function pretty(w){const pre=["anti","un","re","dis","pre","mis"].find(p=>w.toLowerCase().startsWith(p)&&w.length>p.length+3);return pre?`<b>${w.slice(0,pre.length)}</b>${w.slice(pre.length)}`:w}

const grid=document.getElementById("grid");
function draw(){grid.innerHTML="";WORDS.forEach((w,i)=>{const b=document.createElement("button");b.className="tile";b.style.background=COLORS[i%6];
  b.style.animationDelay=(i*.04)+"s";b.innerHTML=pretty(w)+(done[w]?`<span class="st">${"⭐".repeat(done[w])}</span>`:"");b.onclick=()=>openW(i,b);grid.appendChild(b)})}
draw();

/* word card */
const wm=document.getElementById("wordModal");let cur=0;
function openW(i,el){cur=i;const w=WORDS[i];popSnd();if(el)burstAt(el);
  const big=document.getElementById("wBig");big.innerHTML=pretty(w);big.style.background=COLORS[i%6];big.onclick=()=>sayW(w);
  document.getElementById("wSay").onclick=()=>sayW(w);
  const sp=document.getElementById("spell");sp.innerHTML="";
  [...w].forEach(ch=>{if(ch===" ")return;const b=document.createElement("button");b.textContent=ch;b.onclick=()=>{b.classList.add("lit");popSnd();
    if([...sp.children].every(x=>x.classList.contains("lit"))){setTimeout(()=>{sayW(w);fanfare();burstAt(sp);talk(rnd(T.praise))},250)}};sp.appendChild(b)});
  document.getElementById("wWrite").onclick=()=>openWrite(i);
  const a=document.getElementById("wPrev"),b=document.getElementById("wNext");a.textContent=T.prev;b.textContent=T.next;
  a.style.visibility=i>0?"visible":"hidden";b.style.visibility=i<WORDS.length-1?"visible":"hidden";a.onclick=()=>openW(i-1);b.onclick=()=>openW(i+1);
  practiceUI(SEC.id+":"+w);wm.classList.add("show");setTimeout(()=>sayW(w),250)}

function openWrite(i){WritePad.open({items:WORDS,index:i,lang:AR?"ar":"en",rtl:AR,font:AR?'"Baloo Bhaijaan 2"':'"Andika"',aspect:2.2,yShift:AR?.48:.45,
  onSay:AR?null:(w=>sayW(w)),onStar:(w,s,res)=>{if(s>=2){fanfare();burstAt(res)}else buzz()}})}
document.getElementById("writeBtn").onclick=()=>openWrite(0);

/* practice recording, saved per child */
const kid={};let kdb=null,pRec=null,pTimer=null;
try{const r=indexedDB.open("kidWords",1);r.onupgradeneeded=()=>r.result.createObjectStore("v");
  r.onsuccess=()=>{kdb=r.result;kdb.transaction("v").objectStore("v").openCursor().onsuccess=e=>{const c=e.target.result;if(c){kid[c.key]=URL.createObjectURL(c.value);c.continue()}}}}catch(e){}
let curAudio=null;
function playKid(k){if(kid[k]){try{if(curAudio)curAudio.pause();curAudio=new Audio(kid[k]);curAudio.play()}catch(e){}}}
function practiceUI(k){const box=document.getElementById("practice");
  box.innerHTML=`<div class="lbl">${T.turn}</div><div class="prow"><button class="pbtn mic">${T.rec}</button><button class="pbtn me"${kid[k]?"":" disabled"}>${T.me}</button></div>`;
  const mic=box.querySelector(".mic"),me=box.querySelector(".me");
  mic.onclick=async()=>{if(pRec){pRec.stop();return}
    try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];pRec=new MediaRecorder(st);mic.classList.add("on");mic.textContent="⏹️";
      pRec.ondataavailable=e=>ch.push(e.data);
      pRec.onstop=()=>{clearTimeout(pTimer);st.getTracks().forEach(t=>t.stop());const blob=new Blob(ch,{type:pRec.mimeType||"audio/mp4"});
        if(kid[k])URL.revokeObjectURL(kid[k]);kid[k]=URL.createObjectURL(blob);try{kdb.transaction("v","readwrite").objectStore("v").put(blob,k)}catch(e){}
        pRec=null;mic.classList.remove("on");mic.textContent=T.rec;me.disabled=false;playKid(k);fanfare();burstAt(mic)};
      pRec.start();pTimer=setTimeout(()=>{if(pRec&&pRec.state==="recording")pRec.stop()},5000)}
    catch(e){mic.textContent="⚠️ 🎤";pRec=null}};
  me.onclick=()=>playKid(k)}

/* spelling test: look (or hear), cover, spell with letter tiles */
const sm=document.getElementById("spellModal");let order=[],si=0,word="",pos=0,miss=0,peeks=0,score=0;
const EXTRA=AR?"ابتثجحدرسعفقلمنهوي":"abcdefghijklmnoprstuwy";
function startSpell(){order=[...WORDS].sort(()=>Math.random()-.5);si=0;score=0;sm.classList.add("show");next()}
function next(){if(si>=order.length){fanfare();rain();talk(T.done);document.getElementById("sQ").textContent=T.done;
    document.getElementById("sShow").textContent="⭐ "+score+" / "+order.length*3;document.getElementById("slots").innerHTML="";document.getElementById("pool").innerHTML="";return}
  word=order[si];pos=0;miss=0;peeks=0;const letters=[...word].filter(c=>c!==" ");
  document.getElementById("sScore").textContent=`${si+1} / ${order.length}`;
  const sh=document.getElementById("sShow");sh.innerHTML=pretty(word);sh.style.opacity=1;document.getElementById("sQ").textContent=T.look;sayW(word);
  const slots=document.getElementById("slots");slots.innerHTML="";letters.forEach(()=>slots.appendChild(document.createElement("span")));
  const pool=document.getElementById("pool");pool.innerHTML="";
  const extra=[...EXTRA].filter(c=>!letters.includes(c)).sort(()=>Math.random()-.5).slice(0,Math.min(3,Math.max(1,6-letters.length)));
  [...letters,...extra].sort(()=>Math.random()-.5).forEach((c,k)=>{const b=document.createElement("button");b.textContent=c;b.style.background=COLORS[k%6];
    b.onclick=()=>tapLetter(b,c,letters);pool.appendChild(b)});
  pool.style.pointerEvents="none";pool.style.opacity=.5;
  setTimeout(()=>{sh.style.opacity=0;document.getElementById("sQ").textContent=T.build;pool.style.pointerEvents="";pool.style.opacity=1},Math.max(2500,word.length*350))}
function tapLetter(b,c,letters){if(c===letters[pos]){b.classList.add("used");popSnd();const s=document.getElementById("slots").children[pos];s.textContent=c;s.classList.add("f");pos++;
    if(pos===letters.length){const st=Math.max(1,3-(miss>1?1:0)-(peeks?1:0));score+=st;
      done[word]=Math.max(done[word]||0,st);save();draw();fanfare();burstAt(document.getElementById("slots"));talk(`${"⭐".repeat(st)} ${rnd(T.praise)}`);sayW(word);si++;setTimeout(next,1800)}}
  else{miss++;b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");buzz();talk(T.again)}}
document.getElementById("spellBtn").onclick=startSpell;
document.getElementById("sHear").onclick=()=>sayW(word);
document.getElementById("sPeek").onclick=()=>{peeks++;const sh=document.getElementById("sShow");sh.style.opacity=1;setTimeout(()=>sh.style.opacity=0,1200)};
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m||e.target.hasAttribute("data-close")){m.classList.remove("show");try{speechSynthesis.cancel()}catch(e){}}}));
</script>
</body>
</html>
