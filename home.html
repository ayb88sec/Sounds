<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;color:#2b2340;min-height:100vh;overflow-x:hidden;
  background:linear-gradient(165deg,#6a5cff 0%,#8f6bff 40%,#ff7eb6 100%);background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-80px;border-radius:50%;background:rgba(255,255,255,.16);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) translateX(-30px)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:22px 18px 40px}
.top{display:flex;align-items:center;gap:14px;color:#fff}
.top img{width:74px;height:74px;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.15);animation:bob 2.2s ease-in-out infinite;cursor:pointer}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.top h1{margin:0;font-size:38px;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.top p{margin:2px 0 0;font-size:19px;opacity:.95}
.stats{display:flex;gap:10px;margin:18px 0 6px}
.stat{flex:1;background:rgba(255,255,255,.22);border-radius:20px;padding:10px 12px;color:#fff;text-align:center;backdrop-filter:blur(6px)}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:15px;opacity:.95}
h2{color:#fff;font-size:22px;margin:22px 4px 10px;opacity:.95}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;max-width:520px;margin:0 auto}
.rowt{grid-column:1/-1;color:#fff;font-size:22px;font-weight:800;margin:14px 4px -4px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.app{position:relative;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;animation:enter .5s backwards}
@keyframes enter{from{transform:scale(.4) translateY(30px);opacity:0}}
.icon{position:relative;width:100%;aspect-ratio:1;border-radius:32%;display:flex;align-items:center;justify-content:center;font-size:64px;
  box-shadow:0 8px 0 rgba(0,0,0,.18),inset 0 -8px 0 rgba(0,0,0,.08);transition:transform .12s}
.icon::before{content:"";position:absolute;inset:6% 8% auto 8%;height:38%;border-radius:40% 40% 50% 50%;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}
.app:active .icon{transform:scale(.92) translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.app:hover .icon{transform:rotate(-3deg) scale(1.04)}
.icon .glyph{position:relative;font-weight:800;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.name{margin-top:8px;font-size:20px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.18);text-align:center;line-height:1.2}
.sub{font-size:14px;opacity:.9}
.ring{position:absolute;top:-8px;left:-8px;width:52px;height:52px}
.ringwrap circle{fill:none;stroke-width:6}
.ringwrap .bg{stroke:#eee8fb}
.ringwrap .fg{stroke:#ffe066;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s}
.ringwrap text{font-family:inherit;font-size:15px;font-weight:800;fill:#2b2340;text-anchor:middle;dominant-baseline:central}
.ringwrap{position:absolute;top:-6px;left:-6px;width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.ringwrap svg{width:100%;height:100%}
.kids{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;align-items:flex-start}
.kids::-webkit-scrollbar{display:none}
.kid{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;font-family:inherit;color:#fff;font-weight:800;font-size:16px;opacity:.7}
.kid .av{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;border:4px solid rgba(255,255,255,.6);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.kid.on{opacity:1}.kid.on .av{border-color:#fff;transform:scale(1.1);box-shadow:0 0 0 4px #ffe066,0 6px 0 rgba(0,0,0,.15)}
.kid.add .av{background:rgba(255,255,255,.25);font-size:30px}
.pm{position:fixed;inset:0;background:rgba(70,45,10,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.pm.show{display:flex}
.pc{background:linear-gradient(#fffdf6,#fff4d6);border:5px solid #fff;box-shadow:0 14px 0 #e8c46a,0 22px 34px rgba(120,80,20,.28);color:#16204a;border-radius:34px;padding:18px;max-width:440px;width:100%;max-height:94vh;overflow:auto;text-align:center}
.pc h3{margin:0 0 8px;font-size:26px}
.pc label{display:block;text-align:right;font-weight:800;color:#7a7090;margin:12px 4px 6px}
.in{width:100%;font-family:inherit;font-size:22px;border:3px solid #e6def8;border-radius:16px;padding:8px 12px;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{font-family:inherit;border:3px solid transparent;border-radius:14px;padding:6px 10px;font-size:17px;font-weight:700;background:#f3f0fa;cursor:pointer;color:#2b2340}
.chips button.on{border-color:#6a5cff;background:#ece8ff}
.chips.av button{font-size:30px;padding:4px 8px}
.chips .sw{width:40px;height:40px;border-radius:50%;padding:0}
.chips .sw.on{border-color:#2b2340}
.prow{display:flex;gap:8px;justify-content:center;margin-top:16px}
.pb{font-family:inherit;font-size:19px;font-weight:800;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:#f3f0fa;box-shadow:0 4px 0 #ddd3ee}
.pb.go{background:#3fc35a;color:#fff;box-shadow:0 4px 0 #2a9442}
.pb.del{background:#ffe1e6;color:#c93a50;box-shadow:0 4px 0 #f3b8c3}
.gear{background:rgba(255,255,255,.25);border:0;border-radius:16px;width:48px;height:48px;font-size:24px;cursor:pointer;margin-inline-start:auto}
.tip{margin-top:26px;background:rgba(255,255,255,.92);border-radius:24px;padding:14px 16px;font-size:17px;line-height:1.6}
.tip b{color:#6a5cff}

/* ===== picture-based home ===== */
body{background:#e9bf79;padding:0}
.bubbles{display:none}
main{max-width:none;padding:0;margin:0}
.scene{position:relative;width:100%;max-width:1100px;margin:0 auto;display:none}
.scene img.bg{width:100%;display:block}
.scene.on{display:block}
.z{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:40px;-webkit-tap-highlight-color:transparent}
.z:active{background:rgba(255,255,255,.25)}
.corner{position:absolute;z-index:5;display:flex;align-items:center;gap:8px}
.corner.tl{top:calc(2.2% + env(safe-area-inset-top));left:3%}
.corner.tr{top:calc(2.2% + env(safe-area-inset-top));right:3%}
.me{display:flex;flex-direction:column;align-items:center;cursor:pointer;border:0;background:none;padding:0;font-family:inherit}
.me .av{width:clamp(56px,9vw,96px);height:clamp(56px,9vw,96px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(32px,5.4vw,56px);border:4px solid #fff;box-shadow:0 0 0 3px #ffd23f,0 8px 16px rgba(0,0,0,.25)}
.me b{margin-top:-10px;background:#fff;border-radius:999px;padding:0 12px;font-size:clamp(17px,2.8vw,26px);color:#2b2340;box-shadow:0 5px 12px rgba(0,0,0,.2);white-space:nowrap}
.rb{width:clamp(48px,7.4vw,78px);height:clamp(48px,7.4vw,78px);border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 8px 18px rgba(0,0,0,.22),inset 0 -4px 0 rgba(0,0,0,.06);font-size:clamp(24px,3.8vw,40px);cursor:pointer;position:relative;font-family:inherit;display:flex;align-items:center;justify-content:center}
.rb i{position:absolute;bottom:-4px;right:-4px;background:#ff6f91;color:#fff;font-style:normal;font-size:13px;font-weight:800;border-radius:999px;padding:0 7px}
.hwn{position:absolute;background:#ff3b5c;color:#fff;font-weight:800;border-radius:999px;padding:0 9px;font-size:clamp(14px,2.4vw,22px);box-shadow:0 3px 0 rgba(0,0,0,.2);pointer-events:none;display:none}
.kids{display:none;position:absolute;z-index:7;left:3%;right:3%;top:calc(14% + env(safe-area-inset-top));background:rgba(255,255,255,.96);border-radius:24px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.kids.show{display:flex}.kid{color:#2b2340}
/* section view */
.sec{display:none;min-height:100vh;background:#efcb84 url(img/home3/bg_ipad.webp) center top/100% auto no-repeat;padding:calc(44vw + env(safe-area-inset-top)) clamp(14px,4vw,48px) 150px}
.sec.on{display:block}
@media (max-width:600px){.sec{background-image:url(img/home3/bg_phone.webp);padding-top:calc(62vw + env(safe-area-inset-top))}}
.back{top:calc(-44vw + 14px)}@media (max-width:600px){.back{top:calc(-62vw + 14px)}}
.ctop{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 22px;position:relative}
.ctop h2{margin:0;color:#16204a;font-size:clamp(34px,7vw,60px);text-shadow:0 3px 0 rgba(255,255,255,.85)}
.back{position:absolute;inset-inline-start:0;border:0;background:rgba(255,255,255,.95);border-radius:999px;padding:8px 18px;font-family:inherit;font-size:clamp(17px,3vw,24px);font-weight:800;color:#16204a;box-shadow:0 6px 14px rgba(120,80,20,.25);cursor:pointer}
.apps{max-width:900px;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,28vw,220px),1fr));gap:clamp(14px,3vw,28px)}
.apps .icon{background:rgba(255,255,255,.9)!important;border:4px solid #fff;box-shadow:0 10px 20px rgba(120,80,20,.25),inset 0 -6px 0 rgba(0,0,0,.05)}
.apps .icon::before{display:none}
.icon .pic{position:relative;width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
.apps .name{font-size:clamp(18px,3.4vw,26px);color:#16204a;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.apps .sub{color:#5a4a2a;opacity:1;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;display:grid;grid-template-columns:repeat(3,1fr);width:min(92vw,720px);height:clamp(78px,12vw,118px);background:rgba(255,250,240,.97);border-radius:999px;box-shadow:0 12px 28px rgba(100,60,10,.3),inset 0 -5px 0 rgba(0,0,0,.05);padding:0 10px}
.bar button{position:relative;border:0;background:none;font-family:inherit;color:#16204a;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0}
.bar .ic{display:flex;align-items:center;justify-content:center;width:clamp(44px,7.4vw,68px);height:clamp(44px,7.4vw,68px);transition:transform .25s}
.bar .ic img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
.bar b{font-size:clamp(15px,2.6vw,23px);font-weight:800}.bar small{font-size:clamp(11px,1.9vw,17px);font-weight:800;opacity:.85}
.bar button::before{content:"";position:absolute;left:50%;top:50%;width:clamp(96px,16vw,152px);height:clamp(96px,16vw,152px);border-radius:50%;transform:translate(-50%,-58%) scale(0);background:radial-gradient(circle at 50% 35%,#fff4a8,#ffd23f 70%);box-shadow:0 8px 16px rgba(200,140,0,.35),inset 0 -5px 0 rgba(0,0,0,.08);transition:transform .25s;z-index:-1}
.bar button.on::before{transform:translate(-50%,-58%) scale(1)}.bar button.on .ic{transform:translateY(-6px) scale(1.1)}.bar button.on b,.bar button.on small{transform:translateY(-6px)}
.bar .nb{position:absolute;top:4px;left:calc(50% + 14px);background:#ff3b5c;color:#fff;font-style:normal;font-weight:800;border-radius:999px;padding:0 8px;font-size:clamp(13px,2.2vw,19px);display:none;animation:pulse 1.4s ease-in-out infinite}
.bar button{isolation:isolate}
main{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
.scene{overflow:hidden}.scene .inner{position:relative}
/* the picture keeps its exact proportions, cropped just above the drawn bar */
.scene .inner{position:relative;width:100%}
.scene .inner img.bg{width:100%;height:auto;display:block}
/* fill the screen down to the bar: grow the picture (up to 10% wider, sides trimmed) so no empty strip is left */
.scene{max-width:none!important;overflow:hidden;direction:ltr}
#scIpad{--iw:min(1180px,clamp(100vw,calc((100dvh - clamp(92px,13.5vw,132px) - env(safe-area-inset-bottom))*1087/1255),110vw));height:calc(var(--iw)*1255/1087)}
#scPhone{--iw:clamp(100vw,calc((100dvh - clamp(92px,13.5vw,132px) - env(safe-area-inset-bottom))*852/1572),110vw);height:calc(var(--iw)*1572/852)}
.scene .inner{width:var(--iw)!important;margin-left:calc((100vw - var(--iw))/2)}
/* the picture keeps its place even before it has loaded, and is also painted as a background */
#scIpad .inner{aspect-ratio:1087/1447;background:url(img/home3/home_ipad.webp) center top/100% auto no-repeat}
#scPhone .inner{aspect-ratio:852/1846;background:url(img/home3/home_phone.webp) center top/100% auto no-repeat}
.scene .inner img.bg{position:absolute;inset:0;height:100%!important}
.hi{position:absolute;z-index:6;left:50%;top:6.2%;transform:translateX(-50%) rotate(-2deg);white-space:nowrap;pointer-events:none;animation:hin .8s .3s cubic-bezier(.3,1.6,.5,1) backwards,hsw 4s 1.2s ease-in-out infinite}
#scPhone .hi{top:9%}
.hi b{display:block;padding:.18em 1.1em .25em;border-radius:46% 46% 40% 40%/60% 60% 40% 40%;font-size:clamp(17px,3.8vw,34px);color:#fff;text-shadow:0 3px 0 #5e300a;
  background:repeating-linear-gradient(8deg,rgba(0,0,0,.05) 0 3px,transparent 3px 14px),linear-gradient(#d08a45,#a35f24 60%,#8a4b18);border:3px solid #7a4214;box-shadow:0 7px 0 #6a3610,0 12px 18px rgba(90,45,10,.35),inset 0 4px 0 rgba(255,255,255,.25)}
.hi::before,.hi::after{content:"";position:absolute;top:-14px;width:3px;height:16px;background:#7a4214}.hi::before{left:22%}.hi::after{right:22%}
@keyframes hin{from{transform:translateX(-50%) translateY(-60px) rotate(-12deg);opacity:0}}
@keyframes hsw{0%,100%{transform:translateX(-50%) rotate(-2deg)}50%{transform:translateX(-50%) rotate(2deg)}}
main{padding-bottom:calc(clamp(58px,8.5vw,92px) + env(safe-area-inset-bottom))}
.prow2{display:flex;align-items:center;gap:10px;background:#f8f6fd;border-radius:16px;padding:8px 12px;margin-bottom:6px;text-align:start}
.prow2 .g{width:44px;text-align:center;font-size:26px}.prow2 .g img{width:40px;height:40px}.prow2 .t{flex:1;font-weight:800}.prow2 .bb{height:10px;border-radius:9px;background:#eee8fb;overflow:hidden;margin-top:4px}.prow2 .bb i{display:block;height:100%;background:#ffc83d;border-radius:9px}

/* ===== movement ===== */
.cardov{position:absolute;pointer-events:none;z-index:2;animation:cin .7s cubic-bezier(.3,1.6,.5,1) backwards,flo 4.2s ease-in-out infinite;transform-origin:50% 60%}
.cardov img{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 12px rgba(110,60,10,.28))}
.cardov.tap{animation:squish .38s ease}
@keyframes cin{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2%)}}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(.9,.86)}70%{transform:scale(1.05,1.04)}100%{transform:scale(1)}}
.signov{position:absolute;pointer-events:none;z-index:2;animation:sgin .9s .2s cubic-bezier(.3,1.7,.5,1) backwards,wig 5s 1.4s ease-in-out infinite;transform-origin:50% 100%}
.signov img{width:100%;height:100%;display:block}
@keyframes sgin{0%{transform:scale(.94)}60%{transform:scale(1.06) rotate(-2deg)}100%{transform:scale(1)}}
@keyframes wig{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-3deg)}92%{transform:rotate(3deg)}95%{transform:rotate(-1.5deg)}}
.z{z-index:3}
.fly{position:fixed;z-index:4;width:clamp(90px,16vw,170px);pointer-events:none;top:8%;left:-25%;animation:flyx 14s linear infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.15))}
@keyframes flyx{0%{left:-25%;top:10%;transform:rotate(-4deg)}50%{top:4%;transform:rotate(3deg)}100%{left:115%;top:9%;transform:rotate(-4deg)}}
.spk{position:absolute;z-index:3;pointer-events:none;width:clamp(10px,1.8vw,20px);height:clamp(10px,1.8vw,20px);background:radial-gradient(circle,#fff 0 20%,rgba(255,240,170,.9) 35%,transparent 70%);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 2.6s ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(40deg)}}
.hwn{z-index:4;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.apps .app{animation:pin .55s cubic-bezier(.3,1.7,.5,1) backwards}
@keyframes pin{from{transform:scale(.2) rotate(-10deg);opacity:0}}
.apps .app.wig .icon{animation:wg .45s ease}
@keyframes wg{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}50%{transform:rotate(7deg) scale(1.05)}75%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.cardov,.signov,.fly,.spk,.hwn{animation:none!important}}

/* ===== progress page ===== */
.phd{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 14px;position:relative}

.stars i{width:clamp(24px,5.6vw,46px);height:clamp(24px,5.6vw,46px);background:url(img/home2/nav_star.webp) center/contain no-repeat;filter:grayscale(1) opacity(.35)}

.pgrid{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(260px,40vw,340px),1fr));gap:14px}
.pcard{display:flex;align-items:center;gap:12px;border-radius:30px;padding:10px 14px;border:4px solid rgba(255,255,255,.85);box-shadow:0 10px 20px rgba(120,80,20,.2),inset 0 10px 18px rgba(255,255,255,.55);animation:pin .5s cubic-bezier(.3,1.7,.5,1) backwards}

<div id="syncInfo" style="text-align:center;font:600 13px system-ui;color:rgba(255,255,255,.85);padding:6px 0 18px"></div>
<script>
/* small sync status, so a parent can see if this device gets updates from the portal */
(function(){const G=k=>Storage.prototype.getItem.call(localStorage,k),el=document.getElementById("syncInfo");
  if(!(window.SUPA&&SUPA.url)){el.textContent="";return}
  if(!G("najma:dev")){el.textContent="⚠️ هذا الجهاز غير مربوط بالبوابة: افتحي «📲 رابط الآيباد» للطفل وافتحي الرابط هنا";return}
  const t=+G("najma:syncAt")||0,e=G("najma:syncErr");
  el.textContent=(e==="full"?"⚠️ ذاكرة الجهاز ممتلئة · ":e?"⚠️ تعذّر التحديث ("+e+") · ":"☁️ ")+(t?"آخر تحديث: "+new Date(t).toLocaleString("ar",{dateStyle:"short",timeStyle:"short"}):"لم يتحدّث بعد")+(G("najma:spaceMB")?" · "+(window.NAJMA&&NAJMA.online?"📶":"💾")+" "+G("najma:spaceMB")+" MB":"")})();

</script>
</body>
</html>
