<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="profile.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نجمة">
<meta name="theme-color" content="#6a5cff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>نجمة ⭐ Najma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;color:#2b2340;min-height:100vh;overflow-x:hidden;
  background:linear-gradient(165deg,#6a5cff 0%,#8f6bff 40%,#ff7eb6 100%);background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-80px;border-radius:50%;background:rgba(255,255,255,.16);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) translateX(-30px)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:22px 18px 40px}
.top{display:flex;align-items:center;gap:14px;color:#fff}
.top img{width:74px;height:74px;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.15);animation:bob 2.2s ease-in-out infinite;cursor:pointer}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.top h1{margin:0;font-size:38px;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.top p{margin:2px 0 0;font-size:19px;opacity:.95}
.stats{display:flex;gap:10px;margin:18px 0 6px}
.stat{flex:1;background:rgba(255,255,255,.22);border-radius:20px;padding:10px 12px;color:#fff;text-align:center;backdrop-filter:blur(6px)}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:15px;opacity:.95}
h2{color:#fff;font-size:22px;margin:22px 4px 10px;opacity:.95}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;max-width:520px;margin:0 auto}
.rowt{grid-column:1/-1;color:#fff;font-size:22px;font-weight:800;margin:14px 4px -4px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.app{position:relative;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;animation:enter .5s backwards}
@keyframes enter{from{transform:scale(.4) translateY(30px);opacity:0}}
.icon{position:relative;width:100%;aspect-ratio:1;border-radius:32%;display:flex;align-items:center;justify-content:center;font-size:64px;
  box-shadow:0 8px 0 rgba(0,0,0,.18),inset 0 -8px 0 rgba(0,0,0,.08);transition:transform .12s}
.icon::before{content:"";position:absolute;inset:6% 8% auto 8%;height:38%;border-radius:40% 40% 50% 50%;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}
.app:active .icon{transform:scale(.92) translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.app:hover .icon{transform:rotate(-3deg) scale(1.04)}
.icon .glyph{position:relative;font-weight:800;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.name{margin-top:8px;font-size:20px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.18);text-align:center;line-height:1.2}
.sub{font-size:14px;opacity:.9}
.ring{position:absolute;top:-8px;left:-8px;width:52px;height:52px}
.ringwrap circle{fill:none;stroke-width:6}
.ringwrap .bg{stroke:#eee8fb}
.ringwrap .fg{stroke:#ffe066;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s}
.ringwrap text{font-family:inherit;font-size:15px;font-weight:800;fill:#2b2340;text-anchor:middle;dominant-baseline:central}
.ringwrap{position:absolute;top:-6px;left:-6px;width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.ringwrap svg{width:100%;height:100%}
.kids{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;align-items:flex-start}
.kids::-webkit-scrollbar{display:none}
.kid{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;font-family:inherit;color:#fff;font-weight:800;font-size:16px;opacity:.7}
.kid .av{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;border:4px solid rgba(255,255,255,.6);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.kid.on{opacity:1}.kid.on .av{border-color:#fff;transform:scale(1.1);box-shadow:0 0 0 4px #ffe066,0 6px 0 rgba(0,0,0,.15)}
.kid.add .av{background:rgba(255,255,255,.25);font-size:30px}
.pm{position:fixed;inset:0;background:rgba(30,15,70,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.pm.show{display:flex}
.pc{background:#fff;border-radius:28px;padding:18px;max-width:440px;width:100%;max-height:94vh;overflow:auto;text-align:center}
.pc h3{margin:0 0 8px;font-size:26px}
.pc label{display:block;text-align:right;font-weight:800;color:#7a7090;margin:12px 4px 6px}
.in{width:100%;font-family:inherit;font-size:22px;border:3px solid #e6def8;border-radius:16px;padding:8px 12px;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{font-family:inherit;border:3px solid transparent;border-radius:14px;padding:6px 10px;font-size:17px;font-weight:700;background:#f3f0fa;cursor:pointer;color:#2b2340}
.chips button.on{border-color:#6a5cff;background:#ece8ff}
.chips.av button{font-size:30px;padding:4px 8px}
.chips .sw{width:40px;height:40px;border-radius:50%;padding:0}
.chips .sw.on{border-color:#2b2340}
.prow{display:flex;gap:8px;justify-content:center;margin-top:16px}
.pb{font-family:inherit;font-size:19px;font-weight:800;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:#f3f0fa;box-shadow:0 4px 0 #ddd3ee}
.pb.go{background:#3fc35a;color:#fff;box-shadow:0 4px 0 #2a9442}
.pb.del{background:#ffe1e6;color:#c93a50;box-shadow:0 4px 0 #f3b8c3}
.gear{background:rgba(255,255,255,.25);border:0;border-radius:16px;width:48px;height:48px;font-size:24px;cursor:pointer;margin-inline-start:auto}
.tip{margin-top:26px;background:rgba(255,255,255,.92);border-radius:24px;padding:14px 16px;font-size:17px;line-height:1.6}
.tip b{color:#6a5cff}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<main>
  <div class="top">
    <img src="icon.png" alt="" id="star">
    <div style="flex:1"><h1 id="hello">أهلاً يا أبطال!</h1><p>ماذا نتعلم اليوم؟ · <bdi dir="ltr">Hello heroes!</bdi></p></div>
    <button class="gear" id="gear" aria-label="Settings">⚙️</button>
  </div>

  <div class="kids" id="kids"></div>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>⭐ نجوم</span></div>
    <div class="stat"><b id="sDone">0</b><span>🏆 أكملت</span></div>
  </div>

    <div class="apps" id="apps"></div>
</main>
<div class="pm" id="gate"><div class="pc">
  <h3>👨‍👩‍👧 للوالدين فقط</h3><p id="gQ" style="font-size:30px;font-weight:800;margin:6px 0" dir="ltr"></p>
  <input id="gA" inputmode="numeric" class="in" style="text-align:center;font-size:28px">
  <div class="prow"><button class="pb" data-x>إلغاء</button><button class="pb go" id="gOk">دخول</button></div></div></div>
<div class="pm" id="edit"><div class="pc">
  <h3 id="eT">طفل جديد</h3>
  <label>الاسم</label><input id="eName" class="in" maxlength="14" dir="auto">
  <label>الصورة</label><div class="chips" id="eAv"></div>
  <label>اللون</label><div class="chips" id="eCol"></div>
  <label>التطبيقات</label><div class="chips" id="eApps"></div>
  <label>الأرقام حتى</label><div class="chips" id="eNum"></div>
  <label>مجموعات Sight Words</label><div class="chips" id="eSight" dir="ltr"></div>
  <div class="prow"><button class="pb del" id="eDel">🗑️ حذف</button><button class="pb" data-x>إلغاء</button><button class="pb go" id="eSave">حفظ</button></div></div></div>
<script>
const ROWS=[
 {t:"🔤 العربية",apps:[
  {id:"arabic",href:"arabic.html",glyph:"أ ب",name:"حروفي",sub:"الحروف العربية",bg:"linear-gradient(150deg,#22c7b8,#2f8cff)",key:"arDone",total:38},
  {id:"numAr",href:"numbers-ar.html",glyph:"١٢٣",name:"الأرقام",sub:"من ١ إلى ٢٠",bg:"linear-gradient(150deg,#ffb020,#ff5d9e)",key:"numDoneAr",total:20}]},
 {t:"🕌 ديني",apps:[
  {id:"islam",href:"islam.html",glyph:"🕌",name:"أركان الإسلام",sub:"خمسة أركان",bg:"linear-gradient(150deg,#1fb59a,#0f9b8e)",key:"islamDone",total:5},
  {id:"iman",href:"iman.html",glyph:"✨",name:"أركان الإيمان",sub:"ستة أركان",bg:"linear-gradient(150deg,#8a5cff,#ff7eb6)",key:"imanDone",total:6}]},
 {t:"🇬🇧 English",apps:[
  {id:"sounds",href:"index.html",glyph:"🔤",name:"Sounds",sub:"Phonics",bg:"linear-gradient(150deg,#ff7eb6,#a66bff)",key:"soundsDone",total:32},
  {id:"cvc",href:"cvc.html",glyph:"cat",name:"CVC Words",sub:"Blend · B M E",bg:"linear-gradient(150deg,#22c7b8,#4f8bff)",key:"cvcDone",total:52},
  {id:"sent",href:"sentences.html",glyph:"✍🏽",name:"Sentences",sub:"Build & write",bg:"linear-gradient(150deg,#ff7eb6,#ffb020)",key:"sentDone",total:16},
  {id:"writeEn",href:"writing.html",glyph:"Aa",name:"Handwriting",sub:"abc · ABC · 123",bg:"linear-gradient(150deg,#a66bff,#ff7eb6)",key:"writeEn",total:62}]},
 {t:"🔷 Maths",apps:[
  {id:"numEn",href:"numbers-en.html",glyph:"123",name:"Numbers",sub:"1 to 20",bg:"linear-gradient(150deg,#4f8bff,#3fc35a)",key:"numDoneEn",total:20},
  {id:"shapes",href:"shapes.html",glyph:"🔺",name:"2D Shapes",sub:"Sides & corners",bg:"linear-gradient(150deg,#3fc35a,#22c7b8)",key:"shapesDone",total:10}]},
];
const bb=document.getElementById("bubbles");
for(let i=0;i<14;i++){const s=document.createElement("span"),z=20+Math.random()*70;
  s.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${10+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;bb.appendChild(s)}
function count(k){try{return Object.keys(JSON.parse(localStorage.getItem(k)||"{}")).length}catch(e){return 0}}
ROWS.push({t:"✏️ اسمي · My name",apps:[{id:"name",href:"name.html",glyph:NAJMA.me?(NAJMA.me.avatar||"✏️"):"✏️",name:"اسمي",sub:"My name",bg:"linear-gradient(150deg,#3fc35a,#22c7b8)",key:"_none",total:0}]});
NAJMA.sections.forEach((s,k)=>{const row=ROWS[s.lang==="ar"?0:2];row.apps.push({id:"s:"+s.id,href:"words.html?s="+encodeURIComponent(s.id),glyph:s.icon||"📝",name:s.title,
  sub:s.words.length+(s.lang==="ar"?" كلمات":" words"),bg:["linear-gradient(150deg,#ffcf3c,#ff6f91)","linear-gradient(150deg,#4f8bff,#a66bff)","linear-gradient(150deg,#22c7b8,#3fc35a)"][k%3],key:"sec_"+s.id,total:s.words.length})});
const box=document.getElementById("apps");
const ROWS2=ROWS;let stars=0,full=0;const seen=new Set();let i=0;
ROWS.forEach(row=>{if(!row.apps.some(a=>NAJMA.settings.apps[a.id]!==false))return;const hd=document.createElement("div");hd.className="rowt";hd.textContent=row.t;box.appendChild(hd);
row.apps.filter(a=>NAJMA.settings.apps[a.id]!==false).forEach(a=>{i++;
  const n=a.total?Math.min(count(a.key),a.total):0,pct=a.total?n/a.total:0,C=2*Math.PI*21;
  if(a.total&&!seen.has(a.key)){seen.add(a.key);stars+=n;if(n>=a.total)full++}
  const el=document.createElement("a");el.className="app";el.href=a.href;el.style.animationDelay=(i*.08)+"s";
  el.innerHTML=`<div class="icon" style="background:${a.bg}"><span class="glyph">${a.glyph}</span>
     ${a.total?`<div class="ringwrap"><svg viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="21"/><circle class="fg" cx="28" cy="28" r="21"
       stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-pct)}"/><text x="28" y="29">${pct>=1?"🏆":n}</text></svg></div>`:""}</div>
     <div class="name" dir="auto">${a.name}</div><div class="sub" dir="auto">${a.sub}</div>`;
  box.appendChild(el)})});
setTimeout(()=>document.querySelectorAll(".fg").forEach(c=>c.style.strokeDashoffset=c.dataset.off),300);
document.getElementById("sTotal").textContent=stars;document.getElementById("sDone").textContent=full;
const h=new Date().getHours(),nm=NAJMA.me?NAJMA.me.name:"أبطال";document.getElementById("hello").textContent=(h<12?"صباح الخير يا ":"مساء الخير يا ")+nm+"!";

document.getElementById("star").onclick=e=>{e.target.style.animation="none";void e.target.offsetWidth;e.target.style.animation=""};

/* ---------- profiles ---------- */
const R=NAJMA.raw;let profs=NAJMA.profiles.slice();
const AV=["🦁","🐼","🦊","🐰","🐯","🦄","🐬","🐻","🐸","🐨","🦋","🚀","⚽","🌸","👑","🦖"];
const PC=["#ff5d73","#ffb020","#22c7b8","#4f8bff","#a66bff","#3fc35a","#ff7eb6","#2b2340"];
const APPN=[["arabic","حروفي"],["numAr","الأرقام"],["islam","أركان الإسلام"],["iman","أركان الإيمان"],["sounds","Sounds"],["sight","Sight Words"],["numEn","Numbers"]];
function saveProfs(){R.set("najma:profiles",JSON.stringify(profs))}
function use(id){R.set("najma:cur",id);location.reload()}
const kids=document.getElementById("kids");
profs.filter(p=>!NAJMA.lock||p.id===NAJMA.lock).forEach(p=>{const b=document.createElement("button");b.className="kid"+(NAJMA.me&&NAJMA.me.id===p.id?" on":"");
  b.innerHTML=`<span class="av" style="background:${p.color}">${p.avatar}</span><span dir="auto">${p.name}</span>`;b.onclick=()=>{if(!(NAJMA.me&&NAJMA.me.id===p.id))use(p.id)};kids.appendChild(b)});
const add=document.createElement("button");add.className="kid add";add.innerHTML=`<span class="av">➕</span><span>إضافة</span>`;add.onclick=()=>location.href="parent.html";if(!NAJMA.lock)kids.appendChild(add);
document.getElementById("gear").onclick=()=>location.href="parent.html";if(NAJMA.lock)document.getElementById("gear").style.display="none";
const show=id=>document.getElementById(id).classList.add("show"),hide=id=>document.getElementById(id).classList.remove("show");
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{hide("gate");hide("edit")});
let gateCb,gAns;
function gate(cb){gateCb=cb;const a=3+Math.floor(Math.random()*7),b=4+Math.floor(Math.random()*6);gAns=a+b;
  document.getElementById("gQ").textContent=`${a} + ${b} = ?`;const i=document.getElementById("gA");i.value="";show("gate");setTimeout(()=>i.focus(),100)}
document.getElementById("gOk").onclick=()=>{const v=document.getElementById("gA").value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  if(+v===gAns){hide("gate");gateCb()}else{document.getElementById("gA").value="";document.getElementById("gA").placeholder="❌"}};
let ed;
function chips(id,list,isOn,onTap,cls){const box=document.getElementById(id);box.innerHTML="";if(cls)box.className="chips "+cls;
  list.forEach((it,k)=>{const b=document.createElement("button");if(typeof it==="string"&&it.startsWith("#")){b.className="sw";b.style.background=it}else b.textContent=it;
    if(isOn(it,k))b.classList.add("on");b.onclick=()=>{onTap(it,k);chips(id,list,isOn,onTap,cls)};box.appendChild(b)})}
function openEdit(p){
  ed=p?JSON.parse(JSON.stringify(p)):{id:"k"+Date.now().toString(36),name:"",avatar:AV[profs.length%AV.length],color:PC[profs.length%PC.length],
     apps:Object.assign({},NAJMA.DEF.apps),numMax:20,sightGroups:NAJMA.DEF.sightGroups.slice()};
  ed.apps=Object.assign({},NAJMA.DEF.apps,ed.apps||{});if(!ed.sightGroups)ed.sightGroups=NAJMA.DEF.sightGroups.slice();if(!ed.numMax)ed.numMax=20;
  document.getElementById("eT").textContent=p?"إعدادات "+p.name:"طفل جديد";
  document.getElementById("eName").value=ed.name;
  document.getElementById("eDel").style.display=p?"":"none";
  chips("eAv",AV,a=>a===ed.avatar,a=>ed.avatar=a,"av");
  chips("eCol",PC,c=>c===ed.color,c=>ed.color=c);
  chips("eApps",APPN.map(x=>x[1]),(x,k)=>ed.apps[APPN[k][0]]!==false,(x,k)=>{const id=APPN[k][0];ed.apps[id]=ed.apps[id]===false});
  chips("eNum",["١٠ / 10","٢٠ / 20"],(x,k)=>ed.numMax===(k?20:10),(x,k)=>ed.numMax=k?20:10);
  chips("eSight",["1","2","3","4","5","6","7","8","9"],(x,k)=>ed.sightGroups.includes(k),(x,k)=>{
    ed.sightGroups=ed.sightGroups.includes(k)?ed.sightGroups.filter(v=>v!==k):[...ed.sightGroups,k].sort((a,b)=>a-b)});
  show("edit")}
document.getElementById("eSave").onclick=()=>{ed.name=document.getElementById("eName").value.trim()||"بطل";
  const first=!profs.length;const i=profs.findIndex(p=>p.id===ed.id);if(i>=0)profs[i]=ed;else profs.push(ed);saveProfs();
  if(first){/* the first child keeps the progress already made on this iPad */
    for(let k=0;k<localStorage.length;k++){const key=localStorage.key(k);if(key&&!key.startsWith("najma:"))R.set(`najma:${ed.id}:${key}`,R.get(key))}}
  use(ed.id)};
document.getElementById("eDel").onclick=()=>{if(!NAJMA.me)return;const id=NAJMA.me.id;profs=profs.filter(p=>p.id!==id);saveProfs();
  for(let k=localStorage.length-1;k>=0;k--){const key=localStorage.key(k);if(key&&key.startsWith(`najma:${id}:`))R.remove(key)}
  if(profs.length)use(profs[0].id);else{R.remove("najma:cur");location.reload()}};
if(!profs.length)setTimeout(()=>{document.getElementById("hello").textContent="أهلاً! اضغط ➕ لإضافة طفل"},50);

/* family code needed once per device */
if(!NAJMA.hasKey()){const o=document.createElement("div");o.className="pm show";o.style.zIndex=50;
  o.innerHTML=`<div class="pc"><div style="font-size:56px">🔑</div><h3>رمز العائلة</h3><p style="margin:4px 0 12px;color:#7a7090">اطلب الرمز من ماما أو بابا</p>
   <input class="in" id="famIn" dir="ltr" placeholder="XXXX-XXXX-XXXX" autocomplete="off" style="text-align:center;text-transform:uppercase;letter-spacing:2px">
   <div class="prow"><button class="pb go" id="famOk">فتح</button></div></div>`;document.body.appendChild(o);
  document.getElementById("famOk").onclick=async()=>{const v=document.getElementById("famIn").value.trim().toUpperCase();
    if(await NAJMA.checkCode(v)){sessionStorage.removeItem("najma:reloaded");location.reload()}else{document.getElementById("famIn").value="";document.getElementById("famIn").placeholder="❌"}}}
</script>
</body>
</html>
