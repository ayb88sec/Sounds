<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;color:#2b2340;min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,#8fd3ff 0%,#d9f2ff 45%,#f6dfa8 45%,#efc77a 100%);background-attachment:fixed}
body.en{font-family:"Andika","Baloo Bhaijaan 2",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 12px 60px}
h1{color:#fff;text-align:center;font-size:clamp(38px,9.5vw,58px);margin:10px 0 0;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.sub{text-align:center;color:#fff;font-weight:800;font-size:18px;margin:0 0 12px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.dunes{position:fixed;bottom:0;left:0;right:0;height:120px;pointer-events:none;z-index:-1;background:radial-gradient(60% 100% at 20% 100%,#e2b35e 60%,transparent 61%),radial-gradient(50% 90% at 75% 100%,#d9a24b 60%,transparent 61%)}
.camel{position:fixed;bottom:58px;font-size:46px;animation:walk 38s linear infinite;pointer-events:none;z-index:-1}@keyframes walk{from{left:-60px}to{left:105%}}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile{border:0;border-radius:30px;padding:16px;min-height:150px;color:#fff;font-family:inherit;font-weight:800;font-size:26px;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.tile .e{font-size:60px;line-height:1}.tile .ic{width:120px;height:120px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.pic{width:min(78vw,320px);aspect-ratio:1;display:block;margin:6px auto 10px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2));animation:pop2 .5s}.sym .si{width:110px;height:110px;display:block;margin:0 auto 4px}.sq{width:130px;height:130px;display:block;margin:-6px auto 0;animation:pop2 .5s}.sqh{width:110px;height:110px;display:block;margin:0 auto -6px}.zface{width:120px;height:120px;border-radius:50%;object-fit:cover;border:6px solid #e0a100;display:block;margin:10px auto 0;box-shadow:0 6px 0 rgba(0,0,0,.12)}.zimg{width:min(70vw,300px);aspect-ratio:1;display:block;margin:12px auto 8px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2));animation:pop2 .5s}.tile small{font-size:15px;opacity:.92}.tile .ok{position:absolute;top:10px;inset-inline-end:14px;font-size:20px}
.tile:active{transform:translateY(6px)}
.card{background:#fff;border-radius:34px;padding:18px 14px;box-shadow:0 8px 0 rgba(0,0,0,.12);text-align:center;margin-bottom:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top button,.lang{border:0;background:#fff;color:#c8102e;border-radius:999px;padding:8px 16px;font-family:inherit;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.lang{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:15;height:52px;border-radius:18px}
.say{font-size:clamp(22px,5.6vw,28px);font-weight:800;line-height:1.5;margin:6px 0}
.say small{display:block;font-size:.7em;color:#6b6280;font-weight:700}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 24px;margin:6px;font-family:inherit;font-size:21px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.red{background:#c8102e}.green{background:#00843d}.black{background:#2b2b2b}.blue{background:#2f7bff}.gold{background:#e0a100}
/* the flag to paint */
.flagbox{position:relative;width:min(88vw,520px);margin:10px auto}
.flag{width:100%;display:block;border-radius:10px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.flag.wave{animation:wave 1.6s ease-in-out infinite;transform-origin:left center}@keyframes wave{50%{transform:skewY(-3deg) scaleX(.98)}}
.flag rect{cursor:pointer;stroke:#2b2340;stroke-width:3;stroke-dasharray:10 8}
.flag rect.done{stroke:none}
.pal{display:flex;gap:14px;justify-content:center;margin:12px 0}
.pal button{width:62px;height:62px;border-radius:50%;border:5px solid #fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pal button.on{outline:6px solid #ffd23f}
.pole{position:relative;height:300px;width:min(80vw,360px);margin:10px auto}
.pole i{position:absolute;left:30px;bottom:0;width:10px;height:100%;background:linear-gradient(90deg,#999,#eee,#999);border-radius:5px}
.pole svg{position:absolute;left:40px;width:160px;bottom:6px;transition:bottom 4s linear}
/* the map of the 7 emirates (bubbles placed roughly west to east) */
.map{position:relative;width:100%;max-width:620px;aspect-ratio:1/.85;margin:0 auto;background:radial-gradient(90% 80% at 40% 70%,#f2d38e,#e9bf6d);border-radius:40% 30% 35% 45%/45% 40% 30% 35%;box-shadow:inset 0 0 0 8px #f7e2b1,0 8px 0 rgba(0,0,0,.12)}
.sea{position:absolute;top:8px;left:8px;font-size:15px;font-weight:800;color:#2f7bff;opacity:.8}
.em{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;color:#fff;font-family:inherit;font-weight:800;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px;animation:pop .5s backwards}
.em .e{font-size:1.9em}.em.seen::after{content:"⭐";position:absolute;top:-8px;right:-4px;font-size:18px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}}
.story{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.story .pic{font-size:clamp(70px,20vw,110px);line-height:1.1;animation:pop2 .5s}
@keyframes pop2{from{transform:scale(.3);opacity:0}}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.dots i{width:12px;height:12px;border-radius:50%;background:#e5ddf3}.dots i.on{background:#c8102e}
.syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sym{border:0;border-radius:24px;background:#fff;padding:12px 8px;font-family:inherit;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.12);color:#2b2340;min-height:140px}
.sym .e{font-size:52px;display:block}.sym.open{background:#fff8e1}
.sym p{font-size:15px;color:#5a5070;margin:6px 0 0;font-weight:700}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
.opts button{border:0;border-radius:22px;padding:14px 10px;font-family:inherit;font-size:clamp(20px,5vw,24px);font-weight:800;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.opts button.wrong{animation:shake .4s;opacity:.35}.opts button.right{outline:7px solid #ffd23f}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.count{font-size:46px;font-weight:800;color:#c8102e}
.umap{width:100%;display:block;background:linear-gradient(180deg,#bfe6ff,#9fd6ff);border-radius:24px}
.umap path{stroke:#fff;stroke-width:3;cursor:pointer;transition:filter .2s,transform .3s}.umap path:active{filter:brightness(1.2)}
.umap .lbl{cursor:pointer}.umap .lbl rect{fill:#fff;stroke-width:4}/*story*/.umap .lbl text{font:800 40px "Baloo Bhaijaan 2",sans-serif;fill:#2b2340}
.umap .seen rect{fill:#fff8d6}.umap path.hit{filter:brightness(1.25) drop-shadow(0 0 10px #ffd23f)}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:20px;display:block;margin:6px 0;background:#eee}
.credit{font-size:11px;color:#9a90b0;margin-top:2px}.credit a{color:#9a90b0}
.zs{padding:16px 14px 20px}.zch{display:inline-block;color:#fff;border-radius:999px;padding:4px 16px;font-size:16px;font-weight:800}
.zpic{width:min(62vw,240px);height:min(62vw,240px);margin:14px auto 8px;border-radius:50%;border:8px solid;display:flex;align-items:center;justify-content:center;font-size:clamp(54px,15vw,84px);animation:pop2 .5s}
.zt{font-size:clamp(28px,7vw,36px);font-weight:800;margin:4px 0}.ztx{font-size:clamp(22px,5.6vw,28px);font-weight:700;line-height:1.8;margin:4px 6px 10px}
.znav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.zb{border:0;border-radius:22px;background:#f3f0fa;padding:8px 14px;font-family:inherit;font-size:30px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:86px;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.zb small{font-size:15px;font-weight:800;color:#5a5070}.zb.nx{background:#3fc35a}.zb.nx small{color:#fff}.zb.lis{background:#fff3c4}.zb:disabled{opacity:.3}
.ruler{display:flex;align-items:center;gap:12px;border:5px solid;text-align:start;padding:12px}.ruler.pres{border-width:7px;background:#fffdf3}
.rpic{flex:none;width:86px;height:86px;border-radius:50%;border:5px solid;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;cursor:pointer}.rpic img{width:100%;height:100%;object-fit:cover}
.pres .rpic{width:104px;height:104px}.rn{font-size:20px;font-weight:800;line-height:1.5}.rr{font-size:16px;font-weight:800}.re{font-size:14px;color:#7a7090;font-weight:700}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>

 ["ما الطائر الوطني؟","What is the national bird?",["الصقر","البطريق","الببغاء"],["The falcon","The penguin","The parrot"]],
 ["أصغر إمارة هي…","The smallest emirate is…",["عجمان","أبوظبي","دبي"],["Ajman","Abu Dhabi","Dubai"]],
 ["أعلى جبل في الإمارات…","The highest mountain in the UAE is…",["جبل جيس","جبل إفرست","جبل أحد"],["Jebel Jais","Mount Everest","Mount Uhud"]],
 ["ماذا زرع الشيخ زايد؟","What did Sheikh Zayed plant?",["الأشجار","السيارات","الجبال"],["Trees","Cars","Mountains"]],
 ["ما اسم عملة الإمارات؟","What is the UAE's money called?",["الدرهم","الدولار","اليورو"],["The dirham","The dollar","The euro"]],
 ["أين مسجد البدية، أقدم مسجد؟","Where is Al Bidya, the oldest mosque?",["الفجيرة","أبوظبي","عجمان"],["Fujairah","Abu Dhabi","Ajman"]],
 ["ما اسم المسبار الذي وصل المريخ؟","What is the probe that reached Mars?",["مسبار الأمل","برج العرب","القمر"],["The Hope Probe","Burj Al Arab","The Moon"]]];
/* ---------- helpers ---------- */
let voice=null;function pv(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}if("speechSynthesis" in window){pv();speechSynthesis.onvoiceschanged=pv}
const VM=NAJMA.vmode("uae","ai");
function speak(s){s=String(s).replace(/<[^>]+>/g," ").replace(/[\u{1F000}-\u{1FAFF}☀-➿️⃣]/gu," ");if(VM==="none")return;if(!EN){NAJMA.aiSay(s,"ar",.85);return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
let ac;function tone(f,d,w=0,ty="triangle",v=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,ac.currentTime+w);g.gain.setValueAtTime(v,ac.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+w+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d+.02)}catch(e){}}
const yay=()=>{tone(660,.12);tone(990,.15,.08)},fan=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,i*.12)),buzz=()=>tone(160,.25,0,"sawtooth",.08),pop=()=>{tone(520,.1);tone(880,.12,.06)},
  drum=()=>{for(let i=0;i<8;i++)tone(i%2?180:120,.12,i*.25,"square",.06)};
const COL=["#c8102e","#00843d","#ffffff","#2b2b2b","#ffd23f"];
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],run=false;function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}size();addEventListener("resize",size);
function burst(x,y,n=40){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=3+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:4+Math.random()*7,c:COL[i%5],rot:0,vr:(Math.random()-.5)*.4,life:100})}if(!run){run=true;requestAnimationFrame(loop)}}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life-->0);for(const p of parts){p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.strokeStyle="#ccc";cx.globalAlpha=Math.min(1,p.life/30);cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}if(parts.length)requestAnimationFrame(loop);else run=false}
const at=el=>{const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,30)},rain=()=>{for(let j=0;j<8;j++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight/4),j*140)};
let done={};try{done=JSON.parse(localStorage.getItem("uaeDone")||"{}")}catch(e){}
const mark=k=>{if(done[k])return;done[k]=1;try{localStorage.setItem("uaeDone",JSON.stringify(done))}catch(e){}};
const rnd=n=>Math.floor(Math.random()*n),shuf=a=>[...a].sort(()=>Math.random()-.5);
const head=()=>`<div class="top"><button id="back">${t("⬅ رجوع","⬅ Back")}</button></div>`;
const backTo=f=>{$("back").onclick=f};
function setLang(){document.documentElement.lang=EN?"en":"ar";document.documentElement.dir=EN?"ltr":"rtl";document.body.classList.toggle("en",EN);
  $("ttl").textContent=t("🇦🇪 بلادي الإمارات","🇦🇪 My UAE");$("sub").textContent=t("تعرّف على بلادك الجميلة","Discover our beautiful country")}

/* next special day, counted from today */
function nextDay(){const now=new Date();now.setHours(0,0,0,0);return DAYS.map(d=>{let dt=new Date(now.getFullYear(),d[3]-1,d[4]);if(dt<now)dt=new Date(now.getFullYear()+1,d[3]-1,d[4]);return [d,Math.round((dt-now)/864e5)]}).sort((a,b)=>a[1]-b[1])[0]}

/* ---------- hub ---------- */
function hub(){window.scrollTo(0,0);
  const T=[["flag","🇦🇪",t("العلم","The flag"),t("لوّن وارفع العلم","Paint and raise the flag"),"#c8102e",done.flag],
   ["map","🗺️",t("الإمارات السبع","The 7 Emirates"),t("اكتشف كل إمارة","Explore each emirate"),"#00843d",EMS.every((_,i)=>done["em"+i])],
   ["zayed","🌴","بابا زايد","قصة مؤسس الإمارات","#e0a100",done.zayed],
   ["syms","🦅",t("رموزنا","Our symbols"),t("الصقر والغاف والمزيد","Falcon, Ghaf and more"),"#2f7bff",done.syms],
   ["rulers","👑","حُكّامُنا","الرئيس وحكّام الإمارات","#a66bff",done.rulers],
   ["quiz","🏆",t("مسابقة","Quiz"),t("كم تعرف عن بلادك؟","How much do you know?"),"#2b2b2b",done.q1]];
  $("app").innerHTML=`<img class="sqh" src="${IMG("saqoor_wave")}" alt=""><div class="hub">${T.map(x=>`<button class="tile" data-k="${x[0]}" style="background:${x[4]}"><span class="ok">${x[5]?"⭐":""}</span><img class="ic" src="${IMG("icon_"+x[0])}" alt="">${x[2]}<small>${x[3]}</small></button>`).join("")}</div>`;
  document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{pop();({flag,map,zayed,syms,rulers,quiz})[b.dataset.k]()})}

/* ---------- 1. paint the flag, then raise it ---------- */
function flag(){const C={red:"#c8102e",green:"#00843d",white:"#ffffff",black:"#2b2b2b"},want={r:"red",g:"green",w:"white",b:"black"};let brush="red";const got={};
  $("app").innerHTML=head()+`<div class="card"><div class="say" id="fs">${t("لوّن العلم! اختر لونًا ثم اضغط على مكانه","Paint the flag! Pick a colour, then tap where it goes")}</div>
    <div class="pal" id="pal">${Object.keys(C).map(k=>`<button data-c="${k}" style="background:${C[k]}"></button>`).join("")}</div>
    <div class="flagbox"><svg class="flag" id="fl" viewBox="0 0 400 200"><rect id="p_r" x="2" y="2" width="96" height="196" fill="#fafafa"/><rect id="p_g" x="100" y="2" width="298" height="64" fill="#fafafa"/><rect id="p_w" x="100" y="68" width="298" height="64" fill="#fafafa"/><rect id="p_b" x="100" y="134" width="298" height="64" fill="#fafafa"/></svg></div>
    <div id="fx2"></div></div>`;
  backTo(hub);speak($("fs").textContent);
  const pal=()=>document.querySelectorAll("#pal button").forEach(b=>b.classList.toggle("on",b.dataset.c===brush));pal();
  document.querySelectorAll("#pal button").forEach(b=>b.onclick=()=>{brush=b.dataset.c;pop();pal();speak({red:t("أحمر","red"),green:t("أخضر","green"),white:t("أبيض","white"),black:t("أسود","black")}[brush])});
  ["r","g","w","b"].forEach(p=>$("p_"+p).onclick=e=>{if(got[p])return;if(brush===want[p]){got[p]=1;e.target.setAttribute("fill",C[brush]);e.target.classList.add("done");yay();at(e.target);
      if(Object.keys(got).length===4){mark("flag");fan();rain();$("fl").classList.add("wave");$("fs").innerHTML=t("أحسنت! هذا علم الإمارات 🇦🇪<small>أحمر، أخضر، أبيض، أسود</small>","Well done! This is the UAE flag 🇦🇪<small>red, green, white and black</small>");speak($("fs").textContent);
        $("fx2").innerHTML=`<button class="btn red" id="raise">🚩 ${t("ارفع العلم","Raise the flag")}</button>`;$("raise").onclick=raise}}
    else{buzz();e.target.animate([{opacity:1},{opacity:.4},{opacity:1}],{duration:400})}})}
function raise(){$("app").innerHTML=head()+`<div class="card"><div class="say" id="rs">${t("اضغط لرفع العلم عاليًا! 🇦🇪","Tap to raise the flag up high! 🇦🇪")}</div>
  <div class="pole" id="pole"><i></i><svg class="flag wave" id="rf" viewBox="0 0 400 200" style="bottom:6px"><rect x="0" y="0" width="100" height="200" fill="#c8102e"/><rect x="100" y="0" width="300" height="67" fill="#00843d"/><rect x="100" y="67" width="300" height="66" fill="#fff"/><rect x="100" y="133" width="300" height="67" fill="#2b2b2b"/></svg></div>
  <button class="btn green" id="up">⬆️ ${t("ارفع","Raise it")}</button><div class="say"><small>${t("يوم العلم ٣ نوفمبر: نرفع العلم معًا كل سنة","Flag Day is 3 November: we raise the flag together every year")}</small></div></div>`;
  backTo(flag);$("up").onclick=()=>{$("up").remove();drum();$("rf").style.bottom="214px";setTimeout(()=>{fan();rain();$("rs").textContent=t("عاش العلم! عاشت الإمارات! 🇦🇪","Hooray for our flag! Hooray for the UAE! 🇦🇪");speak($("rs").textContent)},4000)}}

/* ---------- 2. the real map of the 7 emirates ---------- */
/* label boxes sit in the sea with a line to their emirate, so even the small ones are easy to tap */
const LBL={ad:[300,640],du:[470,200],sh:[620,120],aj:[400,90],uq:[560,40],rk:[780,-20],fu:[900,400]};
function mapSVG(){const M=window.UAEMAP;if(!M)return "";let p="",l="";
  EMS.forEach((m,i)=>{const e=M.e[m.k];if(!e)return;p+=`<path data-i="${i}" d="${e.d}" fill="${m.c}"/>`;
    const [lx,ly]=LBL[m.k],[cx,cy]=e.c,w=t(m.ar,m.en).length*24+90;
    l+=`<g class="lbl${done["em"+i]?" seen":""}" data-i="${i}"><line x1="${cx}" y1="${cy}" x2="${lx}" y2="${ly+32}" stroke="${m.c}" stroke-width="4" stroke-dasharray="8 6"/><circle cx="${cx}" cy="${cy}" r="9" fill="#fff" stroke="${m.c}" stroke-width="5"/>
      <rect x="${lx-w/2}" y="${ly}" rx="30" width="${w}" height="64" stroke="${m.c}"/><text x="${lx}" y="${ly+46}" text-anchor="middle">${m.e} ${t(m.ar,m.en)}</text></g>`});
  if(M.e.nz)p+=`<path d="${M.e.nz.d}" fill="#ccc" style="pointer-events:none"/>`;
  return `<svg class="umap" viewBox="-40 -40 ${M.w+140} ${M.h+60}"><text x="60" y="300" style="direction:ltr;unicode-bidi:plaintext" font-size="34" font-weight="800" fill="#2f7bff" opacity=".7" font-family="Baloo Bhaijaan 2,sans-serif">🌊 ${t("الخليج العربي","Arabian Gulf")}</text>${p}${l}</svg>`}
function map(){$("app").innerHTML=head()+`<div class="card"><img class="sq" src="${IMG("saqoor_point")}" alt=""><div class="say" id="ms">${t("خريطة الإمارات! اضغط على كل إمارة 🗺️","Map of the UAE! Tap each emirate 🗺️")}</div>
  <div id="mp">${mapSVG()}</div><button class="btn green" id="mg">🎮 ${t("وين هذا؟","Where is it?")}</button></div><div id="info"></div>`;
  backTo(hub);speak($("ms").textContent);
  $("mp").querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{const i=+el.dataset.i;pop();mark("em"+i);const g=$("mp").querySelector(`.lbl[data-i="${i}"]`);if(g)g.classList.add("seen");flash(i);showEm(i)});
  $("mg").onclick=mapGame}
function flash(i){const p=$("mp").querySelector(`path[data-i="${i}"]`);if(!p)return;p.classList.add("hit");setTimeout(()=>p.classList.remove("hit"),900);const r=p.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,24)}
const IMG=n=>"img/uae/"+n+".webp";
/* faces of Sheikh Zayed and the rulers: encrypted with the family code, plus any photo the parent adds in the portal (that one wins) */
let PPL=null;function people(){if(PPL)return PPL;PPL=(async()=>{const out={};try{const r=await fetch("img/uae/people.enc");if(r.ok)Object.assign(out,await NAJMA.decrypt(await r.json()))}catch(e){}
  try{const Q=(NAJMA.sections||[]).find(x=>x.type==="qimg")||{},IM=Q.uaeimg||{};await Promise.all(Object.keys(IM).map(k=>NAJMA.decrypt(IM[k]).then(u=>{out[k]=u}).catch(()=>{})))}catch(e){}return out})();return PPL}
const SYMI=["falcon","ghaf","camel","palm","dirham","arabic","kandura","luqaimat","probe","astro"];
function photo(k){const P=(window.UAEPICS||{})[k];if(!P)return"";return `<img class="photo" src="${P.src}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='none'"><div class="credit">📷 ${P.by} · <a href="${P.page}" target="_blank" rel="noopener">Wikimedia Commons</a></div>`}
function showEm(i){const m=EMS[i];$("info").innerHTML=`<div class="card" style="border:6px solid ${m.c}"><img class="pic" src="${IMG("em_"+m.k)}" alt=""><div class="say">${m.e} ${t(m.ar,m.en)}</div>${m.f.map(f=>`<div class="say"><small>${t(f[0],f[1])}</small></div>`).join("")}</div>`;
  $("info").scrollIntoView({behavior:"smooth",block:"nearest"});speak(t(m.ar,m.en)+". "+m.f.map(f=>t(f[0],f[1])).join(". "))}
function mapGame(){const order=shuf([0,1,2,3,4,5,6]);let k=0,score=0;$("info").innerHTML="";
  const ask=()=>{if(k>=order.length){fan();rain();mark("mapgame");$("ms").textContent=t(`أحسنت! ${score} من ٧ ⭐`,`Brilliant! ${score} out of 7 ⭐`);speak($("ms").textContent);
      $("mp").querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{const i=+el.dataset.i;pop();flash(i);showEm(i)});return}
    const m=EMS[order[k]];$("ms").innerHTML=t(`وين <b>${m.f[0][0].replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu,"")}</b>؟`,`Where is <b>${m.f[0][1].replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu,"")}</b>?`);speak($("ms").textContent);let first=true;
    $("mp").querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(i===order[k]){yay();flash(i);speak(t(m.ar,m.en));if(first)score++;k++;setTimeout(ask,1300)}else{first=false;buzz()}})};
  ask()}

/* ---------- 3. Baba Zayed: a story in chapters ---------- */
const ZC=["#e0a100","#00843d","#c8102e","#2f7bff","#3fc35a","#a66bff","#ff6f91","#c8102e"];
function zayed(){let p=0,face="";people().then(P=>{if(P.zayed){face=P.zayed;const z=$("zf");if(z){z.src=face;z.style.display="block"}}});
  const draw=()=>{const [pic,title,txt]=ZAYED[p];window.scrollTo(0,0);
    $("app").innerHTML=head()+`<div class="card zs"><div class="zch" style="background:${ZC[p]}">${"الفصل "+"١٢٣٤٥٦٧٨"[p]+" من ٨"}</div>
      <img class="zface" id="zf" src="${face}" alt="" style="display:${face?"block":"none"}"><img class="zimg" src="${IMG("zayed_"+(p+1))}" alt=""><div class="zt" style="color:${ZC[p]}">${title}</div><div class="ztx">${txt}</div>
      <div class="dots">${ZAYED.map((_,i)=>`<i class="${i<=p?"on":""}"></i>`).join("")}</div>
      <div class="znav"><button class="zb" id="pv" ${p?"":"disabled"}>➡️<small>السابق</small></button><button class="zb lis" id="rd">🔊<small>اسمع</small></button><button class="zb nx" id="nx">${p<ZAYED.length-1?"⬅️<small>التالي</small>":"🎉<small>النهاية</small>"}</button></div></div>`;
    backTo(hub);speak(title+". "+txt);$("rd").onclick=()=>speak(title+". "+txt);
    $("pv").onclick=()=>{if(p){p--;pop();draw()}};$("nx").onclick=()=>{if(p<ZAYED.length-1){p++;pop();draw()}else{mark("zayed");fan();rain();setTimeout(hub,1800)}}};draw()}

/* ---------- 5. our leaders ---------- */
function rulers(){const Q=(NAJMA.sections||[]).find(x=>x.type==="qimg")||{},IM=Q.uaeimg||{};mark("rulers");
  $("app").innerHTML=head()+`<div class="card"><div class="say">👑 حُكّامُنا<small>رئيس الدولة وحكّام الإمارات السبع</small></div></div><div id="rl"></div>`;backTo(hub);
  RULERS.forEach(([k,name,role,c,pres])=>{const em=EMS.find(m=>m.k===k),d=document.createElement("div");d.className="card ruler"+(pres?" pres":"");d.style.borderColor=c;
    d.innerHTML=`<div class="rpic" id="rp_${k}" style="border-color:${c};background:${c}18">${pres?"🇦🇪":"👑"}</div><div style="flex:1;text-align:start"><div class="rn">${name}</div><div class="rr" style="color:${c}">${role}</div><div class="re">${em?em.e+" "+em.ar:""}</div></div><button class="zb lis" style="flex:none;min-width:0;font-size:24px;padding:8px 10px">🔊</button>`;
    d.querySelector("button").onclick=()=>speak(name+"، "+role);d.querySelector(".rpic").onclick=()=>speak(name+"، "+role);$("rl").appendChild(d);
    people().then(P=>{if(P[k]){const el=$("rp_"+k);if(el)el.innerHTML=`<img src="${P[k]}" alt="">`}})});
  speak("حُكّامُنا")}

/* ---------- 4. our symbols: flip cards ---------- */
function syms(){const seen=new Set();$("app").innerHTML=head()+`<div class="card"><div class="say">${t("رموز بلادنا: اضغط على كل بطاقة","Our country's symbols: tap each card")}</div></div><div class="syms" id="sy"></div>`;
  backTo(hub);SYMS.forEach((s,i)=>{const b=document.createElement("button");b.className="sym";b.innerHTML=`<img class="si" src="${IMG("sym_"+SYMI[i])}" alt="">${t(s[1],s[2])}`;
    b.onclick=()=>{pop();at(b);b.classList.add("open");b.innerHTML=`<img class="si" src="${IMG("sym_"+SYMI[i])}" alt="">`+`${t(s[1],s[2])}<p>${t(s[3],s[4])}</p>`;speak(t(s[1],s[2])+". "+t(s[3],s[4]));seen.add(i);if(seen.size===SYMS.length){mark("syms");setTimeout(()=>{fan();rain()},800)}};$("sy").appendChild(b)})}

/* ---------- 6. quiz ---------- */
function quiz(){const Q=shuf(QUIZ).slice(0,8);let k=0,score=0;
  const ask=()=>{if(k>=Q.length){const st=score>=7?3:score>=5?2:1;const n=["q1","q2","q3"].filter(x=>done[x]).length;if(n<3)mark("q"+(n+1));fan();rain();
      $("app").innerHTML=head()+`<div class="card"><img class="sq" src="${IMG("saqoor_cheer")}" alt=""><div class="say">${t("أحسنت يا بطل!","Well done, champion!")}<small>${score} / ${Q.length}</small></div><div style="font-size:44px">${"⭐".repeat(st)}</div><button class="btn red" id="ag">🔁 ${t("مرة ثانية","Again")}</button></div>`;backTo(hub);$("ag").onclick=quiz;return}
    const q=Q[k],O=shuf([0,1,2]);
    $("app").innerHTML=head()+`<div class="card"><img class="sq" id="qm" src="${IMG("saqoor_think")}" alt=""><div class="dots">${Q.map((_,i)=>`<i class="${i<k?"on":""}"></i>`).join("")}</div><div class="say">${t(q[0],q[1])}</div><div class="opts">${O.map((o,j)=>`<button style="background:${["#c8102e","#00843d","#2b2b2b"][j]}" data-v="${o}">${(EN?q[3]:q[2])[o]}</button>`).join("")}</div></div>`;
    backTo(hub);speak(t(q[0],q[1]));let first=true;
    document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{if(b.dataset.v==="0"){b.classList.add("right");$("qm").src=IMG("saqoor_cheer");yay();at(b);speak(b.textContent);if(first)score++;k++;setTimeout(ask,1300)}else{first=false;b.classList.add("wrong");buzz()}})};
  ask()}

setLang();const V=new URLSearchParams(location.search).get("v");({flag,map,zayed,syms,rulers,quiz})[V]?({flag,map,zayed,syms,rulers,quiz})[V]():hub();
</script>
