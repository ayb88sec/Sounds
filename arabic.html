<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>حروفي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
:root{--ink:#2b2340;--c1:#ff5d73;--c2:#ffb020;--c3:#22c7b8;--c4:#4f8bff;--c5:#a66bff;--c6:#3fc35a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(160deg,#0fb5a6,#2f8cff 45%,#8a5cff);background-attachment:fixed}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-80px;border-radius:50%;background:rgba(255,255,255,.18);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) translateX(-30px)}}
main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:18px 14px 50px}
h1{font-weight:800;font-size:clamp(48px,12vw,78px);margin:0;line-height:1.1;color:#fff;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.18);
  animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mascotWrap{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:8px 0 4px}
#pip{width:92px;height:92px;cursor:pointer;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15));flex:none}
#pip.jump{animation:jump .7s ease}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes jump{0%{transform:none}30%{transform:translateY(-34px) scale(1.1) rotate(12deg)}60%{transform:translateY(0) scale(.95,1.05)}100%{transform:none}}
.bubble{position:relative;background:#fff;border-radius:22px;padding:10px 18px;font-weight:700;font-size:21px;max-width:260px;
  box-shadow:0 5px 0 rgba(0,0,0,.12);margin-bottom:34px}
.bubble::after{content:"";position:absolute;right:-12px;bottom:16px;border:10px solid transparent;border-left:14px solid #fff;border-right:0}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.progress{background:rgba(255,255,255,.25);border-radius:999px;height:34px;position:relative;margin:14px 6px 6px;box-shadow:inset 0 3px 0 rgba(0,0,0,.1)}
.fill{position:absolute;right:0;top:0;height:100%;border-radius:999px;background:linear-gradient(270deg,#ffe066,#ffb020,#ff5d73);width:0;transition:width .8s cubic-bezier(.3,1.6,.5,1)}
.rocket{position:absolute;top:50%;font-size:34px;transform:translate(50%,-55%) rotate(-135deg) scaleY(-1);transition:right .8s cubic-bezier(.3,1.6,.5,1);right:0}
.goal{position:absolute;left:-4px;top:50%;transform:translateY(-55%);font-size:30px}
.count{color:#fff;text-align:center;font-weight:700;font-size:20px;margin-top:6px}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.btn{font-family:inherit;font-size:21px;font-weight:800;border:0;border-radius:999px;padding:10px 22px;cursor:pointer;
  color:var(--ink);background:#ffe066;box-shadow:0 6px 0 #d9a400;transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #d9a400}
.btn.pink{background:#ff8fb8;box-shadow:0 6px 0 #d45b88;color:#fff}
.btn.ghost{background:#fff;box-shadow:0 6px 0 #c8d6ff;font-size:18px}
.note{background:#fff3c4;border-radius:16px;padding:10px 14px;margin:12px 6px 0;font-size:17px;display:none;text-align:center}
section{background:rgba(255,255,255,.93);border-radius:30px;padding:16px 14px 20px;margin-top:22px;box-shadow:0 10px 0 rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;border-radius:26px;border:0;
  color:#fff;font-family:inherit;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.2);transition:transform .12s,box-shadow .12s;animation:enter .5s backwards}
.tile b{font-size:58px;line-height:1;font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.15);margin-top:6px}
.tile small{font-size:15px;opacity:.95;margin-top:2px}
.tile:hover{transform:translateY(-4px) rotate(3deg) scale(1.04)}
.tile:active{transform:translateY(5px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tile.done::after{content:"⭐";position:absolute;top:4px;left:6px;font-size:20px;animation:spinIn .5s}
.tile.glow{animation:glow 1.2s ease}
.tile.spot{transform:scale(1.15) rotate(-4deg);box-shadow:0 0 0 6px #fff,0 0 0 11px #ffe066;z-index:2}
@keyframes enter{from{transform:scale(0) rotate(20deg);opacity:0}}
@keyframes spinIn{from{transform:scale(0) rotate(180deg)}}
@keyframes glow{0%,100%{filter:none}50%{filter:brightness(1.25);transform:scale(1.08) rotate(-3deg)}}
.modal{position:fixed;inset:0;background:rgba(15,25,70,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.modal.show{display:flex}
.card{background:#fff;border-radius:34px;padding:20px 18px 20px;text-align:center;max-width:390px;width:100%;max-height:96vh;overflow:auto;
  animation:zoom .45s cubic-bezier(.3,1.6,.5,1);position:relative}
@keyframes zoom{from{transform:scale(.3) rotate(10deg);opacity:0}}
.x{position:absolute;top:10px;left:12px;border:0;background:#f0edf7;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.big{font-size:120px;font-weight:700;line-height:1.25;border-radius:28px;color:#fff;padding:0 0 6px;margin:22px 0 6px;cursor:pointer}
.name{font-size:30px;font-weight:800;margin:4px 0 10px;display:flex;align-items:center;justify-content:center;gap:8px}
.say{border:0;background:#eef4ff;border-radius:50%;width:46px;height:46px;font-size:22px;cursor:pointer;box-shadow:0 4px 0 #c8d6ff}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 #c8d6ff}
.lbl{font-size:16px;color:#7a7090;margin:12px 0 6px}
.harakat{display:flex;gap:10px;justify-content:center}
.harakat button{font-family:inherit;font-size:44px;font-weight:700;border:0;border-radius:20px;width:84px;height:84px;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.harakat button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.forms{display:flex;gap:8px;justify-content:center}
.forms div{background:#f6f3fc;border-radius:16px;padding:4px 12px 8px;min-width:80px}
.forms b{display:block;font-size:42px;line-height:1.3}
.forms span{font-size:14px;color:#7a7090}
.word{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff6d6;border-radius:22px;padding:8px 14px;margin-top:6px;cursor:pointer}
.word .emo{font-size:52px}
.word .w{font-size:40px;font-weight:700}
.word .w em{font-style:normal;color:var(--c1)}
.q{font-size:28px;font-weight:800;margin:26px 0 6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.opts button{font-family:inherit;font-size:70px;font-weight:700;border:0;border-radius:24px;aspect-ratio:1.2;cursor:pointer;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.opts button.wrong{animation:shake .4s;opacity:.35}
.opts button.right{box-shadow:0 0 0 6px #ffe066,0 6px 0 rgba(0,0,0,.18);transform:scale(1.06)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.score{font-size:20px;font-weight:700;color:#7a7090}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
footer{text-align:center;color:#fff;opacity:.95;font-size:15px;margin-top:26px}
footer a,#reset{color:#fff;background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<canvas id="fx"></canvas>
<main>
  <h1>حروفي</h1>
  <div class="mascotWrap">
    <svg id="pip" viewBox="0 0 100 100" aria-label="نجمة">
      <path d="M50 6 L62 36 L94 38 L69 58 L77 90 L50 72 L23 90 L31 58 L6 38 L38 36 Z" fill="#ffe066" stroke="#e0a800" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="41" cy="48" r="5" fill="#2b2340"/><circle cx="59" cy="48" r="5" fill="#2b2340"/>
      <circle cx="43" cy="46" r="1.8" fill="#fff"/><circle cx="61" cy="46" r="1.8" fill="#fff"/>
      <circle cx="34" cy="58" r="4" fill="#ff8fab" opacity=".7"/><circle cx="66" cy="58" r="4" fill="#ff8fab" opacity=".7"/>
      <path d="M42 59 Q50 67 58 59" fill="none" stroke="#2b2340" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <div class="bubble" id="say">أنا نجمة! اضغط على حرف وقُله معي ⭐</div>
  </div>

  <div class="progress"><div class="fill" id="fill"></div><div class="rocket" id="rocket">🚀</div><div class="goal">🌙</div></div>
  <div class="count" id="count"></div>

  <div class="bar">
    <button class="btn" id="surprise">🎲 حرف مفاجأة</button>
    <button class="btn pink" id="game">🎧 اسمع واختر</button>
    <button class="btn ghost" id="mute">🔊 الصوت</button>
  </div>
  <div class="note" id="note"></div>

  <section><div class="grid" id="grid"></div></section>

  <footer><a href="index.html">English sounds 🔤</a> · <button id="reset">ابدأ من جديد</button></footer>
</main>

<div class="modal" id="letterModal">
  <div class="card">
    <button class="x" data-close>✕</button>
    <div class="big" id="lBig"></div>
    <div class="name"><span id="lName"></span><button class="say" id="lSay">🔊</button></div>
    <div class="lbl">اضغط واسمع الحركات</div>
    <div class="harakat" id="lHar"></div>
    <div class="lbl">أشكال الحرف</div>
    <div class="forms" id="lForms"></div>
    <div class="lbl">كلمة تبدأ بالحرف</div>
    <div class="word" id="lWord"></div>
  </div>
</div>

<div class="modal" id="gameModal">
  <div class="card">
    <button class="x" data-close>✕</button>
    <div class="q" id="gQ">أين حرف…؟</div>
    <button class="btn ghost" id="gAgain">🔊 اسمع مرة ثانية</button>
    <div class="opts" id="gOpts"></div>
    <div class="score" id="gScore"></div>
  </div>
</div>

<script>
const L=[
 ["ا","ألف","أرنب","🐰","أ"],["ب","باء","بطة","🦆"],["ت","تاء","تفاحة","🍎"],["ث","ثاء","ثعلب","🦊"],
 ["ج","جيم","جمل","🐫"],["ح","حاء","حصان","🐴"],["خ","خاء","خروف","🐑"],["د","دال","دب","🐻"],
 ["ذ","ذال","ذرة","🌽"],["ر","راء","ريشة","🪶"],["ز","زاي","زرافة","🦒"],["س","سين","سمكة","🐟"],
 ["ش","شين","شمس","☀️"],["ص","صاد","صقر","🦅"],["ض","ضاد","ضفدع","🐸"],["ط","طاء","طائرة","✈️"],
 ["ظ","ظاء","ظرف","✉️"],["ع","عين","عنب","🍇"],["غ","غين","غيمة","☁️"],["ف","فاء","فيل","🐘"],
 ["ق","قاف","قمر","🌙"],["ك","كاف","كتاب","📖"],["ل","لام","ليمون","🍋"],["م","ميم","موز","🍌"],
 ["ن","نون","نحلة","🐝"],["ه","هاء","هدية","🎁"],["و","واو","وردة","🌹"],["ي","ياء","يد","✋"]
];
const NOJOIN="ادذرزو";
const COLORS=["#ff5d73","#ffb020","#22c7b8","#4f8bff","#a66bff","#3fc35a"];
const praise=["أحسنت!","رائع!","ممتاز!","شاطر!","برافو!","يا سلام!","نجم!","عمل جميل!"];
const col=i=>COLORS[i%6];

let done={},muted=false;
try{done=JSON.parse(localStorage.getItem("arDone")||"{}")}catch(e){}
try{muted=localStorage.getItem("arMuted")==="1"}catch(e){}
const save=()=>{try{localStorage.setItem("arDone",JSON.stringify(done))}catch(e){}};

/* bubbles */
const bb=document.getElementById("bubbles");
for(let i=0;i<16;i++){const s=document.createElement("span"),z=20+Math.random()*70;
  s.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${10+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;bb.appendChild(s);}

/* speech */
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();
  voice=v.find(x=>/^ar[-_]AE/i.test(x.lang))||v.find(x=>/^ar[-_]SA/i.test(x.lang))||v.find(x=>/^ar/i.test(x.lang))||null;
  const n=document.getElementById("note");
  if(v.length&&!voice){n.style.display="block";n.textContent="لا يوجد صوت عربي على هذا الجهاز. On iPad: Settings › Accessibility › Spoken Content › Voices › Arabic.";}
  else n.style.display="none";}
const hasTTS="speechSynthesis" in window;
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t,rate=.75){
  if(muted||!hasTTS)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:"ar-SA";if(voice)u.voice=voice;u.rate=rate;speechSynthesis.speak(u);}catch(e){}
}

/* sfx */
let ac;
function tone(f,d,type="sine",w=0,vol=.16){if(muted)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,ac.currentTime+w);g.gain.setValueAtTime(vol,ac.currentTime+w);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+w+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d+.02)}catch(e){}}
const popSnd=()=>{tone(520,.12,"triangle");tone(880,.14,"triangle",.07)};
const tick=()=>tone(700+Math.random()*300,.05,"square",0,.05);
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",i*.12,.15));
const buzz=()=>tone(160,.25,"sawtooth",0,.08);

/* confetti */
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],running=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
size();addEventListener("resize",size);
function burst(x,y,n=40,sp=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(3+Math.random()*7)*sp;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:4+Math.random()*6,c:COLORS[i%6],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:90+Math.random()*40,star:Math.random()<.3})}
  if(!running){running=true;requestAnimationFrame(loop)}}
function rain(){for(let i=0;i<140;i++)setTimeout(()=>burst(Math.random()*innerWidth,-10,1,.6),i*12)}
function starPath(r){cx.beginPath();for(let i=0;i<10;i++){const rr=i%2?r/2:r,a=i*Math.PI/5-Math.PI/2;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}cx.closePath()}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+40);
  for(const p of parts){p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
    cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/30);if(p.star){starPath(p.r);cx.fill()}else cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}
  if(parts.length)requestAnimationFrame(loop);else{running=false;cx.clearRect(0,0,innerWidth,innerHeight)}}
const burstAt=el=>{const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,36)};

/* mascot */
const pip=document.getElementById("pip"),say=document.getElementById("say");let sayT;
function talk(t){say.textContent=t;say.classList.remove("pop");void say.offsetWidth;say.classList.add("pop");
  pip.classList.remove("jump");void pip.offsetWidth;pip.classList.add("jump");
  clearTimeout(sayT);sayT=setTimeout(()=>say.textContent="اضغط على حرف وقُله معي ⭐",6000)}
pip.addEventListener("click",()=>{popSnd();const t=["هههه، دغدغتني!","أحب الحروف!","يلا نلعب!","اختر حرفاً لي!"][Math.floor(Math.random()*4)];talk(t);speak(t,.9);burstAt(pip)});

/* grid */
const grid=document.getElementById("grid");
L.forEach(([ch,name],i)=>{const b=document.createElement("button");b.className="tile";b.dataset.i=i;
  b.style.background=col(i);b.style.animationDelay=(i*.03)+"s";b.innerHTML=`<b>${ch}</b><small>${name}</small>`;
  if(done[ch])b.classList.add("done");b.addEventListener("click",()=>openLetter(i,b));grid.appendChild(b)});

function update(){const n=L.filter(([c])=>done[c]).length,pct=n/L.length*100;
  document.getElementById("fill").style.width=pct+"%";
  document.getElementById("rocket").style.right=Math.max(4,Math.min(pct,94))+"%";
  document.getElementById("count").textContent=n===L.length?`🏆 كل الحروف الـ ${n}! وصلت إلى القمر!`:`⭐ ${n} من ${L.length} حرفاً، طِر بالصاروخ إلى القمر!`;
  return n}
update();

function markDone(ch){const first=!done[ch];done[ch]=1;save();
  document.querySelector(`.tile[data-i="${L.findIndex(x=>x[0]===ch)}"]`).classList.add("done");
  const n=update();
  if(first&&[5,10,20,L.length].includes(n))setTimeout(()=>{fanfare();rain();talk(n===L.length?"تعلمت كل الحروف! 🏆🎉":`واو! ${n} حروف! 🎉`)},400)}

/* letter card */
const lm=document.getElementById("letterModal");
function openLetter(i,el){
  const [ch,name,word,emo,base]=L[i],c=col(i),h=base||ch;popSnd();if(el)burstAt(el);
  const big=document.getElementById("lBig");big.textContent=ch;big.style.background=c;big.onclick=()=>{speak(name);big.classList.remove("pop");void big.offsetWidth;big.classList.add("pop")};
  document.getElementById("lName").textContent=name;
  document.getElementById("lSay").onclick=()=>speak(name);
  const har=document.getElementById("lHar");har.innerHTML="";
  [["َ","فتحة"],["ِ","كسرة"],["ُ","ضمة"]].forEach(([m,t],k)=>{const b=document.createElement("button");b.textContent=h+m;b.title=t;
    b.style.background=COLORS[(i+k+1)%6];b.onclick=()=>{speak(h+m,.6);popSnd()};har.appendChild(b)});
  const j=!NOJOIN.includes(ch);
  document.getElementById("lForms").innerHTML=[["أول",j?ch+"ـ":ch],["وسط","ـ"+ch+(j?"ـ":"")],["آخر","ـ"+ch]]
    .map(([t,f])=>`<div><b>${f}</b><span>${t}</span></div>`).join("");
  const w=document.getElementById("lWord");
  w.innerHTML=`<span class="emo">${emo}</span><span class="w">${word}</span><span class="say" style="display:flex;align-items:center;justify-content:center">🔊</span>`;
  w.onclick=()=>speak(word);
  lm.classList.add("show");
  setTimeout(()=>speak(name),250);
  markDone(ch);talk(`${name}! ${praise[Math.floor(Math.random()*praise.length)]}`);
}

/* surprise */
let spinning=false;
document.getElementById("surprise").addEventListener("click",()=>{
  if(spinning)return;spinning=true;const tiles=[...document.querySelectorAll(".tile")];
  const pool=tiles.filter(t=>!done[L[t.dataset.i][0]]);const target=(pool.length?pool:tiles)[Math.floor(Math.random()*(pool.length||tiles.length))];
  let steps=18+Math.floor(Math.random()*6),i=0,prev;
  (function step(){if(prev)prev.classList.remove("spot");const t=i<steps?tiles[Math.floor(Math.random()*tiles.length)]:target;
    t.classList.add("spot");prev=t;tick();
    if(i<steps){i++;setTimeout(step,55+i*i*.35)}
    else{t.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>{t.classList.remove("spot");spinning=false;fanfare();openLetter(+t.dataset.i,t)},500)}})();
});

/* game */
const gm=document.getElementById("gameModal");let gAns,gRight=0,gTotal=0,gLock=false;
function newRound(){
  gLock=false;const idx=[...Array(L.length).keys()].sort(()=>Math.random()-.5).slice(0,4);gAns=idx[0];
  const opts=idx.sort(()=>Math.random()-.5),box=document.getElementById("gOpts");box.innerHTML="";
  document.getElementById("gQ").textContent=`أين حرف ${L[gAns][1]}؟`;
  opts.forEach((k,n)=>{const b=document.createElement("button");b.textContent=L[k][0];b.style.background=COLORS[n+1];
    b.onclick=()=>{if(gLock)return;
      if(k===gAns){gLock=true;gRight++;gTotal++;b.classList.add("right");popSnd();fanfare();burstAt(b);
        const p=praise[Math.floor(Math.random()*praise.length)];speak(p,.9);talk(p);markDone(L[k][0]);score();setTimeout(newRound,1500)}
      else{b.classList.add("wrong");buzz();gTotal++;score();speak("حاول مرة ثانية",.9)}};
    box.appendChild(b)});
  setTimeout(()=>speak(L[gAns][1]),300)}
function score(){document.getElementById("gScore").textContent=gTotal?`⭐ ${gRight} صحيحة`:"اسمع الحرف واضغط عليه"}
document.getElementById("game").addEventListener("click",()=>{gRight=0;gTotal=0;score();gm.classList.add("show");newRound()});
document.getElementById("gAgain").addEventListener("click",()=>speak(L[gAns][1]));

/* close modals */
document.querySelectorAll(".modal").forEach(m=>{m.addEventListener("click",e=>{if(e.target===m||e.target.hasAttribute("data-close")){m.classList.remove("show");if(hasTTS)speechSynthesis.cancel()}})});

/* twinkle, mute, reset */
setInterval(()=>{const t=document.querySelectorAll(".tile"),x=t[Math.floor(Math.random()*t.length)];x.classList.remove("glow");void x.offsetWidth;x.classList.add("glow")},2200);
const muteBtn=document.getElementById("mute");const setMute=()=>muteBtn.textContent=muted?"🔇 بدون صوت":"🔊 الصوت";setMute();
muteBtn.addEventListener("click",()=>{muted=!muted;try{localStorage.setItem("arMuted",muted?"1":"0")}catch(e){}setMute();if(muted&&hasTTS)speechSynthesis.cancel();popSnd()});
document.getElementById("reset").addEventListener("click",()=>{done={};save();document.querySelectorAll(".tile.done").forEach(t=>t.classList.remove("done"));update();talk("بداية جديدة! يلا! 🚀")});
</script>
</body>
</html>
