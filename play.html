<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<script src="supa.js"></script>
<script src="profile.js"></script><script src="landscape.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-n.png"><link rel="icon" href="icon-n.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>نجمة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Noto+Naskh+Arabic:wght@600;700&family=Fredoka:wght@500;700&display=swap">
<style>
:root{--bg:#fff6e6;--ink:#3a2512;--wood:#a8692c;--wood2:#7c4a1a;--ok:#2fbf71;--try:#ff9f43;--gold:#f5b700;--r:24px;--ease:cubic-bezier(.23,1,.32,1);--pop:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* ﷺ drawn from the Quran font (the rounded font squashes it) */@font-face{font-family:"SAW";src:url(fonts/amiri-quran.woff2) format("woff2");unicode-range:U+FDFA}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"SAW","Baloo Bhaijaan 2","Noto Naskh Arabic","Fredoka",system-ui,sans-serif;touch-action:manipulation}
img{-webkit-user-drag:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.bgsc{position:absolute;inset:0;background:#ffe9c4 center/cover no-repeat;z-index:-1;transition:background-image .3s}
/* top bar */
#top{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:76px}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px 6px 8px;box-shadow:0 4px 0 #e6c99a,0 8px 18px rgba(120,70,20,.15);font-weight:800;font-size:22px;transition:transform .14s var(--ease)}
.chip:active{transform:scale(.94)}
.ic{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #e6c99a,0 8px 18px rgba(120,70,20,.15);transition:transform .14s var(--ease)}
.ic:active{transform:scale(.92)}
.ic svg{width:30px;height:30px}
#ttl{flex:1;text-align:center;font-size:30px;font-weight:800;text-shadow:0 2px 0 #fff}
#stars img{width:34px}
#prog{display:flex;gap:6px}
#prog i{width:14px;height:14px;border-radius:50%;background:#ecd3a8}
#prog i.on{background:var(--gold);box-shadow:0 0 0 3px #fff3c4}
/* falcon */
#fal{position:absolute;bottom:6px;left:8px;width:150px;z-index:20;pointer-events:none}
#fal img{width:100%;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
#fal.hop{animation:hop .5s var(--pop)}
#fal.talking img{animation:yak .28s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes yak{from{transform:scaleY(1) rotate(-1deg)}to{transform:scaleY(1.04) rotate(1.5deg)}}
@keyframes hop{30%{transform:translateY(-22px)}}
#bub{position:absolute;bottom:150px;left:20px;z-index:21;max-width:340px;background:#fff;border-radius:22px;padding:10px 18px;font-size:24px;font-weight:800;box-shadow:0 6px 18px rgba(120,70,20,.2);opacity:0;transform:translateY(8px) scale(.96);transition:.25s var(--ease);pointer-events:none}
#bub.on{opacity:1;transform:none}
#bub::after{content:"";position:absolute;bottom:-12px;left:46px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
/* stage */
#stage{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;padding:6px 20px 16px 150px;display:flex;flex-direction:column}
/* hub */
#tabs{display:flex;justify-content:center;gap:14px;padding:4px 0 10px}
.tab{display:flex;flex-direction:column;align-items:center;width:118px;padding:6px 4px 8px;border-radius:22px;transition:transform .14s var(--ease),background .2s}
.tab img{width:96px;height:80px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.tab b{font-size:20px;line-height:1.1}
.tab.on{background:rgba(255,248,236,.85);box-shadow:0 4px 0 var(--c),0 10px 20px rgba(120,70,20,.15)}
.tab:active{transform:scale(.94)}
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px;padding:6px 10px 140px;align-content:start}
.tile{padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .14s var(--ease);animation:rise .4s var(--ease) both;position:relative}
.tile:active{transform:scale(.95) translateY(3px)}
.tile .pv{height:104px;display:flex;align-items:flex-end;justify-content:center}
.tile .pv img{max-height:110px;max-width:160px;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(60,30,0,.28))}
.tile b{font-size:23px;text-align:center;line-height:1.2;color:#3a2512;text-shadow:0 0 6px #fff,0 0 6px #fff,0 0 3px #fff}
.tile small{font-family:Fredoka;font-size:15px;font-weight:700;color:#5a3300;text-shadow:0 1px 0 #fff,0 0 6px #fff}
.tile .dn{position:absolute;top:6px;inset-inline-end:8px;width:30px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
/* game */
.q{align-self:center;text-align:center;font-size:30px;font-weight:800;margin:2px 0 6px;min-height:42px;padding:2px 26px;border-radius:999px;background:rgba(255,248,236,.82);box-shadow:0 4px 0 rgba(168,105,44,.35)}
.q:empty{visibility:hidden}
.row{display:flex;justify-content:center;align-items:flex-end;gap:22px;flex-wrap:wrap}
.tg{position:relative;display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease),filter .2s;filter:drop-shadow(0 8px 10px rgba(60,30,0,.22))}
.tg.hot{transform:scale(1.07);filter:drop-shadow(0 0 16px #ffd43b) drop-shadow(0 0 4px #ffd43b)}
.tg.good{filter:drop-shadow(0 0 14px rgba(47,191,113,.9))}
.tg>img.main{max-width:88%;max-height:88%;object-fit:contain}
.tg .dock{position:absolute;inset:auto 0 -8px 0;display:flex;justify-content:center;gap:2px;flex-wrap:wrap;pointer-events:none}
.tg .dock img{width:54px;animation:pop .35s var(--pop)}
.bin{flex-direction:column;justify-content:flex-start;padding-top:10px;overflow:hidden;border-radius:30px;background:color-mix(in srgb,var(--bc,#8a5a0c) 24%,transparent);border:5px solid var(--bc,#8a5a0c);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bin>.bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}.bin>.lb,.bin>.dock{position:relative;z-index:1}
.bin .lb{font-size:26px;font-weight:800;padding:2px 16px;border-radius:999px;color:#fff;background:var(--bc,#8a5a0c)}
.bin .dock{position:static;padding:8px;gap:4px}
.it{position:relative;touch-action:none;cursor:grab;transition:transform .14s var(--ease);filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.it img{display:block;max-width:100%;max-height:100%;pointer-events:none}
.it.raw img{max-width:none;max-height:none}
.it:active{transform:scale(1.06)}
.it.drag{position:fixed;z-index:50;transition:none;transform:scale(1.12);filter:drop-shadow(0 14px 14px rgba(0,0,0,.28))}
.it.back{transition:left .35s var(--ease),top .35s var(--ease)}
.wob{animation:wob .32s}
@keyframes wob{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.opt{display:flex;align-items:center;justify-content:center;transition:transform .14s var(--ease),filter .2s;position:relative;filter:drop-shadow(0 8px 10px rgba(60,30,0,.25))}
.opt.pill{background:linear-gradient(#ffe08a,#f5b700);border-radius:28px;box-shadow:inset 0 -7px 0 #c98a00;color:#5a3300}
.opt.sw{border-radius:50%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2)}
.opt.card img{border-radius:22px;box-shadow:0 0 0 5px rgba(255,255,255,.8)}
.opt:active{transform:scale(.95) translateY(3px)}
.opt img{max-width:90%;max-height:90%;object-fit:contain;border-radius:16px}
.opt.good{filter:drop-shadow(0 0 16px rgba(47,191,113,1)) drop-shadow(0 0 4px rgba(47,191,113,1));animation:pop .35s var(--pop)}
.opt.hint{filter:drop-shadow(0 0 16px #ffd43b) drop-shadow(0 0 4px #ffd43b);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.opt .tx{font-size:44px;font-weight:800}
.sil img{filter:brightness(0) opacity(.75)}
.big{display:flex;align-items:center;justify-content:center;flex:1;min-height:0}
/* lesson */
.ls{flex:1;display:flex;gap:26px;align-items:center;justify-content:center;min-height:0;padding:0 30px 10px}
.ls .card{height:min(64vh,520px);aspect-ratio:1;background:#fff;border-radius:30px;padding:12px;box-shadow:0 8px 0 var(--c,#c98a00),0 16px 30px rgba(120,70,20,.18);display:flex;align-items:center;justify-content:center;animation:pop .4s var(--pop)}
.ls .card img{max-width:100%;max-height:100%;border-radius:22px;object-fit:contain}
.ls .txt{max-width:44%;display:flex;flex-direction:column;gap:14px}
.ls h2{margin:0;font-size:44px;line-height:1.2;color:var(--c,#8a5a0c)}
.ls p{margin:0;font-size:34px;line-height:1.6;font-family:"SAW","Baloo Bhaijaan 2"}
.ls .names{display:flex;flex-wrap:wrap;gap:10px}
.ls .names span{background:#fff;border-radius:16px;padding:6px 14px;font-size:24px;box-shadow:0 3px 0 #ecd3a8}
.nav{display:flex;justify-content:center;align-items:center;gap:18px;padding-bottom:6px}
.dot{width:12px;height:12px;border-radius:50%;background:#ecd3a8}
.dot.on{background:var(--c,#c98a00);width:30px;border-radius:8px}
.btn{background:var(--c,#2f9a57);color:#fff;font-size:28px;font-weight:800;padding:10px 34px;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .14s var(--ease)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
/* lesson board */
.ban{align-self:center;font-size:40px;font-weight:800;color:#fff;background:var(--c);padding:4px 40px 8px;border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.22);margin:0 0 10px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.board{flex:1;display:grid;gap:14px;align-content:center;justify-content:center;min-height:0;padding:0 8px}
.lc{position:relative;border-radius:24px;padding:8px 8px 6px;background:var(--lc);border:4px solid var(--lb);box-shadow:0 6px 0 var(--lb);display:flex;flex-direction:column;align-items:center;gap:4px;animation:rise .4s var(--ease) both;transition:transform .14s}
.lc:active{transform:scale(.96)}
.lc img{width:100%;aspect-ratio:1;object-fit:contain}
.lc b{font-size:20px;line-height:1.15;color:#3a2512;text-align:center}
.lc .no{position:absolute;top:-12px;inset-inline-start:-10px;width:38px;height:38px;border-radius:50%;background:var(--lb);color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.lc.seen::after{content:"";position:absolute;top:-10px;inset-inline-end:-8px;width:32px;height:32px;background:url(img/x/r_star.webp) center/contain no-repeat}
.zoom{position:absolute;inset:0;z-index:30;background:rgba(58,37,18,.45);display:flex;align-items:center;justify-content:center;gap:28px;padding:30px 40px;animation:rise .25s var(--ease)}
.zoom .zc{display:flex;gap:28px;align-items:center;background:var(--lc);border:6px solid var(--lb);border-radius:34px;padding:22px;max-width:100%;box-shadow:0 10px 0 var(--lb)}
.zoom img{height:min(58vh,460px);border-radius:24px}
.zoom .zt{max-width:420px;display:flex;flex-direction:column;gap:12px}
.zoom h2{margin:0;font-size:42px;color:var(--lb)}.zoom p{margin:0;font-size:34px;line-height:1.5}
.bot{display:flex;justify-content:center;padding:8px 0 4px}
/* nasab */
.nas{flex:1;display:flex;align-items:center;justify-content:center;gap:22px;min-height:0}
.nas .side{display:flex;flex-direction:column;gap:14px}
.tree{position:relative;height:min(64vh,520px);aspect-ratio:1}
.tree img{width:100%;height:100%}
.tree .pl{position:absolute;transform:translate(-50%,-50%);width:23%;height:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;border-radius:50%}
.tree .pl small{font-size:clamp(11px,1.5vh,15px);color:#a8692c;font-weight:800}
.tree .pl b{font-size:clamp(13px,2.2vh,21px);color:#3a2512}
.tree .pl.top b{color:#177a52;font-size:clamp(16px,2.8vh,26px)}
.nc{display:flex;align-items:center;gap:8px;background:var(--lc);border:4px solid var(--lb);border-radius:22px;padding:4px 10px 4px 4px;box-shadow:0 5px 0 var(--lb);width:200px;transition:transform .14s}
.nc:active{transform:scale(.96)}
.nc img{width:70px;height:70px;object-fit:contain}
.nc b{font-size:20px;line-height:1.2;text-align:start}
/* end */
#end{position:absolute;inset:0;background:rgba(255,246,230,.86);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:40;flex-direction:column;gap:14px}
#end.on{display:flex;animation:rise .3s var(--ease)}
#end .st{display:flex;gap:10px}
#end .st img{width:84px;animation:pop .5s var(--pop) both}
#end h1{margin:0;font-size:48px}
#conf{position:absolute;inset:0;pointer-events:none;z-index:39}
/* start */
#start{position:fixed;inset:0;z-index:99;background:linear-gradient(#ffe9c4,#f8d79e);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#start img{width:220px;animation:hop 1.6s infinite}
#start .btn{font-size:40px;padding:14px 60px;--c:#2f9a57}
#start h1{margin:0;font-size:46px}
#start p{margin:0;font-size:22px;opacity:.7}
#gender{display:flex;gap:6px;background:#fff;border-radius:999px;padding:4px;box-shadow:0 4px 0 #e6c99a}
#gender button{padding:4px 14px;border-radius:999px;font-size:20px;font-weight:800}
#gender button.on{background:#ffd76a}
/* scale & balance */
.scale{position:relative;width:560px;height:330px;margin-bottom:10px}
.scale .stand{position:absolute;left:50%;bottom:0;width:300px;transform:translateX(-50%)}
.beam{position:absolute;left:50%;top:22px;width:470px;height:0;transform:translateX(-50%);transition:transform .8s var(--pop)}
.pan{position:absolute;width:170px;transform:translateX(-50%);animation:rise .6s var(--pop)}
.pan img.p{width:170px;display:block}
.pan .blk{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap-reverse;width:130px;justify-content:center}
.pan .blk img{width:40px;margin:-3px}
/* paint */
#paint{flex:1;display:flex;gap:16px;align-items:center;justify-content:center;min-height:0}
#paint canvas{max-height:100%;max-width:78%;background:#fff;border-radius:24px;box-shadow:0 8px 24px rgba(120,70,20,.18);touch-action:none}
.pal{display:grid;grid-template-columns:repeat(2,64px);gap:10px}
.pal button{width:64px;height:64px;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.15);transition:transform .14s}
.pal button.on{transform:scale(1.15);box-shadow:0 0 0 5px #fff,0 0 0 9px var(--ink)}
/* sticker scene */
.scn{position:relative;flex:1;border-radius:26px;overflow:hidden;box-shadow:0 8px 24px rgba(120,70,20,.2);background-size:cover;background-position:center}
.scn .placed{position:absolute;width:110px;transform:translate(-50%,-50%);touch-action:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
.tray{display:flex;gap:10px;overflow-x:auto;padding:10px 4px 4px;direction:ltr}
.tray button{flex:0 0 auto;width:86px;height:86px;background:#fff;border-radius:20px;box-shadow:0 4px 0 #ecd3a8}
.tray img{max-width:80%;max-height:80%}
.lt{font-family:Fredoka;font-weight:700}
@media (max-height:700px){#fal{width:110px}.ls .card{height:56vh}.ls p{font-size:28px}.ls h2{font-size:36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- drawing studio ---------- */
.dst{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.dtop,.dbot{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:nowrap}
.dmid{flex:1;display:flex;gap:10px;min-height:0;align-items:center;justify-content:center}
.dside{display:grid;grid-template-columns:repeat(2,60px);gap:8px;align-content:center}
.dbtn{width:60px;height:60px;border-radius:18px;border:3px solid #fff;background:linear-gradient(#fffdf6,#fbeacb);box-shadow:0 4px 0 #d9b77a;display:grid;place-items:center;padding:6px;cursor:pointer;touch-action:manipulation;transition:transform .12s}
.dbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9b77a}.dbtn.on{background:linear-gradient(#3fb5a6,#1f7f74);box-shadow:0 4px 0 #17665d}.dbtn.on svg{filter:brightness(0) invert(1)}
.dbtn svg,.dbtn img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.dsep{width:10px}.dbtn.dera{background:linear-gradient(#ffe3ec,#ffc9de)}.dbtn.dera.on{background:linear-gradient(#e64980,#c2255c)}
.dwrap{position:relative;height:100%;max-width:100%;aspect-ratio:1200/760;border-radius:22px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 24px rgba(120,70,20,.22);background:#fff}
.dwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.dcol{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.18);cursor:pointer}.dcol.on{transform:scale(1.18);box-shadow:0 0 0 4px #1f7f74}
.dsz{width:48px;height:48px;border-radius:50%;background:#fffaf0;border:3px solid #fff;box-shadow:0 3px 0 #d9b77a;display:grid;place-items:center;cursor:pointer}.dsz i{display:block;border-radius:50%;background:#13275a}.dsz.on{box-shadow:0 0 0 4px #1f7f74}
.dtray{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:linear-gradient(#fffdf6,#fbeacb);border:5px solid #fff;border-radius:28px;box-shadow:0 10px 0 #d9b77a,0 18px 30px rgba(90,55,15,.3);padding:16px;display:grid;gap:12px;max-height:88%;overflow:auto}
.dtray button{border:3px solid #fff;border-radius:18px;background:#fffaf0;box-shadow:0 4px 0 #d9b77a;cursor:pointer;padding:6px}
.dtray img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.dstamp{position:absolute;z-index:5;touch-action:none;cursor:move}.dstamp img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 3px #fff)}
.dstamp .sb{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:#1f7f74;color:#fff;font:800 22px system-ui;display:grid;place-items:center;box-shadow:0 3px 0 #17665d;cursor:pointer}
</style>
</head>
<body>
<div id="app">
 <div class="bgsc"></div>
 <div id="top">
  <button class="ic" id="home" aria-label="الرئيسية"><svg viewBox="0 0 24 24" fill="none" stroke="#7c4a1a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></button>
  <button class="ic" id="rep" aria-label="أعد"><svg viewBox="0 0 24 24" fill="#7c4a1a"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 010 7" fill="none" stroke="#7c4a1a" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  <div id="prog"></div>
  <div id="ttl"></div>
  <div id="gender" style="display:none"><button data-g="b">ولد</button><button data-g="g">بنت</button></div>
  <div class="chip" id="stars"><img src="img/x/r_star.webp" alt=""><span id="sn">0</span></div>
 </div>
 <div id="stage"></div>
 <div id="fal"><img src="img/approved/mascot-falcon.webp" alt=""></div>
 <div id="bub"></div>
 <canvas id="conf"></canvas>
 <div id="end"><div class="st"></div><h1 id="endT">أحسنت!</h1><div class="row"><button class="btn" id="again" style="--c:#2567c9">مرة ثانية</button><button class="btn" id="back" style="--c:#2f9a57">ألعاب أخرى</button></div></div>
</div>
<div id="start"><img src="img/approved/mascot-falcon.webp" alt=""><button class="btn" id="go">يلا!</button></div>
<script>
