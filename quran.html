<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="supa.js"></script>
<script src="profile.js"></script>

<title>قصص القرآن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
@font-face{font-family:"Amiri Quran";src:url(fonts/amiri-quran.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;color:#2b2340;min-height:100vh;background:linear-gradient(165deg,#3fd3a8,#1fa2c9 50%,#6a5cff);background-attachment:fixed}
main{max-width:820px;margin:0 auto;padding:16px 12px 70px}
h1{color:#fff;text-align:center;font-size:clamp(34px,9vw,52px);margin:6px 0 2px;text-shadow:0 4px 0 rgba(0,0,0,.18);line-height:1.3}
.sub{color:#fff;text-align:center;opacity:.95;margin:0 0 12px;font-size:18px}
.q{font-family:"Amiri Quran","Baloo Bhaijaan 2",serif;line-height:2.1}
.box{background:rgba(255,255,255,.95);border-radius:28px;padding:14px;margin-top:14px;box-shadow:0 8px 0 rgba(0,0,0,.08)}
/* hub */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sc{border:0;border-radius:22px;padding:12px 8px 10px;background:#fff;cursor:pointer;font-family:inherit;color:#2b2340;box-shadow:0 6px 0 rgba(0,0,0,.12);position:relative;text-align:center}
.sc:active{transform:translateY(4px)}
.sc .num{position:absolute;top:8px;inset-inline-start:10px;background:#ece8ff;color:#6a5cff;border-radius:999px;font-size:13px;font-weight:800;padding:0 8px}
.sc .nm{font-family:"Amiri Quran",serif;font-size:26px;line-height:1.6;margin-top:16px}
.sc .meta{font-size:13px;color:#7a7090}
.bar{height:8px;border-radius:9px;background:#eee8fb;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3fc35a,#22c7b8)}
.sc .ic{font-size:30px;margin-top:2px}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font-family:inherit;font-size:18px;font-weight:800;border:0;border-radius:999px;padding:9px 16px;background:rgba(255,255,255,.3);color:#fff;cursor:pointer}
.tabs button.on{background:#fff;color:#6a5cff;box-shadow:0 4px 0 rgba(0,0,0,.12)}
/* scene */
.scene{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;gap:4%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.scene svg.d{position:absolute;inset:0;width:100%;height:100%}
.scene .e{position:relative;font-size:clamp(46px,15vw,92px);animation:float 3s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18));line-height:1}
.scene .e:nth-child(3){animation-delay:-1s}.scene .e:nth-child(4){animation-delay:-2s}
.scene.sm{aspect-ratio:1;width:64px;flex:none;border-radius:14px;box-shadow:none}.scene.sm .e{font-size:26px;animation:none}
.scene img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scene img.ph.fit{object-fit:contain;background:#fffdf6}.card .scene:has(img.fit){aspect-ratio:4/3}
@keyframes float{50%{transform:translateY(-8%)}}
.bg-sky{background:linear-gradient(#8fd3ff,#e3f6ff)}.bg-night{background:linear-gradient(#14214f,#3b4c9b)}.bg-desert{background:linear-gradient(#ffe2a8,#f6b765)}
.bg-fire{background:linear-gradient(#ffb36b,#e4572e)}.bg-garden{background:linear-gradient(#c9f5c1,#6cc673)}.bg-sea{background:linear-gradient(#a6e6ff,#2a86c9)}
.bg-space{background:linear-gradient(#25174f,#5b3fa8)}.bg-mosque{background:linear-gradient(#fff3d9,#ffd27f)}.bg-day{background:linear-gradient(#bfe9ff,#fff6bf)}
.bg-storm{background:linear-gradient(#8d9bb0,#55627a)}.bg-earth{background:linear-gradient(#d4efff,#a6d48a)}.bg-light{background:linear-gradient(#fffbe8,#ffe0f0)}
.bg-rain{background:linear-gradient(#a9c3d9,#6f8fae)}.bg-mountain{background:linear-gradient(#d8ecff,#a9c6e2)}.bg-dawn{background:linear-gradient(#ff9f7a,#ffe3a1)}
/* cards */
.card{background:#fff;border-radius:26px;padding:12px;margin-bottom:14px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.ayah{font-family:"Amiri Quran",serif;font-size:clamp(24px,6.4vw,34px);line-height:2.1;text-align:center;margin:8px 4px 2px;cursor:pointer}
.ayah .no{font-size:.75em;color:#1fa2c9}
.ayah.now{background:#fff7d1;border-radius:14px}
.mean{background:#fff7e0;border-radius:16px;padding:8px 12px;font-size:19px;line-height:1.7;margin-top:6px}
.mean b{color:#e07a00}
.intro{background:linear-gradient(135deg,#fff7e0,#ffe9f3);border-radius:22px;padding:12px 14px;font-size:19px;line-height:1.8}
.intro h3,.lessons h3{margin:0 0 4px;font-size:22px}
.lessons li{font-size:20px;margin-bottom:6px;line-height:1.6}
.msg{background:linear-gradient(135deg,#ffe1ec,#fff4d6);border-radius:22px;padding:14px;font-size:21px;font-weight:700;text-align:center;line-height:1.7;margin-top:12px}
.btn{font-family:inherit;font-size:19px;font-weight:800;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;color:#2b2340;background:#ffe066;box-shadow:0 5px 0 #d9a400}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d9a400}
.btn.p{background:#a66bff;color:#fff;box-shadow:0 5px 0 #7a46d0}.btn.t{background:#22c7b8;color:#fff;box-shadow:0 5px 0 #149488}.btn.g{background:#fff;box-shadow:0 5px 0 #ddd3ee}
.btn.sm{font-size:16px;padding:7px 12px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.line{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 10px;margin-bottom:10px;box-shadow:0 4px 0 rgba(0,0,0,.07)}
.line .ayah{flex:1;margin:0;font-size:clamp(22px,5.6vw,28px);text-align:start}
.line .st{font-size:13px;white-space:nowrap}
.hide .line .ayah{filter:blur(9px)}.hide .line.peek .ayah{filter:none}
.line.now{outline:4px solid #ffe066}
.modal{position:fixed;inset:0;background:rgba(20,30,70,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:10px}
.modal.show{display:flex}
.mc{background:#fff;border-radius:30px;padding:14px;max-width:600px;width:100%;max-height:96vh;overflow:auto;position:relative;animation:zoom .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes zoom{from{transform:scale(.4);opacity:0}}
.x{position:absolute;top:10px;inset-inline-start:10px;border:0;background:#f0edf7;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;z-index:2}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.opts button{border:0;padding:0;background:none;cursor:pointer;border-radius:18px}
.opts button{min-width:0;overflow:hidden}.opts .scene{aspect-ratio:1!important;width:100%;gap:0}.opts .scene .e{font-size:clamp(26px,9vw,46px)}
.opts button.wrong{animation:shake .4s;opacity:.35}.ans{display:grid;gap:10px;margin:12px 0}
.ans button{font-family:inherit;font-size:21px;font-weight:700;border:0;border-radius:18px;padding:12px;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.ans button.wrong{animation:shake .4s;opacity:.4}.ans button.right{background:#3fc35a!important}
.pool{display:grid;gap:8px;margin:10px 0}.pool button{font-family:"Amiri Quran",serif;font-size:22px;line-height:1.9;border:0;border-radius:16px;padding:6px 10px;background:#f3f0fa;cursor:pointer;color:#2b2340}
.pool button.used{display:none}.pool button.wrong{animation:shake .4s;background:#ffd9df}
.built .ayah{font-size:22px;background:#e3f8e7;border-radius:12px;margin:4px 0;padding:0 8px}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.games{display:grid;gap:12px}.games button{font-family:inherit;border:0;border-radius:24px;padding:18px;font-size:24px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.score{text-align:center;color:#7a7090;font-weight:700}
.stop{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;z-index:30}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
/* memorisation path */
.path{position:relative;margin:4px auto 0;max-width:420px}
.path svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);width:86px;text-align:center;border:0;background:none;padding:0;cursor:pointer;font-family:inherit}
.node .c{width:64px;height:64px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:#e9e4f7;color:#9a90b5;box-shadow:0 5px 0 rgba(0,0,0,.15);border:4px solid #fff}
.node.done .c{background:linear-gradient(150deg,#3fc35a,#22c7b8);color:#fff}
.node.cur .c{background:linear-gradient(150deg,#ffd23f,#ff9a3c);color:#fff;animation:pulse 1.4s infinite}
.node .t{font-family:"Amiri Quran",serif;font-size:17px;line-height:1.5;color:#2b2340;background:rgba(255,255,255,.92);border-radius:10px;padding:0 6px;display:inline-block;margin-top:3px}
.node.end .c{width:76px;height:76px;font-size:38px;background:linear-gradient(150deg,#ffe066,#ffb020)}
.node.end.lock .c{filter:grayscale(.8);opacity:.7}
@keyframes pulse{50%{transform:scale(1.1)}}
.hero{position:absolute;font-size:40px;transform:translate(-50%,-115%);transition:left 1.6s cubic-bezier(.5,0,.3,1),top 1.6s cubic-bezier(.5,0,.3,1);z-index:3;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25));pointer-events:none}
.cert{background:linear-gradient(150deg,#fff8e1,#ffe9f3);border:6px double #e0a800;border-radius:26px;padding:20px 14px;text-align:center}
.cert h2{margin:6px 0;font-size:30px;color:#c27c00}.cert .big{font-size:80px;line-height:1}
.pip{display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:18px;font-weight:700}
</style>
</head>
<body>
<a href="home.html" id="homeBtn" aria-label="Home" style="position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:15;width:52px;height:52px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 5px 0 rgba(0,0,0,.18)">🏠</a>
<canvas id="fx"></canvas>
<main id="main"></main>
<div class="modal" id="m"><div class="mc"><button class="x" data-close>✕</button><div id="mb"></div></div></div>
<script src="data/qk.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AD=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]),COL=["#ff5d73","#ffb020","#22c7b8","#4f8bff","#a66bff","#3fc35a"];
const shuf=a=>[...a].sort(()=>Math.random()-.5),rnd=a=>a[Math.floor(Math.random()*a.length)],sleep=t=>new Promise(r=>setTimeout(r,t));
const seg=s=>window.Intl&&Intl.Segmenter?[...new Intl.Segmenter("ar",{granularity:"grapheme"}).segment(s)].map(x=>x.segment):Array.from(s);
const PRAISE=["أحسنت!","رائع!","ممتاز!","ما شاء الله!","بطل!"];
/* which surahs this child can see (parent sets levels) */
const GROUPS=[[1],[114,113,112,111,110,109,108,107,106],[105,104,103,102,101,100,99,98,97],[96,95,94,93,92,91,90,89],[88,87,86,85,84,83,82,81,80,79,78]];
/* everything the parent added in the portal: story, explanation, pictures, simple meanings, extra surahs */
const QC=NAJMA.sections.find(s=>s.type==="qimg")||{};["img","poster","story","expl","explA","explV","secV","simp","extra"].forEach(k=>QC[k]=QC[k]||{});
const QIMG=QC.img,PH={},PACK={};
Object.keys(QC.extra).forEach(n=>{QK[n]=QC.extra[n]});
const XN=Object.keys(QC.extra).map(Number).sort((a,b)=>b-a);
const ALLOWED=new Set([...NAJMA.lv("quran").flatMap(i=>GROUPS[i]||[]),...XN]);
const LIST=[...QK_ORDER,...XN].filter(n=>ALLOWED.has(n));
const prog=n=>{try{return JSON.parse(localStorage.getItem("qk_"+n)||"{}")}catch(e){return {}}};
const star=(n,a,s)=>{const p=prog(n);p[a]=Math.max(p[a]||0,s);try{localStorage.setItem("qk_"+n,JSON.stringify(p));const d=JSON.parse(localStorage.getItem("qkDone")||"{}");d[n+":"+a]=1;localStorage.setItem("qkDone",JSON.stringify(d))}catch(e){}};

/* sounds + confetti */
let ac;function tone(f,d,ty="triangle",w=0,v=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,ac.currentTime+w);g.gain.setValueAtTime(v,ac.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+w+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d+.02)}catch(e){}}
const pop=()=>{tone(520,.12);tone(880,.14,"triangle",.07)},fan=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",i*.12)),buzz=()=>tone(160,.25,"sawtooth",0,.08);
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],run=false;function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}size();addEventListener("resize",size);
function burst(x,y,n=36){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=3+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:4+Math.random()*6,c:COL[i%6],rot:0,vr:(Math.random()-.5)*.4,life:100})}if(!run){run=true;requestAnimationFrame(loop)}}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life-->0);for(const p of parts){p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/30);cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}if(parts.length)requestAnimationFrame(loop);else run=false}
const burstAt=el=>{const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2)};
/* recitation: Mahmoud Khalil Al-Husary, ayah by ayah (AlQuran.cloud CDN) */
const REC=["ar.husary","ar.alafasy"];let aud=null,runId=0;
function play(gnum){return new Promise(res=>{if(aud){aud.onended=null;aud.pause()}let k=0;const t0=Date.now();
  const go=()=>{aud=new Audio(`https://cdn.islamic.network/quran/audio/128/${REC[k]}/${gnum}.mp3`);aud.onended=()=>res((Date.now()-t0)/1000);
    aud.onerror=()=>{if(++k<REC.length)go();else res(0)};aud.play().catch(()=>res(0))};go()})}
const stop=()=>{runId++;if(aud){aud.onended=null;aud.pause()}try{NAJMA.aiStop()}catch(e){}};

/* scene: painted background + emoji characters (or the parent's own picture) */
const DECO={sky:'<circle cx="85" cy="18" r="9" fill="#fff6a8"/><g fill="#fff" opacity=".9"><ellipse cx="22" cy="20" rx="13" ry="5"/><ellipse cx="60" cy="12" rx="9" ry="4"/></g>',
 night:'<circle cx="84" cy="14" r="7" fill="#fff4c2"/><circle cx="87" cy="12" r="6" fill="#1d2b5d"/><g fill="#fff">'+[...Array(14)].map((_,i)=>`<circle cx="${(i*37)%100}" cy="${(i*23)%45+3}" r="${i%3?.5:.9}"/>`).join("")+'</g>',
 desert:'<circle cx="82" cy="16" r="8" fill="#fff1b0"/><path d="M0 46 Q25 36 50 44 T100 42 V57 H0Z" fill="#e9a24f"/><path d="M0 50 Q30 44 60 50 T100 49 V57 H0Z" fill="#d98c3a"/>',
 fire:'<path d="M0 57 Q8 40 14 52 Q18 34 26 50 Q32 38 38 53 Q46 36 52 51 Q58 40 66 52 Q72 35 80 50 Q86 42 92 52 Q96 44 100 50 V57Z" fill="#b8320f" opacity=".75"/>',
 garden:'<circle cx="84" cy="14" r="8" fill="#fff6a8"/><path d="M0 44 Q30 36 60 44 T100 42 V57 H0Z" fill="#4fae5a"/><g fill="#ff8fab"><circle cx="12" cy="50" r="1.5"/><circle cx="40" cy="52" r="1.5"/><circle cx="74" cy="51" r="1.5"/></g>',
 sea:'<path d="M0 40 Q12 36 25 40 T50 40 T75 40 T100 40 V57 H0Z" fill="#1f6fb0" opacity=".8"/><path d="M0 47 Q12 43 25 47 T50 47 T75 47 T100 47 V57 H0Z" fill="#175a93"/>',
 space:'<g fill="#fff">'+[...Array(22)].map((_,i)=>`<circle cx="${(i*29)%100}" cy="${(i*17)%55}" r="${i%4?.4:.9}"/>`).join("")+'</g><circle cx="16" cy="44" r="6" fill="#ffb36b" opacity=".8"/>',
 mosque:'<g fill="#f2b950" opacity=".7"><rect x="30" y="34" width="40" height="23"/><path d="M38 34 Q50 16 62 34Z"/><rect x="20" y="22" width="4" height="35"/><rect x="76" y="22" width="4" height="35"/></g>',
 day:'<circle cx="80" cy="16" r="10" fill="#ffd93b"/><g fill="#fff"><ellipse cx="24" cy="18" rx="12" ry="5"/></g><path d="M0 50 Q50 42 100 50 V57 H0Z" fill="#9fdc8a"/>',
 storm:'<g fill="#3e4a5e" opacity=".8"><ellipse cx="25" cy="12" rx="22" ry="8"/><ellipse cx="72" cy="10" rx="26" ry="9"/></g><path d="M60 16 L54 30 H60 L55 44" stroke="#ffe066" stroke-width="2" fill="none"/>',
 earth:'<path d="M0 42 Q25 34 50 42 T100 40 V57 H0Z" fill="#7cb85a"/><path d="M0 49 Q30 45 60 50 T100 48 V57 H0Z" fill="#a0773f"/>',
 light:'<g fill="#ffd166" opacity=".6">'+[...Array(10)].map((_,i)=>`<path d="M${(i*41)%100} ${(i*19)%50+3} l1 2 2 1 -2 1 -1 2 -1 -2 -2 -1 2 -1z"/>`).join("")+'</g>',
 rain:'<g fill="#e8eef5"><ellipse cx="30" cy="10" rx="20" ry="7"/><ellipse cx="70" cy="12" rx="22" ry="7"/></g><g stroke="#e8f4ff" stroke-width=".8">'+[...Array(16)].map((_,i)=>`<line x1="${(i*13)%100}" y1="${20+(i*7)%20}" x2="${(i*13)%100-2}" y2="${26+(i*7)%20}"/>`).join("")+'</g>',
 mountain:'<path d="M0 57 L22 26 L38 44 L58 18 L80 42 L100 30 V57Z" fill="#7d97b3"/><path d="M53 25 L58 18 L63 25 Z" fill="#fff"/>',
 dawn:'<circle cx="50" cy="50" r="16" fill="#ffd36b"/><path d="M0 48 Q50 40 100 48 V57 H0Z" fill="#e0794f"/>'};
function scene(bg,em,key,cls){const ph=key&&QIMG[key];let inner;
  if(ph)inner=PH[key]?`<img class="ph" src="${PH[key]}" alt="">`:"";
  else if(key&&PACK[key])inner=`<img class="ph fit" src="${PACK[key]}" alt="">`;
  else inner=seg(em).filter(x=>x.trim()).map(e=>`<span class="e">${e}</span>`).join("");
  return `<div class="scene bg-${bg} ${cls||""}" data-k="${key||""}"><svg class="d" viewBox="0 0 100 57" preserveAspectRatio="none">${DECO[bg]||""}</svg>${inner}</div>`}

/* ---------- hub ---------- */
const P=new URLSearchParams(location.search),N=+P.get("n");
const M=$("main");
function hub(){let done=0,tot=0;
  M.innerHTML=`<h1>📖 قصص القرآن</h1><p class="sub">اختر سورة، واسمع قصتها، واحفظها</p>
    <div class="box" style="background:linear-gradient(170deg,#e9fbff,#fff6e0)"><h3 style="margin:0;text-align:center;font-size:24px">🗺️ رحلة حفظ ١٠ سور</h3><p class="score" style="margin:2px 0 6px">احفظ كل سورة لتتقدّم في الطريق 🏁</p><div class="path" id="path"></div></div>
    <h3 style="color:#fff;margin:18px 4px 6px;font-size:22px">📚 كل السور</h3><div class="grid" id="g"></div>`;
  drawPath();
  LIST.forEach((n,k)=>{const s=QK[n],p=prog(n),d=Object.keys(p).length,pct=Math.round(d/s.t.length*100);done+=d;tot+=s.t.length;
    const b=document.createElement("button");b.className="sc";b.innerHTML=`<span class="num">${AD(n)}</span><div class="nm">${s.name}</div><div class="ic">${QC.extra[n]?"⭐":seg(s.a[0][1])[0]}</div><div class="meta">${AD(s.t.length)} آيات ${pct>=100?"🏆":""}</div><div class="bar"><i style="width:${pct}%"></i></div>`;
    b.onclick=()=>{pop();location.href="quran.html?n="+n};$("g").appendChild(b)});
  window.NAJMA_PROGRESS=()=>({done,total:tot})}

/* ---------- the path: last 10 surahs, Al-Nas to Al-Fil ---------- */
const PATH=[114,113,112,111,110,109,108,107,106,105];
const hifz=n=>{try{return JSON.parse(localStorage.getItem("qkH_"+n)||"{}")}catch(e){return {}}};

  openM(`<div style="height:34px"></div><div class="intro" style="font-size:21px;font-weight:800;text-align:center">${esc(C.q)}</div><div id="tk" style="display:grid;gap:10px;margin:12px 0"></div><div class="row"><button class="btn t" id="tkGo">✅ تحقّق</button></div>`);
  C.o.forEach(([t,ok],i)=>{const b=document.createElement("button");b.style.cssText="display:flex;align-items:center;gap:12px;border:0;border-radius:16px;background:#f3f0fa;padding:10px 14px;font-family:inherit;font-size:21px;font-weight:700;cursor:pointer;color:#2b2340;text-align:start";
    b.innerHTML=`<span class="bx" style="width:34px;height:34px;border-radius:8px;border:3px solid #6a5cff;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none"></span><span style="flex:1">${esc(t)}</span><span class="rs"></span>`;
    b.onclick=()=>{pop();sel.has(i)?sel.delete(i):sel.add(i);b.querySelector(".bx").textContent=sel.has(i)?"✔️":""};$("tk").appendChild(b)});
  $("tkGo").onclick=()=>{let good=0;[...$("tk").children].forEach((b,i)=>{const ok=C.o[i][1]===sel.has(i);if(ok)good++;b.querySelector(".rs").textContent=ok?"✅":"❌";b.style.background=ok?"#e3f8e7":"#ffe3e7"});
    if(good===C.o.length){fan();rain()}else{buzz()}}}
function matchGame(){const set=shuf(GR).slice(0,Math.min(4,GR.length)),sc=shuf(set);let sel=null,left=set.length,miss=0;
  openM(`<div style="height:34px"></div><div class="score">اضغط الآية، ثم صورتها</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px"><div id="mA" style="display:grid;gap:8px"></div><div id="mP" style="display:grid;gap:8px"></div></div>`);
  set.forEach(g=>{const b=document.createElement("button");b.className="pool";b.style.cssText="border:0;border-radius:16px;background:#f3f0fa;padding:6px 8px;font-family:'Amiri Quran',serif;font-size:19px;line-height:1.9;cursor:pointer;color:#2b2340";
    b.textContent=S.t[g.ay[0]-1].split(" ").slice(0,6).join(" ")+(S.t[g.ay[0]-1].split(" ").length>6?"…":"");
    b.onclick=()=>{document.querySelectorAll("#mA button").forEach(x=>x.style.outline="");b.style.outline="4px solid #ffb020";sel={g,b};play(S.g+g.ay[0]-1)};$("mA").appendChild(b)});
  sc.forEach(g=>{const b=document.createElement("button");b.style.cssText="border:0;padding:0;background:none;cursor:pointer";b.innerHTML=scene(g.bg,g.em,N+":"+g.ay[0]);b.firstChild.style.aspectRatio="4/3";
    b.onclick=()=>{if(!sel)return;if(sel.g===g){pop();burstAt(b);sel.b.style.visibility="hidden";b.style.visibility="hidden";g.ay.forEach(a=>star(N,a,miss?2:3));sel=null;
        if(--left===0){fan();rain();setTimeout(()=>openM(`<div class="msg">🏆 ${rnd(PRAISE)}</div><div class="row"><button class="btn p" id="ag">🔁 مرة ثانية</button></div>`),700);setTimeout(()=>{const a=$("ag");if(a)a.onclick=matchGame},800)}}
      else{miss++;buzz();b.firstChild.animate([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"none"}],300)}};$("mP").appendChild(b)})}
function pickPic(){const order=shuf(GR);let k=0,score=0;const id=++runId;
  const step=async()=>{if(id!==runId)return;if(k>=order.length){fan();rain();openM(`<div class="msg">🏆 ${rnd(PRAISE)}<br>⭐ ${AD(score)}</div>`);return}
    const g=order[k],others=shuf(GR.filter(x=>x!==g)).slice(0,2),opts=shuf([g,...others]);let miss=0;
    openM(`<div style="height:30px"></div>${g.ay.map(a=>ayahHTML(a)).join("")}<div class="score">أيّ صورة تناسب هذه الآية؟</div><div class="opts" id="op"></div><div class="score">${AD(k+1)} / ${AD(order.length)}</div>`);
    bindAyat($("mb"));play(S.g+g.ay[0]-1);
    opts.forEach(o=>{const b=document.createElement("button");b.innerHTML=scene(o.bg,o.em,N+":"+o.ay[0]);b.firstChild.style.aspectRatio="1";
      b.onclick=()=>{if(o===g){const s=miss?1:3;score+=s;g.ay.forEach(a=>star(N,a,s));fan();burstAt(b);k++;setTimeout(step,1100)}else{miss++;b.classList.add("wrong");buzz()}};$("op").appendChild(b)})};step()}
function orderGame(){const n=S.t.length,len=Math.min(n,5),start=Math.floor(Math.random()*(n-len+1)),want=[...Array(len)].map((_,i)=>start+i+1);let pos=0,miss=0;
  openM(`<div style="height:30px"></div><div class="score">رتّب الآيات من ${AD(want[0])} إلى ${AD(want[len-1])}</div><div class="built" id="bt"></div><div class="pool" id="pl"></div>`);
  shuf(want).forEach(a=>{const b=document.createElement("button");b.textContent=S.t[a-1];b.onclick=()=>{if(a===want[pos]){b.classList.add("used");pop();$("bt").insertAdjacentHTML("beforeend",ayahHTML(a));play(S.g+a-1);pos++;
      if(pos===len){const s=miss?miss>2?1:2:3;want.forEach(x=>star(N,x,s));fan();rain();$("pl").innerHTML=`<div class="msg">${"⭐".repeat(s)} ${rnd(PRAISE)}</div><div class="row"><button class="btn p" id="ag">🔁 مرة ثانية</button></div>`;$("ag").onclick=orderGame}}
    else{miss++;b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");buzz()}};$("pl").appendChild(b)})}
function quiz(){const L=shuf(S.q);let k=0,score=0;
  const step=()=>{if(k>=L.length){fan();rain();openM(`<div class="msg">🏆 ${rnd(PRAISE)}<br>⭐ ${AD(score)} / ${AD(L.length*3)}</div>`);return}
    const [q,a]=L[k];let miss=0;openM(`<div style="height:30px"></div><div class="intro" style="font-size:22px;font-weight:700;text-align:center">${esc(q)}</div><div class="ans" id="an"></div><div class="score">${AD(k+1)} / ${AD(L.length)}</div>`);
    shuf(a.map((x,i)=>[x,i])).forEach(([x,i],c)=>{const b=document.createElement("button");b.textContent=x;b.style.background=COL[c%6];
      b.onclick=()=>{if(i===0){b.classList.add("right");score+=miss?1:3;fan();burstAt(b);k++;setTimeout(step,1100)}else{miss++;b.classList.add("wrong");buzz()}};$("an").appendChild(b)})};step()}
function lessons(B){B.innerHTML=`<div class="box lessons"><h3>🌟 الدروس المستفادة</h3><ul>${(S.l||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>${S.m?`<div class="msg">💖 ${esc(S.m)}</div>`:""}`}
/* modal */
const MD=$("m");function openM(h){$("mb").innerHTML=h;MD.classList.add("show")}function closeM(){MD.classList.remove("show");stop()}
MD.addEventListener("click",e=>{if(e.target===MD||e.target.hasAttribute("data-close"))closeM()});

if(N)surah();else hub();
/* poster pictures: one encrypted file per surah */
if(N)fetch("audio/qp/index.json").then(r=>r.json()).then(L=>{if(!L.includes(N))return;return NAJMA.loadAudio("qp/"+N,"QP"+N).then(o=>{Object.assign(PACK,o||{});if(Object.keys(o||{}).length&&(tab==="story"||tab==="intro"||tab==="learn"))draw()})}).catch(()=>{});
/* decrypt the parent's photos, then redraw */
const jobs=Object.keys(QIMG).filter(k=>!N||k.startsWith(N+":")).map(k=>NAJMA.decrypt(QIMG[k]).then(u=>PH[k]=u).catch(()=>{}));
if(jobs.length)Promise.all(jobs).then(()=>{if(N&&(tab==="story"||tab==="learn"))draw();else if(!N)hub()});
</script>
